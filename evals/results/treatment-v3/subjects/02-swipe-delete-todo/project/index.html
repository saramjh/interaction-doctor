<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>오늘 할 일</title>
<style>
	* { box-sizing: border-box; }
	html, body {
		margin: 0;
		height: 100%;
		font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
		background: #f5f5f7;
		color: #1c1c1e;
	}
	header {
		padding: 16px;
		font-size: 18px;
		font-weight: 700;
		background: #fff;
		border-bottom: 1px solid #e2e2e6;
	}
	#list { padding: 12px; }
	.row {
		position: relative;
		overflow: hidden;
		border-radius: 10px;
		margin-bottom: 8px;
	}
	.delete-bg {
		position: absolute;
		inset: 0;
		background: #ff3b30;
		display: flex;
		align-items: center;
		justify-content: flex-end;
		padding-right: 18px;
		color: #fff;
		font-size: 13px;
		font-weight: 600;
	}
	.item {
		position: relative;
		background: #fff;
		padding: 14px 16px;
		display: flex;
		align-items: center;
		gap: 10px;
		touch-action: pan-y; /* 레시피5 C12 — 세로 스크롤은 브라우저, 가로는 우리 것 */
		user-select: none;
	}
	.item input { width: 18px; height: 18px; }
	.label { font-size: 15px; }
</style>
</head>
<body>
<header>오늘 할 일</header>
<div id="list"></div>

<script>
// 할 일 항목을 왼쪽으로 밀면 빨간 삭제 배경이 드러나고, 충분히 밀면 삭제된다.
//
// treatment-v3: recipes.md 레시피5(스와이프 삭제, 플랫폼 분기)를
// 그대로 적용했다. evals/subjects/02-swipe-delete-todo/project/index.html
// (원본 결함)에서 시작 — 고정 80px 대신 Android 50%/iOS 90% 플랫폼
// 분기 커밋 거리, C9/C12 수평 의도 게이트 + pointercancel 리셋,
// common-pitfalls.md §7-4 게이트(규칙1·2)를 처음부터 적용한다.

const TODOS = [
	"우유 사기",
	"치과 예약",
	"보고서 초안 검토",
	"운동 30분",
	"엄마한테 전화",
	"세탁물 찾기",
];

const listEl = document.getElementById("list");

function render() {
	listEl.innerHTML = "";
	TODOS.forEach((text, i) => {
		const row = document.createElement("div");
		row.className = "row";
		row.innerHTML =
			'<div class="delete-bg">삭제</div>' +
			'<div class="item"><input type="checkbox" /><div class="label">' + text + "</div></div>";
		listEl.appendChild(row);
		attachSwipe(row.querySelector(".item"), row, i);
	});
}

// ---- recipes.md 레시피5 — 그대로 옮김, 수정 없음 ----

const HORIZONTAL_INTENT_PX = 8;
const ANDROID_SWIPE_THRESHOLD_FRACTION = 0.5;
const IOS_FULL_SWIPE_FRACTION = 0.9;

function detectPlatform() {
	const uaDataPlatform = navigator.userAgentData?.platform;
	if (uaDataPlatform === "iOS") return "ios";
	const ua = navigator.userAgent;
	const looksLikeIPadOS = navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1;
	if (/iPhone|iPad|iPod/.test(ua) || looksLikeIPadOS) return "ios";
	return "android";
}

function withSinglePointerGate(el, { onStart, onMove, onEnd } = {}) {
	let activePointerId = null;

	el.addEventListener("pointerdown", (e) => {
		if (activePointerId !== null) return;
		activePointerId = e.pointerId;
		onStart?.(e);
	});

	el.addEventListener("pointermove", (e) => {
		if (e.pointerId !== activePointerId) return;
		onMove?.(e);
	});

	function release(e, cancelled) {
		if (e.pointerId !== activePointerId) return;
		activePointerId = null;
		onEnd?.(e, { cancelled });
	}
	el.addEventListener("pointerup", (e) => release(e, false));
	el.addEventListener("pointercancel", (e) => release(e, true));
}

function attachSwipeAction(item, { onCommit, itemWidthPx, platform }) {
	let startX = 0, startY = 0;
	let horizontalIntentConfirmed = false;
	const threshold = itemWidthPx * (platform === "ios" ? IOS_FULL_SWIPE_FRACTION : ANDROID_SWIPE_THRESHOLD_FRACTION);

	withSinglePointerGate(item, {
		onStart(e) {
			startX = e.clientX;
			startY = e.clientY;
			horizontalIntentConfirmed = false;
		},
		onMove(e) {
			const dx = e.clientX - startX;
			const dy = e.clientY - startY;
			if (!horizontalIntentConfirmed) {
				if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > HORIZONTAL_INTENT_PX) {
					horizontalIntentConfirmed = true;
				} else {
					return;
				}
			}
			item.style.transform = `translateX(${Math.min(0, dx)}px)`;
		},
		onEnd(e, { cancelled }) {
			if (cancelled || !horizontalIntentConfirmed) {
				item.style.transform = "";
				return;
			}
			const dx = e.clientX - startX;
			if (Math.abs(dx) > threshold) {
				onCommit();
			} else {
				item.style.transform = "";
			}
		},
	});
}

// ---- 이 시나리오에 레시피5를 연결하는 부분(레시피 원문 밖) ----

const PLATFORM = detectPlatform();

function attachSwipe(item, row, index) {
	const itemWidthPx = item.getBoundingClientRect().width;
	attachSwipeAction(item, {
		itemWidthPx,
		platform: PLATFORM,
		onCommit() {
			TODOS.splice(index, 1);
			render();
		},
	});
}

render();
</script>
</body>
</html>
