<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>소셜 앱</title>
<style>
	* { box-sizing: border-box; }
	html, body {
		margin: 0;
		height: 100%;
		font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
		background: #fff;
		color: #1c1c1e;
		overflow: hidden;
	}
	#content {
		height: calc(100% - 56px);
		overflow: hidden;
		position: relative;
	}
	.tab-page {
		position: absolute;
		inset: 0;
		padding: 12px;
		display: none;
	}
	.tab-page.active { display: block; }
	#stories {
		display: flex;
		gap: 10px;
		overflow-x: auto;
		padding-bottom: 12px;
	}
	.story {
		flex: 0 0 64px;
		height: 64px;
		border-radius: 50%;
		background: linear-gradient(135deg, #f58529, #dd2a7b, #8134af);
		display: flex;
		align-items: center;
		justify-content: center;
		color: #fff;
		font-size: 11px;
		font-weight: 700;
	}
	.feed-item {
		height: 120px;
		border-radius: 10px;
		background: #f2f2f5;
		margin-bottom: 10px;
	}
	.placeholder {
		display: flex;
		align-items: center;
		justify-content: center;
		height: 100%;
		color: #999;
		font-size: 15px;
	}
	nav {
		height: 56px;
		display: flex;
		border-top: 1px solid #e2e2e6;
	}
	nav button {
		flex: 1;
		border: none;
		background: none;
		font-size: 12px;
		color: #999;
	}
	nav button.active { color: #007aff; font-weight: 700; }
</style>
</head>
<body>
<div id="content">
	<div class="tab-page active" data-tab="0">
		<div id="stories">
			<div class="story">민지</div>
			<div class="story">서준</div>
			<div class="story">하윤</div>
			<div class="story">지호</div>
			<div class="story">유나</div>
			<div class="story">태윤</div>
			<div class="story">아린</div>
		</div>
		<div class="feed-item"></div>
		<div class="feed-item"></div>
		<div class="feed-item"></div>
	</div>
	<div class="tab-page" data-tab="1"><div class="placeholder">검색</div></div>
	<div class="tab-page" data-tab="2"><div class="placeholder">알림</div></div>
	<div class="tab-page" data-tab="3"><div class="placeholder">프로필</div></div>
</div>
<nav>
	<button class="active" data-tab="0">홈</button>
	<button data-tab="1">검색</button>
	<button data-tab="2">알림</button>
	<button data-tab="3">프로필</button>
</nav>

<script>
// 하단 탭을 눌러도 바뀌고, 화면을 좌우로 스와이프해도 탭이 바뀐다.
// 홈 탭 위쪽의 스토리 목록은 자체적으로 옆으로 스크롤된다.

const pages = document.querySelectorAll(".tab-page");
const navButtons = document.querySelectorAll("nav button");
let currentTab = 0;

function goToTab(index) {
	currentTab = Math.max(0, Math.min(pages.length - 1, index));
	pages.forEach((p) => p.classList.toggle("active", Number(p.dataset.tab) === currentTab));
	navButtons.forEach((b) => b.classList.toggle("active", Number(b.dataset.tab) === currentTab));
}

navButtons.forEach((b) => {
	b.addEventListener("click", () => goToTab(Number(b.dataset.tab)));
});

// 좌우 스와이프로 탭 전환
const contentEl = document.getElementById("content");
let startX = 0;
let isTabSwipeArmed = false;

contentEl.addEventListener("pointerdown", (e) => {
	// 스토리 목록 영역(#stories) 내부에서 터치가 시작된 경우 탭 스와이프를 동작시키지 않는다.
	if (e.target.closest("#stories")) {
		isTabSwipeArmed = false;
		return;
	}
	isTabSwipeArmed = true;
	startX = e.clientX;
});

contentEl.addEventListener("pointerup", (e) => {
	if (!isTabSwipeArmed) return;

	const dx = e.clientX - startX;
	if (Math.abs(dx) > 60) {
		goToTab(currentTab + (dx < 0 ? 1 : -1));
	}
	isTabSwipeArmed = false;
});

contentEl.addEventListener("pointercancel", () => {
	isTabSwipeArmed = false;
});
</script>
</body>
</html>
