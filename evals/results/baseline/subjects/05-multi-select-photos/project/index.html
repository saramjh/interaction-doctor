<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>사진</title>
<style>
	* { box-sizing: border-box; }
	html, body {
		margin: 0;
		height: 100%;
		font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
		background: #000;
		color: #eee;
	}
	header {
		display: flex;
		justify-content: space-between;
		align-items: center;
		padding: 16px;
		font-size: 18px;
		font-weight: 700;
		height: 56px;
	}
	.header-actions {
		display: flex;
		gap: 16px;
	}
	.header-btn {
		background: none;
		border: none;
		font-size: 16px;
		font-weight: bold;
		cursor: pointer;
		display: none;
		padding: 0;
	}
	#cancel-btn {
		color: #007aff;
	}
	#delete-btn {
		color: #ff3b30;
	}
	.header-btn:active {
		opacity: 0.6;
	}
	#grid {
		display: grid;
		grid-template-columns: repeat(3, 1fr);
		gap: 2px;
		padding: 2px;
	}
	.photo {
		aspect-ratio: 1;
		position: relative;
		background: linear-gradient(135deg, #444, #222);
		user-select: none;
		touch-action: manipulation;
	}
	.photo:nth-child(3n+1) { background: linear-gradient(135deg, #ff9a9e, #6a5acd); }
	.photo:nth-child(3n+2) { background: linear-gradient(135deg, #84fab0, #2b5876); }
	.photo:nth-child(3n)   { background: linear-gradient(135deg, #f6d365, #c33764); }
	.checkmark {
		position: absolute;
		top: 6px;
		right: 6px;
		width: 20px;
		height: 20px;
		border-radius: 50%;
		background: #fff;
		display: none;
		align-items: center;
		justify-content: center;
		font-size: 12px;
		color: #000;
		font-weight: 700;
	}
	.photo.selected .checkmark { display: flex; }
	.photo.selected::after {
		content: "";
		position: absolute;
		inset: 0;
		background: rgba(0,122,255,0.35);
	}
</style>
</head>
<body>
<header id="header">
	<span id="header-text">사진 9장</span>
	<div class="header-actions">
		<button id="cancel-btn" class="header-btn">취소</button>
		<button id="delete-btn" class="header-btn">삭제</button>
	</div>
</header>
<div id="grid"></div>

<script>
// 사진을 길게 누르면 다중 선택 모드로 들어간다.
// 다중 선택 모드에서는 다른 사진을 탭하면 그 사진도 선택 목록에 추가된다.

const PHOTO_COUNT = 9;
const gridEl = document.getElementById("grid");
const headerTextEl = document.getElementById("header-text");
const cancelBtn = document.getElementById("cancel-btn");
const deleteBtn = document.getElementById("delete-btn");

let selectMode = false;
const selected = new Set();

function updateHeader() {
	const totalPhotos = gridEl.querySelectorAll(".photo").length;
	if (selectMode) {
		headerTextEl.textContent = selected.size + "장 선택됨";
		cancelBtn.style.display = "block";
		deleteBtn.style.display = selected.size > 0 ? "block" : "none";
	} else {
		headerTextEl.textContent = "사진 " + totalPhotos + "장";
		cancelBtn.style.display = "none";
		deleteBtn.style.display = "none";
	}
}

function enterSelectMode(tile) {
	selectMode = true;
	selected.add(tile);
	tile.classList.add("selected");
	updateHeader();
}

function toggleSelection(tile) {
	if (selected.has(tile)) {
		selected.delete(tile);
		tile.classList.remove("selected");
	} else {
		selected.add(tile);
		tile.classList.add("selected");
	}
	updateHeader();
}

function deleteSelected() {
	if (!selectMode || selected.size === 0) return;
	selected.forEach(tile => {
		tile.remove();
	});
	selected.clear();
	selectMode = false;
	updateHeader();
}

function cancelSelectMode() {
	selected.forEach(tile => {
		tile.classList.remove("selected");
	});
	selected.clear();
	selectMode = false;
	updateHeader();
}

cancelBtn.addEventListener("click", cancelSelectMode);
deleteBtn.addEventListener("click", deleteSelected);

for (let i = 0; i < PHOTO_COUNT; i++) {
	const tile = document.createElement("div");
	tile.className = "photo";
	tile.dataset.index = String(i);
	tile.innerHTML = '<div class="checkmark">✓</div>';
	gridEl.appendChild(tile);

	let pressTimer = null;
	let preventClick = false;

	tile.addEventListener("pointerdown", () => {
		preventClick = false;
		pressTimer = setTimeout(() => {
			if (!selectMode) {
				enterSelectMode(tile);
				preventClick = true;
			}
		}, 500);
	});

	tile.addEventListener("pointerup", () => {
		clearTimeout(pressTimer);
	});

	tile.addEventListener("pointercancel", () => {
		clearTimeout(pressTimer);
	});

	// 다중 선택 모드에서 사진을 탭하면 선택/해제를 토글한다.
	tile.addEventListener("click", () => {
		if (preventClick) {
			preventClick = false;
			return;
		}
		if (!selectMode) return;
		toggleSelection(tile);
	});
}
</script>
</body>
</html>
