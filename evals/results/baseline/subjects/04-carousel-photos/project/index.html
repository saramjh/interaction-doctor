<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>여행 앨범</title>
<style>
	* { box-sizing: border-box; }
	html, body {
		margin: 0;
		height: 100%;
		font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
		background: #111;
		color: #eee;
		overflow: hidden;
	}
	header {
		padding: 16px;
		font-size: 18px;
		font-weight: 700;
	}
	/* 사진을 한 장씩 넘겨보는 뷰어. 스와이프해서 다음/이전 사진으로 이동한다. */
	#viewer {
		display: flex;
		overflow-x: auto;
		height: calc(100% - 56px);
		-webkit-overflow-scrolling: touch;
		scroll-snap-type: x mandatory;
		scrollbar-width: none; /* Firefox 스크롤바 숨기기 */
	}
	#viewer::-webkit-scrollbar {
		display: none; /* Chrome, Safari, Opera 스크롤바 숨기기 */
	}
	.photo {
		flex: 0 0 100%;
		height: 100%;
		display: flex;
		align-items: center;
		justify-content: center;
		font-size: 28px;
		font-weight: 800;
		color: rgba(255,255,255,0.35);
		scroll-snap-align: start;
	}
	.photo:nth-child(1) { background: linear-gradient(135deg, #ff9a9e, #fecfef); }
	.photo:nth-child(2) { background: linear-gradient(135deg, #a18cd1, #fbc2eb); }
	.photo:nth-child(3) { background: linear-gradient(135deg, #84fab0, #8fd3f4); }
	.photo:nth-child(4) { background: linear-gradient(135deg, #f6d365, #fda085); }
	.photo:nth-child(5) { background: linear-gradient(135deg, #30cfd0, #330867); }
</style>
</head>
<body>
<header>여행 앨범 · 5장</header>
<div id="viewer">
	<div class="photo">1</div>
	<div class="photo">2</div>
	<div class="photo">3</div>
	<div class="photo">4</div>
	<div class="photo">5</div>
</div>
</body>
</html>
