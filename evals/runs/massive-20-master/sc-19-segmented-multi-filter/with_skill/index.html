<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Multi Filter (With Skill - Interaction Doctor)</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 30px 16px;
    background: #0f172a;
    color: #f8fafc;
    display: flex;
    flex-direction: column;
    align-items: center;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
  }
  .card-box {
    background: #1e293b;
    border: 1px solid #334155;
    padding: 24px 20px;
    border-radius: 20px;
    width: 100%;
    max-width: 420px;
  }
  .filter-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-top: 16px;
  }
  .filter-chip {
    padding: 10px 18px;
    background: #090d16;
    border: 1.5px solid #334155;
    border-radius: 24px;
    color: #94a3b8;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    touch-action: manipulation; /* 300ms 탭 딜레이 완전 0 */
    display: flex;
    align-items: center;
    gap: 6px;
    transition: transform 0.12s, background 0.15s, border-color 0.15s, color 0.15s;
  }
  .filter-chip:active {
    transform: scale(0.92);
  }
  .filter-chip.active {
    background: rgba(56, 189, 248, 0.15);
    border-color: #38bdf8;
    color: #38bdf8;
    box-shadow: 0 0 12px rgba(56, 189, 248, 0.25);
  }
  .check-mark {
    display: none;
    font-weight: 800;
  }
  .filter-chip.active .check-mark {
    display: inline;
  }
  .result-counter {
    margin-top: 20px;
    font-size: 13px;
    color: #cbd5e1;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-top: 1px solid #334155;
    padding-top: 16px;
  }
</style>
</head>
<body>

<div class="card-box">
  <h3 style="font-size:16px; margin-bottom:4px;">🔍 쇼핑 검색 필터</h3>
  <p style="font-size:12px; color:#94a3b8;">빠르게 연속 탭해도 딜레이나 씹힘 없이 즉각 반응합니다.</p>

  <div class="filter-grid" id="filterGrid">
    <div class="filter-chip active"><span class="check-mark">✓</span> 무료 배송</div>
    <div class="filter-chip"><span class="check-mark">✓</span> 쿠폰 적용</div>
    <div class="filter-chip active"><span class="check-mark">✓</span> 당일 발송</div>
    <div class="filter-chip"><span class="check-mark">✓</span> 리뷰 4.5 이상</div>
    <div class="filter-chip"><span class="check-mark">✓</span> 정품 인증</div>
    <div class="filter-chip"><span class="check-mark">✓</span> 친환경 패키지</div>
  </div>

  <div class="result-counter">
    <span>선택된 필터: <strong id="selectedCount" style="color:#38bdf8;">2개</strong></span>
    <button id="btnReset" style="background:transparent; border:none; color:#94a3b8; font-size:12px; cursor:pointer;">초기화</button>
  </div>
</div>

<script>
  const chips = document.querySelectorAll('.filter-chip');
  const countEl = document.getElementById('selectedCount');
  const btnReset = document.getElementById('btnReset');

  function updateCount() {
    const actCount = document.querySelectorAll('.filter-chip.active').length;
    countEl.textContent = `${actCount}개`;
  }

  chips.forEach(chip => {
    chip.addEventListener('click', () => {
      chip.classList.toggle('active');
      if (navigator.vibrate) navigator.vibrate(15);
      updateCount();
    });
  });

  btnReset.addEventListener('click', () => {
    chips.forEach(c => c.classList.remove('active'));
    updateCount();
  });
</script>
</body>
</html>
