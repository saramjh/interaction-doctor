<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Rotary Knob (With Skill - Interaction Doctor)</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 30px 16px;
    background: #0f172a;
    color: #f8fafc;
    display: flex;
    flex-direction: column;
    align-items: center;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
  }
  .card-box {
    background: #1e293b;
    border: 1px solid #334155;
    padding: 28px 24px;
    border-radius: 20px;
    width: 100%;
    max-width: 380px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .knob-container {
    position: relative;
    width: 200px;
    height: 200px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 20px 0;
    touch-action: none; /* 브라우저 스크롤 차단 */
  }
  svg {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    transform: rotate(135deg);
    pointer-events: none;
  }
  .track-ring {
    stroke: #334155;
    stroke-width: 12;
    fill: none;
    stroke-dasharray: 424;
    stroke-dashoffset: 106; /* 270도만 표시 */
    stroke-linecap: round;
  }
  .progress-ring {
    stroke: #38bdf8;
    stroke-width: 12;
    fill: none;
    stroke-dasharray: 424;
    stroke-dashoffset: 424;
    stroke-linecap: round;
    transition: stroke-dashoffset 0.05s;
  }
  .knob-rotor {
    width: 130px;
    height: 130px;
    background: #090d16;
    border: 3px solid #334155;
    border-radius: 50%;
    box-shadow: 0 8px 24px rgba(0,0,0,0.6);
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: grab;
    touch-action: none;
    will-change: transform;
    transform: rotate(-135deg);
  }
  .knob-container.active .knob-rotor {
    cursor: grabbing;
    border-color: #38bdf8;
    box-shadow: 0 0 20px rgba(56, 189, 248, 0.4);
  }
  .rotor-indicator {
    position: absolute;
    top: 14px;
    width: 6px;
    height: 16px;
    background: #38bdf8;
    border-radius: 3px;
    box-shadow: 0 0 8px #38bdf8;
  }
  .temp-display {
    font-size: 22px;
    font-weight: 800;
    color: #f8fafc;
  }
</style>
</head>
<body>

<div class="card-box">
  <h3 style="font-size:16px; margin-bottom:4px;">🌡️ 스마트홈 온도 다이얼</h3>
  <p style="font-size:12px; color:#94a3b8;">원형 다이얼을 터치하고 돌려 온도를 조절하세요 (16°C ~ 30°C).</p>

  <div class="knob-container" id="knobContainer">
    <svg viewBox="0 0 200 200">
      <circle class="track-ring" cx="100" cy="100" r="75"></circle>
      <circle class="progress-ring" id="ring" cx="100" cy="100" r="75"></circle>
    </svg>

    <div class="knob-rotor" id="rotor">
      <div class="rotor-indicator"></div>
      <div class="temp-display" id="tempDisplay">16.0°C</div>
    </div>
  </div>
</div>

<script>
  const container = document.getElementById('knobContainer');
  const rotor = document.getElementById('rotor');
  const ring = document.getElementById('ring');
  const tempDisplay = document.getElementById('tempDisplay');

  const MIN_DEG = -135;
  const MAX_DEG = 135;
  const SWEEP = 270;
  const CIRCUMFERENCE = 424; // 2 * PI * 75 * (270/360) ≈ 353
  const MAX_OFFSET = 106;

  let activePointerId = null;

  function updateKnob(clientX, clientY) {
    const rect = container.getBoundingClientRect();
    const cx = rect.left + rect.width / 2;
    const cy = rect.top + rect.height / 2;

    const rad = Math.atan2(clientY - cy, clientX - cx);
    let deg = (rad * 180) / Math.PI + 90;
    if (deg > 180) deg -= 360;

    // -135 ~ 135 각도 클램핑
    const clampedDeg = Math.max(MIN_DEG, Math.min(MAX_DEG, deg));
    rotor.style.transform = `rotate(${clampedDeg}deg)`;

    const pct = (clampedDeg - MIN_DEG) / SWEEP;
    const offset = CIRCUMFERENCE - (pct * (CIRCUMFERENCE - MAX_OFFSET));
    ring.style.strokeDashoffset = offset;

    const temp = (16.0 + pct * 14.0).toFixed(1);
    tempDisplay.textContent = `${temp}°C`;
  }

  container.addEventListener('pointerdown', (e) => {
    if (activePointerId !== null) return;
    activePointerId = e.pointerId;
    try { container.setPointerCapture(e.pointerId); } catch(err) {}
    container.classList.add('active');
    updateKnob(e.clientX, e.clientY);
  });

  container.addEventListener('pointermove', (e) => {
    if (e.pointerId !== activePointerId) return;
    updateKnob(e.clientX, e.clientY);
  });

  const release = (e) => {
    if (e.pointerId !== activePointerId) return;
    activePointerId = null;
    container.classList.remove('active');
    try { container.releasePointerCapture(e.pointerId); } catch(err) {}
  };

  container.addEventListener('pointerup', release);
  container.addEventListener('pointercancel', release);
</script>
</body>
</html>
