<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Audio Waveform Scrubber (With Skill - Interaction Doctor)</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 30px 16px;
    background: #0f172a;
    color: #f8fafc;
    display: flex;
    flex-direction: column;
    align-items: center;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
  }
  .card-box {
    background: #1e293b;
    border: 1px solid #334155;
    padding: 24px;
    border-radius: 20px;
    width: 100%;
    max-width: 440px;
  }
  .time-display {
    display: flex;
    justify-content: space-between;
    font-family: monospace;
    font-size: 14px;
    color: #38bdf8;
    margin-bottom: 16px;
  }
  .scrubber-wrapper {
    position: relative;
    width: 100%;
    height: 72px;
    background: #090d16;
    border-radius: 12px;
    padding: 0 12px;
    display: flex;
    align-items: center;
    cursor: pointer;
    touch-action: none; /* 브라우저 스크롤 완전 억제 */
    box-shadow: inset 0 2px 8px rgba(0,0,0,0.4);
  }
  .waveform-bars {
    width: 100%;
    height: 48px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 3px;
    pointer-events: none;
  }
  .bar {
    flex: 1;
    background: #334155;
    border-radius: 2px;
    transition: background 0.1s;
  }
  .bar.played { background: #38bdf8; }
  .scrubber-head {
    position: absolute;
    top: 0;
    left: 30%;
    width: 32px;
    height: 100%;
    transform: translateX(-50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    will-change: left;
  }
  .head-line {
    width: 2px;
    height: 100%;
    background: #ffffff;
    box-shadow: 0 0 8px #38bdf8;
  }
  .head-bubble {
    position: absolute;
    top: -28px;
    background: #38bdf8;
    color: #0f172a;
    font-size: 11px;
    font-weight: 700;
    padding: 2px 6px;
    border-radius: 6px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.3);
  }
</style>
</head>
<body>

<div class="card-box">
  <h3 style="font-size:16px; margin-bottom:4px;">🎙️ 팟캐스트 오디오 스크러버</h3>
  <p style="font-size:12px; color:#94a3b8; margin-bottom:14px;">파형을 가볍게 터치하거나 드래그하면 1:1로 즉각 탐색됩니다.</p>

  <div class="time-display">
    <span id="currentTime">01:14</span>
    <span>03:45</span>
  </div>

  <div class="scrubber-wrapper" id="wrapper">
    <div class="waveform-bars" id="bars"></div>
    <div class="scrubber-head" id="head">
      <div class="head-bubble" id="bubble">01:14</div>
      <div class="head-line"></div>
    </div>
  </div>
</div>

<script>
  const wrapper = document.getElementById('wrapper');
  const head = document.getElementById('head');
  const bubble = document.getElementById('bubble');
  const curTime = document.getElementById('currentTime');
  const barsContainer = document.getElementById('bars');

  const TOTAL_SEC = 225; // 3분 45초
  let activePointerId = null;
  const barHeights = [20, 35, 45, 28, 50, 65, 40, 55, 70, 48, 60, 30, 45, 68, 52, 38, 58, 42, 64, 40, 25, 50, 60, 35, 45, 55, 65, 40, 30, 50, 40, 20];

  // 바 생성
  barHeights.forEach((h, i) => {
    const b = document.createElement('div');
    b.className = 'bar' + (i < 10 ? ' played' : '');
    b.style.height = `${h * 0.6}px`;
    barsContainer.appendChild(b);
  });

  function updateScrubber(clientX) {
    const rect = wrapper.getBoundingClientRect();
    const x = Math.max(0, Math.min(rect.width, clientX - rect.left));
    const pct = x / rect.width;

    head.style.left = `${pct * 100}%`;

    const sec = Math.round(pct * TOTAL_SEC);
    const m = String(Math.floor(sec / 60)).padStart(2, '0');
    const s = String(sec % 60).padStart(2, '0');
    bubble.textContent = `${m}:${s}`;
    curTime.textContent = `${m}:${s}`;

    // 바 색상 실시간 업데이트
    const bars = barsContainer.children;
    const activeIdx = Math.floor(pct * bars.length);
    for (let i = 0; i < bars.length; i++) {
      bars[i].classList.toggle('played', i <= activeIdx);
    }
  }

  wrapper.addEventListener('pointerdown', (e) => {
    if (activePointerId !== null) return;
    activePointerId = e.pointerId;
    try { wrapper.setPointerCapture(e.pointerId); } catch(err) {}
    updateScrubber(e.clientX);
  });

  wrapper.addEventListener('pointermove', (e) => {
    if (e.pointerId !== activePointerId) return;
    updateScrubber(e.clientX);
  });

  const release = (e) => {
    if (e.pointerId !== activePointerId) return;
    activePointerId = null;
    try { wrapper.releasePointerCapture(e.pointerId); } catch(err) {}
  };

  wrapper.addEventListener('pointerup', release);
  wrapper.addEventListener('pointercancel', release);
</script>
</body>
</html>
