<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Audio Waveform Scrubber (Without Skill)</title>
<style>
body { font-family:sans-serif; padding:30px; background:#111; color:#fff; display:flex; flex-direction:column; align-items:center; }
.wave-container { position:relative; width:300px; height:80px; background:#222; border-radius:8px; display:flex; align-items:center; justify-content:center; }
.wave-bars { display:flex; gap:4px; align-items:center; height:60px; }
.bar { width:6px; background:#555; border-radius:3px; }
.progress-line { position:absolute; top:0; left:30%; width:2px; height:100%; background:#007bff; }
</style>
</head>
<body>
<h3>오디오 웨이브폼 (Without Skill)</h3>
<p style="font-size:12px; color:#aaa;">파형을 좌우로 스크러빙할 때 세로 스크롤과 간섭이 생기며 드래그가 끊깁니다.</p>
<div class="wave-container" id="container">
  <div class="wave-bars">
    <div class="bar" style="height:30px;"></div><div class="bar" style="height:50px;"></div>
    <div class="bar" style="height:20px;"></div><div class="bar" style="height:60px;"></div>
    <div class="bar" style="height:40px;"></div><div class="bar" style="height:55px;"></div>
    <div class="bar" style="height:25px;"></div><div class="bar" style="height:45px;"></div>
  </div>
  <div class="progress-line" id="line"></div>
</div>
<script>
const container = document.getElementById('container');
const line = document.getElementById('line');
let isDown = false;
container.ontouchstart = () => isDown = true;
window.ontouchend = () => isDown = false;
window.addEventListener('touchmove', (e) => {
  if (!isDown) return;
  const rect = container.getBoundingClientRect();
  const x = e.touches[0].clientX - rect.left;
  line.style.left = Math.max(0, Math.min(rect.width, x)) + 'px';
});
</script>
</body>
</html>
