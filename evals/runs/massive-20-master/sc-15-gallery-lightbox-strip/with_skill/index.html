<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Gallery Lightbox (With Skill - Interaction Doctor)</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    margin: 0;
    padding: 24px 16px;
    background: #0f172a;
    color: #f8fafc;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
  }
  .gallery-card {
    width: 100%;
    max-width: 440px;
    background: #1e293b;
    border: 1px solid #334155;
    border-radius: 20px;
    padding: 20px;
    overflow: hidden;
  }
  .main-stage {
    position: relative;
    width: 100%;
    height: 240px;
    background: #090d16;
    border-radius: 14px;
    overflow: hidden;
    touch-action: pan-y; /* 세로 스크롤 허용, 가로 스와이프 전용 */
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .stage-img {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-size: 32px;
    will-change: transform;
    transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .stage-img.swiping {
    transition: none;
  }
  .thumb-strip {
    display: flex;
    gap: 10px;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    overscroll-behavior-x: contain;
    touch-action: pan-x;
    padding: 14px 0 4px 0;
    scrollbar-width: none;
  }
  .thumb-strip::-webkit-scrollbar { display: none; }
  .thumb-item {
    flex: 0 0 64px;
    height: 64px;
    background: #090d16;
    border: 2px solid #334155;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    cursor: pointer;
    touch-action: manipulation;
    transition: border-color 0.15s, transform 0.15s;
  }
  .thumb-item.active {
    border-color: #38bdf8;
    transform: scale(1.08);
    box-shadow: 0 0 10px rgba(56, 189, 248, 0.4);
  }
</style>
</head>
<body>

<div class="gallery-card">
  <h3 style="font-size:16px; margin-bottom:4px;">🖼️ 인터랙티브 포토 갤러리</h3>
  <p style="font-size:12px; color:#94a3b8; margin-bottom:14px;">상단 사진을 좌우로 스와이프하거나 하단 썸네일을 탭하세요.</p>

  <div class="main-stage" id="stage">
    <div class="stage-img" id="stageImg">
      <div id="imgIcon">🌄</div>
      <div style="font-size:14px; font-weight:700; color:#cbd5e1; margin-top:8px;" id="imgTitle">풍경 1: 알프스 설산</div>
    </div>
  </div>

  <div class="thumb-strip" id="thumbStrip">
    <div class="thumb-item active" data-idx="0" data-icon="🌄" data-title="풍경 1: 알프스 설산">🌄</div>
    <div class="thumb-item" data-idx="1" data-icon="🌊" data-title="풍경 2: 에메랄드 해변">🌊</div>
    <div class="thumb-item" data-idx="2" data-icon="🏙️" data-title="풍경 3: 도쿄 야경">🏙️</div>
    <div class="thumb-item" data-idx="3" data-icon="🌲" data-title="풍경 4: 침엽수림 숲">🌲</div>
    <div class="thumb-item" data-idx="4" data-icon="🏜️" data-title="풍경 5: 사막의 일몰">🏜️</div>
    <div class="thumb-item" data-idx="5" data-icon="🌌" data-title="풍경 6: 은하수 밤하늘">🌌</div>
  </div>
</div>

<script>
  const stage = document.getElementById('stage');
  const stageImg = document.getElementById('stageImg');
  const imgIcon = document.getElementById('imgIcon');
  const imgTitle = document.getElementById('imgTitle');
  const thumbs = Array.from(document.querySelectorAll('.thumb-item'));

  let currentIdx = 0;

  function selectPhoto(idx) {
    if (idx < 0 || idx >= thumbs.length) return;
    currentIdx = idx;

    thumbs.forEach((t, i) => t.classList.toggle('active', i === idx));
    const targetThumb = thumbs[idx];
    imgIcon.textContent = targetThumb.dataset.icon;
    imgTitle.textContent = targetThumb.dataset.title;

    targetThumb.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
  }

  thumbs.forEach((t, i) => {
    t.addEventListener('click', () => selectPhoto(i));
  });

  // 메인 스테이지 스와이프
  let startX = 0, startY = 0;
  let activePointerId = null;
  let isSwiping = false;

  stage.addEventListener('pointerdown', (e) => {
    if (activePointerId !== null) return;
    activePointerId = e.pointerId;
    startX = e.clientX;
    startY = e.clientY;
    isSwiping = false;
  });

  stage.addEventListener('pointermove', (e) => {
    if (e.pointerId !== activePointerId) return;
    const dx = e.clientX - startX;
    const dy = e.clientY - startY;

    if (!isSwiping && Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 8) {
      isSwiping = true;
      stageImg.classList.add('swiping');
    }

    if (isSwiping) {
      stageImg.style.transform = `translate3d(${dx}px, 0, 0)`;
    }
  });

  const onRelease = (e) => {
    if (e.pointerId !== activePointerId) return;
    stageImg.classList.remove('swiping');
    stageImg.style.transform = 'translate3d(0, 0, 0)';

    if (isSwiping) {
      const dx = e.clientX - startX;
      if (dx < -50 && currentIdx < thumbs.length - 1) {
        selectPhoto(currentIdx + 1);
      } else if (dx > 50 && currentIdx > 0) {
        selectPhoto(currentIdx - 1);
      }
    }

    activePointerId = null;
    isSwiping = false;
  };

  stage.addEventListener('pointerup', onRelease);
  stage.addEventListener('pointercancel', onRelease);
</script>
</body>
</html>
