<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Fixed Column Table (With Skill - Interaction Doctor)</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 24px 16px;
    background: #0f172a;
    color: #f8fafc;
  }
  .card-box {
    background: #1e293b;
    border: 1px solid #334155;
    padding: 20px;
    border-radius: 20px;
    max-width: 440px;
    margin: 0 auto;
  }
  .table-wrapper {
    position: relative;
    width: 100%;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    overscroll-behavior-x: contain;
    border: 1px solid #334155;
    border-radius: 12px;
    margin-top: 12px;
  }
  table {
    border-collapse: collapse;
    width: 650px;
    font-size: 13px;
  }
  th, td {
    padding: 12px 14px;
    border-bottom: 1px solid #334155;
    text-align: left;
    white-space: nowrap;
  }
  th {
    background: #090d16;
    color: #94a3b8;
    font-weight: 600;
  }
  .sticky-col {
    position: sticky;
    left: 0;
    background: #1e293b;
    z-index: 2;
    box-shadow: 4px 0 8px rgba(0,0,0,0.3);
    will-change: transform;
    font-weight: 700;
    color: #38bdf8;
  }
  th.sticky-col {
    background: #090d16;
    z-index: 3;
  }
</style>
</head>
<body>

<div class="card-box">
  <h3 style="font-size:16px; margin-bottom:4px;">📊 데이터 테이블 (고정 컬럼)</h3>
  <p style="font-size:12px; color:#94a3b8;">좌우로 스크롤해도 '회원명' 컬럼이 흔들림 없이 왼쪽에 고정됩니다.</p>

  <div class="table-wrapper">
    <table>
      <thead>
        <tr>
          <th class="sticky-col">회원명</th>
          <th>이메일</th>
          <th>보유 자산</th>
          <th>가입일</th>
          <th>상태</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td class="sticky-col">김민수</td>
          <td>minsu@domain.com</td>
          <td>₩12,450,000</td>
          <td>2026-03-12</td>
          <td><span style="color:#22c55e;">정상</span></td>
        </tr>
        <tr>
          <td class="sticky-col">이지은</td>
          <td>jieun@domain.com</td>
          <td>₩8,900,000</td>
          <td>2026-04-05</td>
          <td><span style="color:#22c55e;">정상</span></td>
        </tr>
        <tr>
          <td class="sticky-col">박서준</td>
          <td>seojun@domain.com</td>
          <td>₩45,120,000</td>
          <td>2026-05-18</td>
          <td><span style="color:#eab308;">검토중</span></td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
</body>
</html>
