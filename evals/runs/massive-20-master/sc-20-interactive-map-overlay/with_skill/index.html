<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Map Overlay (With Skill - Interaction Doctor)</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    margin: 0;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    background: #090d16;
    color: #f8fafc;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
  }
  .map-viewport {
    position: relative;
    width: 100%;
    height: 100%;
    overflow: hidden;
    touch-action: none; /* 지도 2D 패닝 전용 */
    background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
  }
  .map-canvas {
    position: absolute;
    width: 200%;
    height: 200%;
    top: -50%;
    left: -50%;
    background-image: 
      linear-gradient(rgba(56, 189, 248, 0.1) 1px, transparent 1px),
      linear-gradient(90deg, rgba(56, 189, 248, 0.1) 1px, transparent 1px);
    background-size: 40px 40px;
    display: flex;
    align-items: center;
    justify-content: center;
    will-change: transform;
    cursor: grab;
  }
  .map-canvas.panning {
    cursor: grabbing;
  }
  .pin-marker {
    position: absolute;
    display: flex;
    flex-direction: column;
    align-items: center;
    cursor: pointer;
  }
  .pin-icon {
    font-size: 28px;
    filter: drop-shadow(0 4px 8px rgba(0,0,0,0.5));
  }
  .pin-label {
    background: #1e293b;
    border: 1px solid #38bdf8;
    color: #38bdf8;
    font-size: 11px;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 12px;
    margin-top: 2px;
  }
  .place-drawer {
    position: fixed;
    bottom: 0;
    left: 0;
    width: 100%;
    background: #1e293b;
    border-top: 1px solid #334155;
    border-radius: 20px 20px 0 0;
    padding: 12px 20px 24px 20px;
    box-shadow: 0 -10px 30px rgba(0,0,0,0.5);
    z-index: 100;
    touch-action: pan-y; /* 드로어 내부 제스처 격리 */
    transform: translate3d(0, 0, 0);
    transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .drawer-handle {
    width: 36px;
    height: 4px;
    background: #475569;
    border-radius: 2px;
    margin: 0 auto 12px auto;
  }
</style>
</head>
<body>

<div class="map-viewport" id="viewport">
  <div class="map-canvas" id="canvas">
    <div class="pin-marker" style="top:45%; left:48%;">
      <div class="pin-icon">📍</div>
      <div class="pin-label">강남 플래그십</div>
    </div>
    <div class="pin-marker" style="top:55%; left:58%;">
      <div class="pin-icon">☕</div>
      <div class="pin-label">블루 라운지</div>
    </div>
  </div>
</div>

<div class="place-drawer" id="drawer">
  <div class="drawer-handle"></div>
  <div style="display:flex; justify-content:space-between; align-items:center;">
    <div>
      <h3 style="font-size:16px; color:#f8fafc;">📍 강남 플래그십 스토어</h3>
      <p style="font-size:12px; color:#94a3b8; margin-top:2px;">서울시 강남구 테헤란로 123 (영업중)</p>
    </div>
    <button style="background:#38bdf8; color:#0f172a; border:none; padding:8px 14px; border-radius:8px; font-weight:700; font-size:12px; touch-action:manipulation;">길찾기</button>
  </div>
</div>

<script>
  const viewport = document.getElementById('viewport');
  const canvas = document.getElementById('canvas');
  const drawer = document.getElementById('drawer');

  let activePointerId = null;
  let startX = 0, startY = 0;
  let curPanX = 0, curPanY = 0;

  viewport.addEventListener('pointerdown', (e) => {
    // 드로어 영역 터치 시 지도 패닝 무시 (이벤트 격리)
    if (drawer.contains(e.target)) return;
    if (activePointerId !== null) return;

    activePointerId = e.pointerId;
    try { viewport.setPointerCapture(e.pointerId); } catch(err) {}
    startX = e.clientX - curPanX;
    startY = e.clientY - curPanY;
    canvas.classList.add('panning');
  });

  viewport.addEventListener('pointermove', (e) => {
    if (e.pointerId !== activePointerId) return;
    curPanX = e.clientX - startX;
    curPanY = e.clientY - startY;
    canvas.style.transform = `translate3d(${curPanX}px, ${curPanY}px, 0)`;
  });

  const releasePan = (e) => {
    if (e.pointerId !== activePointerId) return;
    activePointerId = null;
    canvas.classList.remove('panning');
    try { viewport.releasePointerCapture(e.pointerId); } catch(err) {}
  };

  viewport.addEventListener('pointerup', releasePan);
  viewport.addEventListener('pointercancel', releasePan);

  // 드로어 터치 이벤트가 지도로 전파되지 않도록 차단
  drawer.addEventListener('pointerdown', (e) => e.stopPropagation());
</script>
</body>
</html>
