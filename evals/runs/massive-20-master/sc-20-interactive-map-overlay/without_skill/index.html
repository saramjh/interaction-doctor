<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Map Overlay (Without Skill)</title>
<style>
body { margin:0; height:100vh; font-family:sans-serif; overflow:hidden; }
.map { width:100%; height:100%; background:#a8dadc; display:flex; align-items:center; justify-content:center; }
.card { position:fixed; bottom:0; left:0; width:100%; height:150px; background:#fff; border-radius:16px 16px 0 0; padding:10px; }
</style>
</head>
<body>
<div class="map" id="map">🗺️ 지도 패닝 영역 (카드를 터치해도 지도가 끌립니다)</div>
<div class="card" id="card">
  <h4>장소 정보 카드</h4>
  <p>이 카드를 위로 끌 때 지도와 터치가 엉킵니다.</p>
</div>
<script>
let startX=0, startY=0;
document.getElementById('map').ontouchstart = (e) => { startX=e.touches[0].clientX; startY=e.touches[0].clientY; };
document.getElementById('map').ontouchmove = (e) => {
  const dx = e.touches[0].clientX - startX;
  const dy = e.touches[0].clientY - startY;
  document.getElementById('map').style.transform = `translate(${dx}px, ${dy}px)`;
};
</script>
</body>
</html>
