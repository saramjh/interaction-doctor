<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OTP Input (Without Skill)</title>
<style>
body { font-family:sans-serif; padding:30px; display:flex; flex-direction:column; align-items:center; }
.otp-box { display:flex; gap:8px; }
input { width:40px; height:50px; text-align:center; font-size:20px; }
</style>
</head>
<body>
<h3>인증번호 입력 (Without Skill)</h3>
<div class="otp-box">
  <input maxlength="1"><input maxlength="1"><input maxlength="1">
  <input maxlength="1"><input maxlength="1"><input maxlength="1">
</div>
<script>
const inputs = document.querySelectorAll('input');
inputs.forEach((input, index) => {
  input.onkeyup = (e) => {
    if (input.value && index < inputs.length - 1) inputs[index + 1].focus();
  };
});
</script>
</body>
</html>
