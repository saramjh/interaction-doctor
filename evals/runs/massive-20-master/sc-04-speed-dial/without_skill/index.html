<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Speed Dial FAB (Without Skill)</title>
<style>
body { font-family:sans-serif; margin:0; height:150vh; background:#f0f0f0; }
.fab-container { position:fixed; bottom:20px; right:20px; }
.fab-main { width:56px; height:56px; background:#007bff; border-radius:50%; color:#fff; display:flex; align-items:center; justify-content:center; font-size:24px; cursor:pointer; }
.fab-menu { display:none; flex-direction:column; gap:10px; margin-bottom:10px; }
.fab-item { width:40px; height:40px; background:#fff; border-radius:50%; display:flex; align-items:center; justify-content:center; }
</style>
</head>
<body>
<div class="fab-container">
  <div class="fab-menu" id="menu">
    <div class="fab-item">📷</div>
    <div class="fab-item">✏️</div>
  </div>
  <div class="fab-main" id="fab">+</div>
</div>
<script>
const fab = document.getElementById('fab');
const menu = document.getElementById('menu');
fab.onclick = () => {
  menu.style.display = menu.style.display === 'flex' ? 'none' : 'flex';
};
</script>
</body>
</html>
