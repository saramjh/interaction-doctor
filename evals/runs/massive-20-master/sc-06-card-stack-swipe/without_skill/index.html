<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Card Stack Swipe (Without Skill)</title>
<style>
body { font-family:sans-serif; margin:0; padding:20px; background:#f0f0f0; display:flex; flex-direction:column; align-items:center; }
.card-deck { position:relative; width:260px; height:360px; }
.card { position:absolute; top:0; left:0; width:100%; height:100%; background:#fff; border-radius:16px; box-shadow:0 4px 10px rgba(0,0,0,0.1); display:flex; align-items:center; justify-content:center; font-size:20px; font-weight:bold; }
</style>
</head>
<body>
<h3>카드 스와이프 (Without Skill)</h3>
<div class="card-deck" id="deck">
  <div class="card" id="card">🎴 추천 카드 1</div>
</div>
<script>
const card = document.getElementById('card');
let startX = 0;
card.ontouchstart = (e) => startX = e.touches[0].clientX;
card.ontouchmove = (e) => {
  const dx = e.touches[0].clientX - startX;
  card.style.transform = `translateX(${dx}px)`;
};
card.ontouchend = () => card.style.transform = 'none';
</script>
</body>
</html>
