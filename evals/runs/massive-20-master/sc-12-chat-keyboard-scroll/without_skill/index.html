<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat Keyboard Scroll (Without Skill)</title>
<style>
body { margin:0; font-family:sans-serif; height:100vh; display:flex; flex-direction:column; }
.messages { flex:1; overflow-y:scroll; padding:10px; background:#e5ddd5; }
.input-bar { position:fixed; bottom:0; left:0; width:100%; height:50px; background:#fff; display:flex; padding:5px; }
input { flex:1; }
</style>
</head>
<body>
<div class="messages" id="msgs">
  <p>안녕하세요!</p><p>키보드가 올라오면 이 입력창이 가려지거나 화면이 엉망이 됩니다.</p>
</div>
<div class="input-bar">
  <input placeholder="메시지 입력..."><button>전송</button>
</div>
</body>
</html>
