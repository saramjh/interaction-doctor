<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Split View Resizer (Without Skill)</title>
<style>
body { font-family:sans-serif; margin:0; padding:20px; background:#f0f0f0; }
.split-box { display:flex; width:340px; height:200px; border:1px solid #ccc; background:#fff; }
.panel-left { width:50%; background:#e3f2fd; padding:10px; }
.panel-right { flex:1; background:#f3e5f5; padding:10px; }
.gutter { width:4px; background:#999; cursor:col-resize; }
</style>
</head>
<body>
<h3>스플릿 뷰 (Without Skill)</h3>
<div class="split-box" id="box">
  <div class="panel-left" id="left">왼쪽 패널</div>
  <div class="gutter" id="gutter"></div>
  <div class="panel-right">오른쪽 패널</div>
</div>
<script>
const gutter = document.getElementById('gutter');
const left = document.getElementById('left');
const box = document.getElementById('box');
let isDown = false;
gutter.onmousedown = () => isDown = true;
gutter.ontouchstart = () => isDown = true;
window.onmouseup = () => isDown = false;
window.ontouchend = () => isDown = false;
window.addEventListener('touchmove', (e) => {
  if (!isDown) return;
  const rect = box.getBoundingClientRect();
  const x = e.touches[0].clientX - rect.left;
  left.style.width = x + 'px';
});
</script>
</body>
</html>
