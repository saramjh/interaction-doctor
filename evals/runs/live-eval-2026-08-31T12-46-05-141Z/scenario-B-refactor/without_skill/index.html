<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>BottomSheet</title>
<style>
  body {
    margin: 0;
    font-family: sans-serif;
    background: #121212;
    color: #fff;
    height: 100vh;
    overflow: hidden;
  }
  .header-area { padding: 20px; }
  .sheet {
    position: fixed;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 70%;
    background: #1e1e1e;
    border-radius: 20px 20px 0 0;
    border-top: 1px solid #333;
    transform: translateY(0);
    transition: transform 0.2s ease-out;
    display: flex;
    flex-direction: column;
    z-index: 10;
    touch-action: none; /* 기본 터치 동작 중 시트 터치 간섭 방지 */
  }
  .sheet.dragging {
    transition: none;
  }
  .handle-bar {
    width: 40px;
    height: 5px;
    background: #555;
    border-radius: 999px;
    margin: 10px auto;
    flex: 0 0 auto;
    cursor: pointer;
  }
  .scroll-content {
    flex: 1 1 auto;
    overflow-y: auto;
    padding: 10px 20px 40px;
    -webkit-overflow-scrolling: touch;
    overscroll-behavior-y: contain; /* iOS 바운스 효과로 인한 스크롤 꼬임 방지 */
    touch-action: pan-y; /* 리스트 내부 세로 스크롤 허용 */
  }
  .item {
    padding: 15px;
    border-bottom: 1px solid #2a2a2a;
    color: #ddd;
  }
</style>
</head>
<body>

<div class="header-area">
  <h1>상세 정보</h1>
</div>

<div class="sheet" id="sheet">
  <div class="handle-bar" id="handleBar"></div>
  <div class="scroll-content" id="scrollContent">
    <div class="item">📜 List Item 1</div>
    <div class="item">📜 List Item 2</div>
    <div class="item">📜 List Item 3</div>
    <div class="item">📜 List Item 4</div>
    <div class="item">📜 List Item 5</div>
    <div class="item">📜 List Item 6</div>
    <div class="item">📜 List Item 7</div>
    <div class="item">📜 List Item 8</div>
    <div class="item">📜 List Item 9</div>
    <div class="item">📜 List Item 10</div>
    <div class="item">📜 List Item 11</div>
    <div class="item">📜 List Item 12</div>
    <div class="item">📜 List Item 13</div>
    <div class="item">📜 List Item 14</div>
    <div class="item">📜 List Item 15</div>
  </div>
</div>

<script>
  const sheet = document.getElementById('sheet');
  const scrollContent = document.getElementById('scrollContent');
  const handleBar = document.getElementById('handleBar');

  let startY = 0;
  let currentY = 0;
  let isDragging = false;
  let startScrollTop = 0;
  let isHandleTouch = false;

  sheet.addEventListener('pointerdown', (e) => {
    startY = e.clientY;
    currentY = 0;
    startScrollTop = scrollContent.scrollTop;
    // 핸들바 영역을 직접 클릭/터치했는지 여부 확인
    isHandleTouch = handleBar.contains(e.target);
    isDragging = false;
  });

  window.addEventListener('pointermove', (e) => {
    const dy = e.clientY - startY;

    // 1. 이미 시트를 드래그 중인 경우
    if (isDragging) {
      const clampedY = Math.max(0, dy); // 위로는 올라가지 않도록 제어
      sheet.style.transform = `translateY(${clampedY}px)`;
      currentY = clampedY;
      return;
    }

    // 2. 아직 드래그 상태가 아닌 경우 드래그 시작 조건 판별
    // - 핸들바를 직접 터치해서 끌어내릴 때
    // - 또는 리스트 스크롤이 맨 위(scrollTop <= 0)에 위치한 상태에서 손가락을 아래로 당길 때(dy > 0)
    if (isHandleTouch || (startScrollTop <= 0 && dy > 0)) {
      isDragging = true;
      sheet.classList.add('dragging');
      const clampedY = Math.max(0, dy);
      sheet.style.transform = `translateY(${clampedY}px)`;
      currentY = clampedY;
    }
  });

  const handlePointerUp = () => {
    if (!isDragging) return;
    isDragging = false;
    sheet.classList.remove('dragging');

    // 일정 높이(100px 이상 또는 임의의 기준) 이상 끌어내렸으면 닫기
    if (currentY > 120) {
      sheet.style.transform = 'translateY(100%)';
    } else {
      sheet.style.transform = 'translateY(0)';
    }
    currentY = 0;
  };

  window.addEventListener('pointerup', handlePointerUp);
  window.addEventListener('pointercancel', handlePointerUp);
</script>
</body>
</html>
