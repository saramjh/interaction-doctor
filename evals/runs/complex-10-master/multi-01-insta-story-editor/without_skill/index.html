<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Story Editor (Without Skill)</title>
<style>
body { margin:0; background:#111; color:#fff; font-family:sans-serif; height:100vh; overflow:hidden; display:flex; flex-direction:column; }
.canvas { flex:1; position:relative; background:#333; overflow:hidden; }
.bg-img { width:100%; height:100%; object-fit:cover; position:absolute; }
.sticker { position:absolute; top:40%; left:30%; padding:10px; background:rgba(0,0,0,0.6); color:#fff; border-radius:8px; cursor:move; }
.tools { height:60px; background:#222; display:flex; gap:10px; padding:10px; overflow-x:scroll; }
.color-dot { width:40px; height:40px; border-radius:50%; flex-shrink:0; }
</style>
</head>
<body>
<div class="canvas" id="canvas">
  <div class="sticker" id="sticker">🔥 오늘의 무드 텍스트</div>
</div>
<div class="tools">
  <div class="color-dot" style="background:#ff3b30;" onclick="setColor('#ff3b30')"></div>
  <div class="color-dot" style="background:#ff9500;" onclick="setColor('#ff9500')"></div>
  <div class="color-dot" style="background:#34c759;" onclick="setColor('#34c759')"></div>
  <div class="color-dot" style="background:#007aff;" onclick="setColor('#007aff')"></div>
</div>
<script>
const sticker = document.getElementById('sticker');
let startX=0, startY=0;
sticker.ontouchstart = (e) => { startX = e.touches[0].clientX - sticker.offsetLeft; startY = e.touches[0].clientY - sticker.offsetTop; };
sticker.ontouchmove = (e) => {
  sticker.style.left = (e.touches[0].clientX - startX) + 'px';
  sticker.style.top = (e.touches[0].clientY - startY) + 'px';
};
function setColor(c) { sticker.style.background = c; }
</script>
</body>
</html>
