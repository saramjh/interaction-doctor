<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Reels Feed (With Skill - Interaction Doctor)</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    margin: 0;
    height: 100vh;
    height: 100dvh;
    background: #000000;
    color: #ffffff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
  }
  .reels-container {
    height: 100%;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    scroll-snap-type: y mandatory;
    overscroll-behavior-y: contain;
    touch-action: pan-y;
  }
  .reel-page {
    height: 100vh;
    height: 100dvh;
    scroll-snap-align: start;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #090d16;
  }
  .video-bg {
    position: absolute;
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    font-weight: 800;
  }
  .side-actions {
    position: absolute;
    right: 16px;
    bottom: 80px;
    display: flex;
    flex-direction: column;
    gap: 18px;
    z-index: 10;
  }
  .action-btn {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: rgba(15, 23, 42, 0.6);
    backdrop-filter: blur(8px);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    cursor: pointer;
    touch-action: manipulation;
    transition: transform 0.15s;
  }
  .action-btn:active { transform: scale(0.9); }
  .heart-burst {
    position: absolute;
    pointer-events: none;
    font-size: 80px;
    animation: burst 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    z-index: 20;
  }
  @keyframes burst {
    0% { transform: translate(-50%, -50%) scale(0) rotate(-15deg); opacity: 0; }
    50% { transform: translate(-50%, -50%) scale(1.3) rotate(0deg); opacity: 1; }
    100% { transform: translate(-50%, -50%) scale(1) translateY(-60px); opacity: 0; }
  }
  .play-indicator {
    position: absolute;
    font-size: 40px;
    background: rgba(0,0,0,0.5);
    width: 70px;
    height: 70px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    transition: opacity 0.2s;
    pointer-events: none;
  }
</style>
</head>
<body>

<div class="reels-container" id="reels">
  <div class="reel-page" style="background: linear-gradient(180deg, #1e1b4b, #0f172a);">
    <div class="video-bg">🔥 숏폼 영상 1</div>
    <div class="play-indicator">❚❚</div>
    <div class="side-actions">
      <div class="action-btn" onclick="likeClick(this)">❤️<span style="font-size:10px;">1.4k</span></div>
      <div class="action-btn" onclick="alert('댓글창 열림')">💬<span style="font-size:10px;">320</span></div>
      <div class="action-btn" onclick="alert('공유하기')">🔗</div>
    </div>
  </div>

  <div class="reel-page" style="background: linear-gradient(180deg, #064e3b, #0f172a);">
    <div class="video-bg">⚡ 숏폼 영상 2</div>
    <div class="play-indicator">❚❚</div>
    <div class="side-actions">
      <div class="action-btn" onclick="likeClick(this)">❤️<span style="font-size:10px;">4.2k</span></div>
      <div class="action-btn" onclick="alert('댓글창 열림')">💬<span style="font-size:10px;">890</span></div>
      <div class="action-btn" onclick="alert('공유하기')">🔗</div>
    </div>
  </div>
</div>

<script>
  function likeClick(btn) {
    btn.style.transform = 'scale(1.3)';
    setTimeout(() => btn.style.transform = 'scale(1)', 150);
    if (navigator.vibrate) navigator.vibrate(30);
  }

  document.querySelectorAll('.reel-page').forEach(page => {
    let lastTap = 0;
    let tapTimeout = null;
    const playIndicator = page.querySelector('.play-indicator');
    let isPaused = false;

    page.addEventListener('pointerdown', (e) => {
      if (e.target.closest('.side-actions')) return;

      const now = Date.now();
      const diff = now - lastTap;

      if (diff < 280) {
        // 더블탭 -> 하트 버스트 애니메이션
        clearTimeout(tapTimeout);
        spawnHeart(e.clientX, e.clientY, page);
        if (navigator.vibrate) navigator.vibrate([20, 50, 30]);
        lastTap = 0;
      } else {
        lastTap = now;
        tapTimeout = setTimeout(() => {
          // 싱글탭 -> 일시정지 토글
          isPaused = !isPaused;
          playIndicator.textContent = isPaused ? '▶' : '❚❚';
          playIndicator.style.opacity = '1';
          setTimeout(() => playIndicator.style.opacity = '0', 600);
        }, 280);
      }
    });
  });

  function spawnHeart(x, y, parent) {
    const heart = document.createElement('div');
    heart.className = 'heart-burst';
    heart.textContent = '💖';
    heart.style.left = `${x}px`;
    heart.style.top = `${y}px`;
    parent.appendChild(heart);
    setTimeout(() => heart.remove(), 600);
  }
</script>
</body>
</html>
