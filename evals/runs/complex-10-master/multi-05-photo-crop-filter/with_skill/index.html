<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Crop Studio (With Skill - Interaction Doctor)</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    margin: 0;
    height: 100vh;
    height: 100dvh;
    background: #090d16;
    color: #f8fafc;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
  }
  .studio-header {
    height: 52px;
    background: #1e293b;
    border-bottom: 1px solid #334155;
    padding: 0 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-weight: 700;
    font-size: 15px;
    color: #38bdf8;
  }
  .stage-area {
    flex: 1;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    touch-action: none;
    background: #000000;
  }
  .photo-frame {
    position: relative;
    width: 300px;
    height: 220px;
    background: linear-gradient(135deg, #1e293b, #475569);
    border-radius: 12px;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 36px;
  }
  .crop-box {
    position: absolute;
    top: 20px;
    left: 30px;
    width: 180px;
    height: 130px;
    border: 2px solid #38bdf8;
    box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.6);
    cursor: move;
    touch-action: none;
  }
  .corner-handle {
    position: absolute;
    bottom: -18px;
    right: -18px;
    width: 44px; /* 44dp 터치 타겟 */
    height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: nwse-resize;
    touch-action: none;
  }
  .handle-dot {
    width: 16px;
    height: 16px;
    background: #38bdf8;
    border: 2px solid #ffffff;
    border-radius: 50%;
    box-shadow: 0 2px 8px rgba(0,0,0,0.5);
  }
  .controls-panel {
    background: #1e293b;
    border-top: 1px solid #334155;
    padding: 16px 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .slider-row {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 13px;
  }
  .filter-range {
    flex: 1;
    height: 6px;
    touch-action: none;
  }
</style>
</head>
<body>

<header class="studio-header">
  <span>✂️ 사진 크롭 & 필터</span>
  <button style="background:#38bdf8; color:#0f172a; border:none; padding:6px 14px; border-radius:8px; font-weight:700; font-size:12px; touch-action:manipulation;">저장</button>
</header>

<div class="stage-area" id="stage">
  <div class="photo-frame" id="photo">
    <span>🏔️</span>
    <div class="crop-box" id="cropBox">
      <div class="corner-handle" id="handle">
        <div class="handle-dot"></div>
      </div>
    </div>
  </div>
</div>

<div class="controls-panel">
  <div class="slider-row">
    <span style="width:50px; color:#94a3b8;">밝기</span>
    <input class="filter-range" type="range" id="rangeBright" min="50" max="150" value="100">
    <span id="txtBright" style="width:35px; font-family:monospace;">100%</span>
  </div>
  <div class="slider-row">
    <span style="width:50px; color:#94a3b8;">채도</span>
    <input class="filter-range" type="range" id="rangeSat" min="0" max="200" value="100">
    <span id="txtSat" style="width:35px; font-family:monospace;">100%</span>
  </div>
</div>

<script>
  const cropBox = document.getElementById('cropBox');
  const handle = document.getElementById('handle');
  const photo = document.getElementById('photo');

  const rangeBright = document.getElementById('rangeBright');
  const rangeSat = document.getElementById('rangeSat');
  const txtBright = document.getElementById('txtBright');
  const txtSat = document.getElementById('txtSat');

  // 필터 슬라이더 연동
  function updateFilters() {
    const b = rangeBright.value;
    const s = rangeSat.value;
    photo.style.filter = `brightness(${b}%) saturate(${s}%)`;
    txtBright.textContent = `${b}%`;
    txtSat.textContent = `${s}%`;
  }
  rangeBright.addEventListener('input', updateFilters);
  rangeSat.addEventListener('input', updateFilters);

  // 크롭 박스 이동 (1:1 격리)
  let boxPointerId = null;
  let startX = 0, startY = 0;
  let initX = 30, initY = 20;

  cropBox.addEventListener('pointerdown', (e) => {
    if (e.target === handle || handle.contains(e.target)) return;
    if (boxPointerId !== null) return;
    boxPointerId = e.pointerId;
    startX = e.clientX;
    startY = e.clientY;
    initX = cropBox.offsetLeft;
    initY = cropBox.offsetTop;
    try { cropBox.setPointerCapture(e.pointerId); } catch(err) {}
  });

  cropBox.addEventListener('pointermove', (e) => {
    if (e.pointerId !== boxPointerId) return;
    const dx = e.clientX - startX;
    const dy = e.clientY - startY;

    const maxX = photo.clientWidth - cropBox.clientWidth;
    const maxY = photo.clientHeight - cropBox.clientHeight;

    const nextX = Math.max(0, Math.min(maxX, initX + dx));
    const nextY = Math.max(0, Math.min(maxY, initY + dy));

    cropBox.style.left = `${nextX}px`;
    cropBox.style.top = `${nextY}px`;
  });

  const releaseBox = (e) => {
    if (e.pointerId !== boxPointerId) return;
    boxPointerId = null;
    try { cropBox.releasePointerCapture(e.pointerId); } catch(err) {}
  };
  cropBox.addEventListener('pointerup', releaseBox);
  cropBox.addEventListener('pointercancel', releaseBox);

  // 핸들 리사이즈 (1:1 격리)
  let handlePointerId = null;
  let hStartX = 0, hStartY = 0;
  let initW = 180, initH = 130;

  handle.addEventListener('pointerdown', (e) => {
    e.stopPropagation();
    if (handlePointerId !== null) return;
    handlePointerId = e.pointerId;
    hStartX = e.clientX;
    hStartY = e.clientY;
    initW = cropBox.clientWidth;
    initH = cropBox.clientHeight;
    try { handle.setPointerCapture(e.pointerId); } catch(err) {}
  });

  handle.addEventListener('pointermove', (e) => {
    if (e.pointerId !== handlePointerId) return;
    const dw = e.clientX - hStartX;
    const dh = e.clientY - hStartY;

    const maxW = photo.clientWidth - cropBox.offsetLeft;
    const maxH = photo.clientHeight - cropBox.offsetTop;

    const nextW = Math.max(60, Math.min(maxW, initW + dw));
    const nextH = Math.max(60, Math.min(maxH, initH + dh));

    cropBox.style.width = `${nextW}px`;
    cropBox.style.height = `${nextH}px`;
  });

  const releaseHandle = (e) => {
    if (e.pointerId !== handlePointerId) return;
    handlePointerId = null;
    try { handle.releasePointerCapture(e.pointerId); } catch(err) {}
  };
  handle.addEventListener('pointerup', releaseHandle);
  handle.addEventListener('pointercancel', releaseHandle);
</script>
</body>
</html>
