<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spreadsheet (Without Skill)</title>
<style>
body { margin:0; font-family:sans-serif; padding:10px; }
.sheet-wrap { overflow:scroll; width:300px; height:200px; }
table { border-collapse:collapse; }
td, th { border:1px solid #ccc; width:60px; height:30px; text-align:center; }
</style>
</head>
<body>
<h3>스프레드시트 (Without Skill)</h3>
<div class="sheet-wrap">
  <table>
    <tr><th>#</th><th>A</th><th>B</th><th>C</th></tr>
    <tr><th>1</th><td>10</td><td>20</td><td>30</td></tr>
    <tr><th>2</th><td>40</td><td>50</td><td>60</td></tr>
  </table>
</div>
</body>
</html>
