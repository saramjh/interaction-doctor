<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>E-commerce Sheet (Without Skill)</title>
<style>
body { margin:0; font-family:sans-serif; height:150vh; background:#f0f0f0; }
.carousel { width:100%; height:200px; background:#ddd; display:flex; overflow-x:scroll; }
.c-img { flex:0 0 100%; display:flex; align-items:center; justify-content:center; font-size:24px; }
.sheet { position:fixed; bottom:0; left:0; width:100%; height:300px; background:#fff; display:none; }
.sheet.open { display:block; }
</style>
</head>
<body>
<div class="carousel">
  <div class="c-img">상품 사진 1</div>
  <div class="c-img">상품 사진 2</div>
</div>
<button id="btnBuy" style="margin:20px; width:90%; padding:15px;">구매하기</button>
<div class="sheet" id="sheet">
  <h3>옵션 선택</h3>
  <button onclick="document.getElementById('sheet').classList.remove('open')">닫기</button>
</div>
<script>
document.getElementById('btnBuy').onclick = () => document.getElementById('sheet').classList.add('open');
</script>
</body>
</html>
