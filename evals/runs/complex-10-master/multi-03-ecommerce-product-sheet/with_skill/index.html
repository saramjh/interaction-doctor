<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>E-commerce Sheet (With Skill - Interaction Doctor)</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0f172a;
    color: #f8fafc;
    min-height: 140vh;
  }
  .carousel-wrapper {
    position: relative;
    width: 100%;
    height: 260px;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    scroll-snap-type: x mandatory;
    overscroll-behavior-x: contain;
    touch-action: pan-x;
    display: flex;
    scrollbar-width: none;
  }
  .carousel-wrapper::-webkit-scrollbar { display: none; }
  .carousel-slide {
    flex: 0 0 100%;
    height: 100%;
    scroll-snap-align: start;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #1e293b;
    font-size: 32px;
    font-weight: 700;
  }
  .product-info {
    padding: 20px;
  }
  .price-tag {
    font-size: 22px;
    font-weight: 800;
    color: #38bdf8;
    margin: 8px 0;
  }
  .btn-buy-bar {
    position: fixed;
    bottom: 0;
    left: 0;
    width: 100%;
    padding: 16px 20px;
    background: rgba(15, 23, 42, 0.9);
    backdrop-filter: blur(12px);
    border-top: 1px solid #334155;
    z-index: 50;
  }
  .btn-buy {
    width: 100%;
    height: 50px;
    background: #38bdf8;
    color: #0f172a;
    font-size: 16px;
    font-weight: 700;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    touch-action: manipulation;
  }
  .sheet-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background: rgba(0,0,0,0.65);
    backdrop-filter: blur(4px);
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.25s, visibility 0.25s;
    z-index: 100;
    touch-action: none;
  }
  .sheet-overlay.open {
    opacity: 1;
    visibility: visible;
  }
  .bottom-sheet {
    position: fixed;
    bottom: 0;
    left: 0;
    width: 100%;
    background: #1e293b;
    border-top: 1px solid #334155;
    border-radius: 24px 24px 0 0;
    padding: 16px 24px 34px 24px;
    box-shadow: 0 -10px 40px rgba(0,0,0,0.6);
    transform: translate3d(0, 100%, 0);
    transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    z-index: 101;
    touch-action: pan-y;
  }
  .bottom-sheet.open {
    transform: translate3d(0, 0, 0);
  }
  .sheet-handle {
    width: 40px;
    height: 5px;
    background: #475569;
    border-radius: 3px;
    margin: 0 auto 16px auto;
    cursor: grab;
  }
  .option-pills {
    display: flex;
    gap: 8px;
    margin: 12px 0 20px 0;
  }
  .pill {
    padding: 8px 16px;
    border-radius: 20px;
    background: #090d16;
    border: 1px solid #334155;
    font-size: 13px;
    color: #cbd5e1;
    cursor: pointer;
    touch-action: manipulation;
  }
  .pill.active {
    border-color: #38bdf8;
    background: rgba(56, 189, 248, 0.15);
    color: #38bdf8;
  }
</style>
</head>
<body>

<div class="carousel-wrapper">
  <div class="carousel-slide" style="background:#1e293b;">🎧 미드나잇 블랙</div>
  <div class="carousel-slide" style="background:#0f172a;">🎧 실버 화이트</div>
  <div class="carousel-slide" style="background:#131d2e;">🎧 스페이스 그레이</div>
</div>

<div class="product-info">
  <h2>프리미엄 무선 헤드폰 Pro</h2>
  <div class="price-tag">₩349,000</div>
  <p style="color:#94a3b8; font-size:14px; line-height:1.6;">
    초고음질 액티브 노이즈 캔슬링과 40시간 연속 재생을 지원하는 플래그십 헤드폰입니다.
  </p>
</div>

<div class="btn-buy-bar">
  <button class="btn-buy" id="btnOpenSheet">구매하기</button>
</div>

<div class="sheet-overlay" id="overlay"></div>

<div class="bottom-sheet" id="sheet">
  <div class="sheet-handle" id="handle"></div>
  <h3 style="font-size:17px; margin-bottom:12px;">옵션 및 수량 선택</h3>

  <div style="font-size:13px; color:#94a3b8;">색상 선택</div>
  <div class="option-pills">
    <div class="pill active">미드나잇 블랙</div>
    <div class="pill">실버 화이트</div>
    <div class="pill">스페이스 그레이</div>
  </div>

  <button class="btn-buy" id="btnFinalOrder">장바구니 담기 (₩349,000)</button>
</div>

<script>
  const btnOpenSheet = document.getElementById('btnOpenSheet');
  const overlay = document.getElementById('overlay');
  const sheet = document.getElementById('sheet');
  const handle = document.getElementById('handle');

  function openSheet() {
    overlay.classList.add('open');
    sheet.classList.add('open');
  }

  function closeSheet() {
    overlay.classList.remove('open');
    sheet.classList.remove('open');
    sheet.style.transform = '';
  }

  btnOpenSheet.addEventListener('click', openSheet);
  overlay.addEventListener('pointerdown', closeSheet);

  document.querySelectorAll('.pill').forEach(p => {
    p.addEventListener('click', () => {
      document.querySelectorAll('.pill').forEach(x => x.classList.remove('active'));
      p.classList.add('active');
    });
  });

  document.getElementById('btnFinalOrder').onclick = () => {
    alert('장바구니에 담겼습니다!');
    closeSheet();
  };

  // 핸들 아래로 드래그하여 시트 닫기 제스처
  let activePointerId = null;
  let startY = 0;

  handle.addEventListener('pointerdown', (e) => {
    if (activePointerId !== null) return;
    activePointerId = e.pointerId;
    startY = e.clientY;
    try { handle.setPointerCapture(e.pointerId); } catch(err) {}
  });

  handle.addEventListener('pointermove', (e) => {
    if (e.pointerId !== activePointerId) return;
    const dy = Math.max(0, e.clientY - startY);
    sheet.style.transform = `translate3d(0, ${dy}px, 0)`;
  });

  const release = (e) => {
    if (e.pointerId !== activePointerId) return;
    const dy = e.clientY - startY;
    if (dy > 80) closeSheet();
    else sheet.style.transform = 'translate3d(0, 0, 0)';
    try { handle.releasePointerCapture(e.pointerId); } catch(err) {}
    activePointerId = null;
  };

  handle.addEventListener('pointerup', release);
  handle.addEventListener('pointercancel', release);
</script>
</body>
</html>
