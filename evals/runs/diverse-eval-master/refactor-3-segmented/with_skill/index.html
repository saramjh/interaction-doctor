<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Segmented Control (With Skill - Interaction Doctor)</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    padding: 40px 20px;
    background: #0f172a;
    color: #f8fafc;
    display: flex;
    flex-direction: column;
    align-items: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
  }
  .control-box {
    background: #1e293b;
    border: 1px solid #334155;
    padding: 24px;
    border-radius: 16px;
    width: 100%;
    max-width: 360px;
  }
  .segmented {
    display: flex;
    background: #090d16;
    border-radius: 10px;
    padding: 4px;
    position: relative;
    touch-action: none;
    box-shadow: inset 0 2px 4px rgba(0,0,0,0.3);
  }
  .indicator {
    position: absolute;
    top: 4px;
    left: 4px;
    width: calc(33.333% - 2.66px);
    height: calc(100% - 8px);
    background: #38bdf8;
    border-radius: 7px;
    box-shadow: 0 2px 8px rgba(56, 189, 248, 0.4);
    transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    will-change: transform;
    z-index: 1;
  }
  .indicator.dragging {
    transition: none; /* 드래그 중 1:1 즉각 밀착 */
  }
  .segment {
    flex: 1;
    text-align: center;
    padding: 10px 0;
    font-size: 14px;
    font-weight: 600;
    color: #94a3b8;
    z-index: 2;
    cursor: pointer;
    transition: color 0.15s;
  }
  .segment.active {
    color: #0f172a;
  }
</style>
</head>
<body>

<div class="control-box">
  <h3 style="font-size:16px; margin-bottom:16px; text-align:center;">기간별 조회 설정</h3>
  <div class="segmented" id="segmented">
    <div class="indicator" id="indicator"></div>
    <div class="segment active" data-idx="0">일간</div>
    <div class="segment" data-idx="1">주간</div>
    <div class="segment" data-idx="2">월간</div>
  </div>
</div>

<script>
  const seg = document.getElementById('segmented');
  const ind = document.getElementById('indicator');
  const segments = document.querySelectorAll('.segment');

  let currentIdx = 0;
  let startX = 0;
  let activePointerId = null;
  let isDragging = false;
  const SEG_WIDTH = (seg.clientWidth - 8) / 3;

  function setIndex(idx) {
    currentIdx = Math.max(0, Math.min(2, idx));
    ind.classList.remove('dragging');
    ind.style.transform = `translate3d(${currentIdx * 100}%, 0, 0)`;
    segments.forEach((s, i) => s.classList.toggle('active', i === currentIdx));
  }

  seg.addEventListener('pointerdown', (e) => {
    if (activePointerId !== null) return;
    activePointerId = e.pointerId;
    startX = e.clientX;
    isDragging = false;
    try { seg.setPointerCapture(e.pointerId); } catch(err) {}

    // 탭한 위치 인덱스로 즉시 이동
    const rect = seg.getBoundingClientRect();
    const clickX = e.clientX - rect.left - 4;
    const targetIdx = Math.floor(clickX / SEG_WIDTH);
    setIndex(targetIdx);
  });

  seg.addEventListener('pointermove', (e) => {
    if (e.pointerId !== activePointerId) return;
    const dx = e.clientX - startX;

    if (Math.abs(dx) > 6) {
      isDragging = true;
      ind.classList.add('dragging');
      const rect = seg.getBoundingClientRect();
      const relativeX = e.clientX - rect.left - 4 - SEG_WIDTH / 2;
      const clampedX = Math.max(0, Math.min(SEG_WIDTH * 2, relativeX));
      ind.style.transform = `translate3d(${clampedX}px, 0, 0)`;
    }
  });

  const endDrag = (e) => {
    if (e.pointerId !== activePointerId) return;
    if (isDragging) {
      const rect = seg.getBoundingClientRect();
      const relativeX = e.clientX - rect.left - 4;
      const targetIdx = Math.round(relativeX / SEG_WIDTH);
      setIndex(targetIdx);
    }
    activePointerId = null;
    isDragging = false;
    try { seg.releasePointerCapture(e.pointerId); } catch(err) {}
  };

  seg.addEventListener('pointerup', endDrag);
  seg.addEventListener('pointercancel', endDrag);
</script>
</body>
</html>
