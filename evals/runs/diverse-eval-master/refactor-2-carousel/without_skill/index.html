<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carousel (Without Skill)</title>
<style>
body { margin:0; padding:20px; background:#111; color:#fff; font-family:sans-serif; }
.carousel-track { display:flex; gap:10px; overflow-x:auto; width:100%; }
.card { flex:0 0 80%; height:150px; background:#333; border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:20px; }
</style>
</head>
<body>
<h3>무한 캐러셀 (Without Skill)</h3>
<div class="carousel-track" id="track">
  <div class="card">Slide 1</div>
  <div class="card">Slide 2</div>
  <div class="card">Slide 3</div>
</div>
<script>
  // 자동 롤링이 터치 중에도 멈추지 않아 화면이 튀는 결함
  setInterval(() => {
    document.getElementById('track').scrollBy({ left: 200, behavior: 'smooth' });
  }, 3000);
</script>
</body>
</html>
