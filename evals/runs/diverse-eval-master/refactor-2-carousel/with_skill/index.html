<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Carousel (With Skill - Interaction Doctor)</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    margin: 0;
    padding: 24px 16px;
    background: #0f172a;
    color: #f8fafc;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
  }
  .carousel-wrapper {
    position: relative;
    width: 100%;
    overflow: hidden;
    touch-action: pan-y;
    border-radius: 16px;
    background: #1e293b;
    padding: 16px 0;
  }
  .carousel-track {
    display: flex;
    gap: 16px;
    padding: 0 20px;
    will-change: transform;
    transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .carousel-track.dragging {
    transition: none; /* 드래그 중 1:1 즉각 밀착 */
  }
  .card {
    flex: 0 0 80%;
    height: 180px;
    background: linear-gradient(135deg, #1e293b, #334155);
    border: 1px solid #475569;
    border-radius: 12px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    font-weight: 700;
    color: #38bdf8;
    box-shadow: 0 4px 16px rgba(0,0,0,0.3);
  }
  .pagination {
    display: flex;
    justify-content: center;
    gap: 8px;
    margin-top: 16px;
  }
  .dot {
    width: 8px;
    height: 8px;
    background: #475569;
    border-radius: 4px;
    transition: all 0.2s;
  }
  .dot.active {
    width: 24px;
    background: #38bdf8;
  }
</style>
</head>
<body>

<h2 style="font-size:18px; margin-bottom:12px;">🎡 스마트 무한 캐러셀</h2>
<div class="carousel-wrapper" id="wrapper">
  <div class="carousel-track" id="track">
    <div class="card" data-idx="0">🎯 슬라이드 1<br><span style="font-size:12px; color:#cbd5e1; margin-top:8px;">터치 중 자동 롤링 일시정지</span></div>
    <div class="card" data-idx="1">🚀 슬라이드 2<br><span style="font-size:12px; color:#cbd5e1; margin-top:8px;">8px 슬롭 이내 스크롤 보호</span></div>
    <div class="card" data-idx="2">💎 슬라이드 3<br><span style="font-size:12px; color:#cbd5e1; margin-top:8px;">부드러운 관성 스냅</span></div>
  </div>
</div>

<div class="pagination">
  <div class="dot active"></div>
  <div class="dot"></div>
  <div class="dot"></div>
</div>

<script>
  const wrapper = document.getElementById('wrapper');
  const track = document.getElementById('track');
  const dots = document.querySelectorAll('.dot');

  let currentIdx = 0;
  let startX = 0, startY = 0;
  let activePointerId = null;
  let isDragging = false;
  let autoPlayTimer = null;
  const CARD_WIDTH = wrapper.clientWidth * 0.8 + 16;

  function updateSlide(idx) {
    currentIdx = Math.max(0, Math.min(2, idx));
    track.classList.remove('dragging');
    track.style.transform = `translate3d(-${currentIdx * CARD_WIDTH}px, 0, 0)`;
    dots.forEach((dot, i) => dot.classList.toggle('active', i === currentIdx));
  }

  function startAutoPlay() {
    stopAutoPlay();
    autoPlayTimer = setInterval(() => {
      currentIdx = (currentIdx + 1) % 3;
      updateSlide(currentIdx);
    }, 3500);
  }

  function stopAutoPlay() {
    if (autoPlayTimer) clearInterval(autoPlayTimer);
  }

  startAutoPlay();

  wrapper.addEventListener('pointerdown', (e) => {
    if (activePointerId !== null) return;
    stopAutoPlay(); // 터치 즉시 자동 롤링 정지
    activePointerId = e.pointerId;
    startX = e.clientX;
    startY = e.clientY;
    isDragging = false;
  });

  wrapper.addEventListener('pointermove', (e) => {
    if (e.pointerId !== activePointerId) return;
    const dx = e.clientX - startX;
    const dy = e.clientY - startY;

    if (!isDragging && Math.abs(dx) > 8 && Math.abs(dx) > Math.abs(dy)) {
      isDragging = true;
      track.classList.add('dragging');
    }

    if (isDragging) {
      const currentOffset = -currentIdx * CARD_WIDTH + dx;
      track.style.transform = `translate3d(${currentOffset}px, 0, 0)`;
    }
  });

  const endDrag = (e) => {
    if (e.pointerId !== activePointerId) return;
    if (isDragging) {
      const dx = e.clientX - startX;
      if (dx < -CARD_WIDTH * 0.25 && currentIdx < 2) updateSlide(currentIdx + 1);
      else if (dx > CARD_WIDTH * 0.25 && currentIdx > 0) updateSlide(currentIdx - 1);
      else updateSlide(currentIdx);
    }
    activePointerId = null;
    isDragging = false;
    startAutoPlay(); // 조작 완료 후 자동 롤링 재개
  };

  wrapper.addEventListener('pointerup', endDrag);
  wrapper.addEventListener('pointercancel', endDrag);
</script>
</body>
</html>
