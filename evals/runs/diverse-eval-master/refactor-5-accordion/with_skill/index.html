<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Accordion (With Skill - Interaction Doctor)</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    padding: 24px 16px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0f172a;
    color: #f8fafc;
  }
  .card-box {
    background: #1e293b;
    border: 1px solid #334155;
    padding: 20px;
    border-radius: 16px;
    max-width: 480px;
    margin: 0 auto;
  }
  .header {
    margin-bottom: 20px;
  }
  .accordion-item {
    border-bottom: 1px solid #334155;
  }
  .accordion-item:last-child {
    border-bottom: none;
  }
  .title-btn {
    width: 100%;
    text-align: left;
    background: transparent;
    border: none;
    padding: 18px 0;
    font-size: 15px;
    font-weight: 600;
    color: #e2e8f0;
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    align-items: center;
    touch-action: manipulation; /* 300ms 탭 딜레이 및 더블탭 줌 완전 차단 */
    user-select: none;          /* 빠른 연타 시 텍스트 파란색 선택 방지 */
    -webkit-user-select: none;
    -webkit-touch-callout: none;
  }
  .title-btn:hover {
    color: #38bdf8;
  }
  .arrow-icon {
    font-size: 14px;
    color: #94a3b8;
    transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .title-btn[aria-expanded="true"] .arrow-icon {
    transform: rotate(180deg);
    color: #38bdf8;
  }
  .content-wrapper {
    display: grid;
    grid-template-rows: 0fr;
    transition: grid-template-rows 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    overflow: hidden;
  }
  .content-wrapper.open {
    grid-template-rows: 1fr;
  }
  .content-inner {
    min-height: 0;
  }
  .content-text {
    padding-bottom: 18px;
    font-size: 14px;
    line-height: 1.6;
    color: #94a3b8;
  }
</style>
</head>
<body>

<div class="card-box">
  <div class="header">
    <h2 style="font-size:18px; margin-bottom:4px;">자주 묻는 질문 (FAQ)</h2>
    <p style="font-size:12px; color:#94a3b8;">더블탭 줌이나 텍스트 선택 방해 없이 즉시 빠릿하게 반응합니다.</p>
  </div>

  <div class="accordion-item">
    <button class="title-btn" aria-expanded="false" onclick="toggleAcc(this)">
      <span>환불 규정은 어떻게 되나요?</span>
      <span class="arrow-icon">▼</span>
    </button>
    <div class="content-wrapper">
      <div class="content-inner">
        <p class="content-text">구매 후 7일 이내에 미사용 시 100% 전액 환불이 가능하며, 결제 수단에 따라 1~3 영업일 내로 처리됩니다.</p>
      </div>
    </div>
  </div>

  <div class="accordion-item">
    <button class="title-btn" aria-expanded="false" onclick="toggleAcc(this)">
      <span>배송 기간은 얼마나 걸리나요?</span>
      <span class="arrow-icon">▼</span>
    </button>
    <div class="content-wrapper">
      <div class="content-inner">
        <p class="content-text">평일 오후 2시 이전 주문 건은 당일 출고되며, 전국 대부분 지역에서 1~2일 내에 받아보실 수 있습니다.</p>
      </div>
    </div>
  </div>

  <div class="accordion-item">
    <button class="title-btn" aria-expanded="false" onclick="toggleAcc(this)">
      <span>해외 배송도 지원하나요?</span>
      <span class="arrow-icon">▼</span>
    </button>
    <div class="content-wrapper">
      <div class="content-inner">
        <p class="content-text">현재 EMS 및 DHL을 통해 주요 국가로의 해외 배송을 지원하고 있으며, 배송비는 지역에 따라 상이합니다.</p>
      </div>
    </div>
  </div>
</div>

<script>
  function toggleAcc(btn) {
    const isExpanded = btn.getAttribute('aria-expanded') === 'true';
    btn.setAttribute('aria-expanded', !isExpanded);
    const wrapper = btn.nextElementSibling;
    wrapper.classList.toggle('open', !isExpanded);
  }
</script>
</body>
</html>
