<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Drawer (With Skill - Interaction Doctor)</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    min-height: 200vh;
    padding: 24px 20px;
    background: #0f172a;
    color: #f8fafc;
  }
  body.scroll-locked {
    overflow: hidden;
    touch-action: none;
  }
  .btn-open {
    padding: 12px 20px;
    font-size: 15px;
    font-weight: 600;
    background: #38bdf8;
    color: #0f172a;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    touch-action: manipulation;
  }
  .overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background: rgba(0, 0, 0, 0.6);
    backdrop-filter: blur(4px);
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.25s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.25s;
    z-index: 90;
    touch-action: none;
  }
  .overlay.open {
    opacity: 1;
    visibility: visible;
  }
  .drawer {
    position: fixed;
    top: 0;
    left: 0;
    width: 280px;
    height: 100vh;
    background: #1e293b;
    border-right: 1px solid #334155;
    z-index: 100;
    transform: translate3d(-100%, 0, 0);
    transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    will-change: transform;
    display: flex;
    flex-direction: column;
    touch-action: none; /* 드로어 영역 드래그 닫기 전용 제어 */
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
  }
  .drawer.open {
    transform: translate3d(0, 0, 0);
  }
  .drawer.dragging {
    transition: none; /* 드래그 닫기 중 1:1 즉각 반응 */
  }
  .drawer-header {
    padding: 20px;
    border-bottom: 1px solid #334155;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .drawer-content {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    touch-action: pan-y;
  }
  .menu-item {
    padding: 14px;
    background: #0f172a;
    border-radius: 8px;
    margin-bottom: 10px;
    font-size: 14px;
    cursor: pointer;
  }
</style>
</head>
<body>

<button class="btn-open" id="btnOpen">☰ 네비게이션 메뉴 열기</button>
<p style="margin-top:20px; color:#94a3b8; font-size:14px; line-height:1.6;">
  본문 영역입니다. 메뉴가 열리면 <strong>배경 스크롤이 완벽히 락(Lock)</strong>되며, 드로어를 왼쪽으로 스와이프하거나 바깥 어두운 영역을 터치하면 부드럽게 닫힙니다.
</p>

<div class="overlay" id="overlay"></div>
<div class="drawer" id="drawer">
  <div class="drawer-header">
    <h3 style="font-size:16px;">사이드 메뉴</h3>
    <button id="btnClose" style="background:transparent; border:none; color:#94a3b8; font-size:18px; cursor:pointer;">✕</button>
  </div>
  <div class="drawer-content">
    <div class="menu-item">🏠 대시보드</div>
    <div class="menu-item">📊 통계 및 리포트</div>
    <div class="menu-item">👤 사용자 프로필</div>
    <div class="menu-item">⚙️ 시스템 설정</div>
  </div>
</div>

<script>
  const btnOpen = document.getElementById('btnOpen');
  const btnClose = document.getElementById('btnClose');
  const drawer = document.getElementById('drawer');
  const overlay = document.getElementById('overlay');

  let startX = 0;
  let currentTranslateX = 0;
  let activePointerId = null;
  let isDragging = false;

  function openDrawer() {
    drawer.classList.add('open');
    overlay.classList.add('open');
    document.body.classList.add('scroll-locked');
  }

  function closeDrawer() {
    drawer.classList.remove('open');
    drawer.classList.remove('dragging');
    drawer.style.transform = '';
    overlay.classList.remove('open');
    document.body.classList.remove('scroll-locked');
  }

  btnOpen.addEventListener('click', openDrawer);
  btnClose.addEventListener('click', closeDrawer);
  overlay.addEventListener('click', closeDrawer);

  // 드로어 왼쪽 스와이프 닫기 제스처
  drawer.addEventListener('pointerdown', (e) => {
    if (activePointerId !== null) return;
    activePointerId = e.pointerId;
    startX = e.clientX;
    isDragging = false;
  });

  drawer.addEventListener('pointermove', (e) => {
    if (e.pointerId !== activePointerId) return;
    const dx = e.clientX - startX;

    if (dx < -8) { // 8px 이상 왼쪽으로 당기면 닫기 제스처 시작
      isDragging = true;
      drawer.classList.add('dragging');
      const clampedX = Math.max(-280, Math.min(0, dx + 8));
      drawer.style.transform = `translate3d(${clampedX}px, 0, 0)`;
      overlay.style.opacity = `${Math.max(0, 1 + clampedX / 280)}`;
    }
  });

  const endGesture = (e) => {
    if (e.pointerId !== activePointerId) return;
    if (isDragging) {
      const dx = e.clientX - startX;
      if (dx < -80) {
        closeDrawer();
      } else {
        drawer.classList.remove('dragging');
        drawer.style.transform = '';
        overlay.style.opacity = '';
      }
    }
    activePointerId = null;
    isDragging = false;
  };

  drawer.addEventListener('pointerup', endGesture);
  drawer.addEventListener('pointercancel', endGesture);
</script>
</body>
</html>
