<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Tooltip (With Skill - Interaction Doctor)</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    padding: 40px 20px;
    height: 150vh;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0f172a;
    color: #f8fafc;
  }
  .card {
    background: #1e293b;
    border: 1px solid #334155;
    padding: 24px;
    border-radius: 16px;
    max-width: 400px;
    margin: 0 auto;
  }
  .help-anchor {
    position: relative;
    display: inline-block;
  }
  .btn-help {
    padding: 10px 16px;
    font-size: 14px;
    font-weight: 600;
    background: #334155;
    color: #38bdf8;
    border: 1px solid #475569;
    border-radius: 8px;
    cursor: pointer;
    touch-action: manipulation;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .tooltip {
    position: absolute;
    bottom: calc(100% + 10px);
    left: 50%;
    transform: translate3d(-50%, 8px, 0);
    width: 240px;
    background: #020617;
    border: 1px solid #38bdf8;
    color: #e2e8f0;
    padding: 12px 14px;
    border-radius: 10px;
    font-size: 13px;
    line-height: 1.5;
    box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.18s cubic-bezier(0.16, 1, 0.3, 1), transform 0.18s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.18s;
    pointer-events: none;
    z-index: 50;
  }
  .tooltip.show {
    opacity: 1;
    visibility: visible;
    transform: translate3d(-50%, 0, 0);
    pointer-events: auto;
  }
  .tooltip::after {
    content: '';
    position: absolute;
    top: 100%;
    left: 50%;
    transform: translateX(-50%);
    border: 6px solid transparent;
    border-top-color: #38bdf8;
  }
</style>
</head>
<body>

<div class="card">
  <h3 style="margin-bottom:12px; font-size:16px;">보안 결제 안내</h3>
  <p style="font-size:13px; color:#94a3b8; margin-bottom:20px; line-height:1.5;">결제 전 유의사항을 확인하세요.</p>

  <div class="help-anchor" id="helpAnchor">
    <button class="btn-help" id="btnHelp" aria-haspopup="true" aria-expanded="false">
      ℹ️ 결제 수수료 정책
    </button>
    <div class="tooltip" id="tooltip" role="tooltip">
      💡 신용카드 결제 시 별도 수수료가 발생하지 않으며, 해외 카드는 환전 수수료가 청구될 수 있습니다.
    </div>
  </div>
</div>

<script>
  const btn = document.getElementById('btnHelp');
  const tt = document.getElementById('tooltip');
  const anchor = document.getElementById('helpAnchor');

  function toggleTooltip(e) {
    e.stopPropagation();
    const isOpen = tt.classList.toggle('show');
    btn.setAttribute('aria-expanded', isOpen);
  }

  function hideTooltip() {
    if (tt.classList.contains('show')) {
      tt.classList.remove('show');
      btn.setAttribute('aria-expanded', 'false');
    }
  }

  btn.addEventListener('click', toggleTooltip);

  // 외부 터치/클릭 시 닫기
  document.addEventListener('pointerdown', (e) => {
    if (!anchor.contains(e.target)) {
      hideTooltip();
    }
  });

  // 스크롤 시 화면 가림 방지를 위해 부드럽게 닫기
  window.addEventListener('scroll', hideTooltip, { passive: true });
</script>
</body>
</html>
