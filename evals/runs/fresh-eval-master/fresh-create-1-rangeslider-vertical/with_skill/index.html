<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Vertical EQ Slider (With Skill - Interaction Doctor)</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 30px 20px;
    background: #0f172a;
    color: #f8fafc;
    display: flex;
    flex-direction: column;
    align-items: center;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
  }
  .card-box {
    background: #1e293b;
    border: 1px solid #334155;
    padding: 24px;
    border-radius: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 100%;
    max-width: 320px;
  }
  .volume-level {
    font-size: 24px;
    font-weight: 700;
    color: #38bdf8;
    margin-bottom: 20px;
  }
  .slider-wrapper {
    position: relative;
    width: 64px; /* 48dp 이상 터치 타겟 영역 */
    height: 240px;
    display: flex;
    justify-content: center;
    touch-action: none; /* 브라우저 세로 스크롤 완전 억제 */
  }
  .track-bg {
    position: absolute;
    width: 12px;
    height: 100%;
    background: #090d16;
    border-radius: 6px;
    overflow: hidden;
  }
  .track-fill {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    background: linear-gradient(0deg, #38bdf8, #818cf8);
    border-radius: 6px;
  }
  .thumb {
    position: absolute;
    bottom: 50%;
    width: 44px;
    height: 44px;
    background: #ffffff;
    border: 3px solid #38bdf8;
    border-radius: 50%;
    box-shadow: 0 4px 16px rgba(0,0,0,0.4);
    transform: translateY(50%);
    cursor: grab;
    will-change: bottom, transform;
    transition: transform 0.15s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.15s;
    touch-action: none;
    z-index: 2;
  }
  .thumb.active {
    cursor: grabbing;
    transform: translateY(50%) scale(1.2);
    box-shadow: 0 8px 24px rgba(56, 189, 248, 0.6);
    border-color: #818cf8;
  }
</style>
</head>
<body>

<div class="card-box">
  <h3 style="font-size:16px; margin-bottom:8px;">마스터 볼륨</h3>
  <div class="volume-level" id="valLabel">50%</div>

  <div class="slider-wrapper" id="wrapper">
    <div class="track-bg">
      <div class="track-fill" id="fill" style="height: 50%;"></div>
    </div>
    <div class="thumb" id="thumb" style="bottom: 50%;"></div>
  </div>
</div>

<script>
  const wrapper = document.getElementById('wrapper');
  const thumb = document.getElementById('thumb');
  const fill = document.getElementById('fill');
  const label = document.getElementById('valLabel');

  let activePointerId = null;
  let volume = 50;

  function updateVolume(val) {
    volume = Math.max(0, Math.min(100, val));
    thumb.style.bottom = `${volume}%`;
    fill.style.height = `${volume}%`;
    label.textContent = `${Math.round(volume)}%`;
  }

  wrapper.addEventListener('pointerdown', (e) => {
    if (activePointerId !== null) return;
    activePointerId = e.pointerId;
    try { wrapper.setPointerCapture(e.pointerId); } catch(err) {}
    thumb.classList.add('active');
    handlePointer(e.clientY);
  });

  wrapper.addEventListener('pointermove', (e) => {
    if (e.pointerId !== activePointerId) return;
    handlePointer(e.clientY);
  });

  function handlePointer(clientY) {
    const rect = wrapper.getBoundingClientRect();
    const relativeY = rect.bottom - clientY;
    const pct = (relativeY / rect.height) * 100;
    updateVolume(pct);
  }

  const release = (e) => {
    if (e.pointerId !== activePointerId) return;
    activePointerId = null;
    thumb.classList.remove('active');
    try { wrapper.releasePointerCapture(e.pointerId); } catch(err) {}
  };

  wrapper.addEventListener('pointerup', release);
  wrapper.addEventListener('pointercancel', release);
</script>
</body>
</html>
