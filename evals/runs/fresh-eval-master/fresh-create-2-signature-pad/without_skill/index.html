<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Signature Pad (Without Skill)</title>
<style>
  body { font-family: sans-serif; padding: 20px; background: #f4f4f4; height: 150vh; }
  canvas { background: #fff; border: 1px solid #ccc; border-radius: 8px; width: 100%; height: 200px; }
</style>
</head>
<body>
  <h3>전자 서명 패드 (Without Skill)</h3>
  <p style="font-size:13px; color:#666;">서명하려고 손가락을 대고 그릴 때 화면 스크롤이 함께 움직여 서명이 찢어집니다.</p>
  <canvas id="canvas"></canvas>
<script>
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  let drawing = false;

  canvas.width = canvas.clientWidth;
  canvas.height = canvas.clientHeight;

  canvas.onmousedown = (e) => { drawing = true; ctx.beginPath(); ctx.moveTo(e.offsetX, e.offsetY); };
  canvas.onmousemove = (e) => { if (drawing) { ctx.lineTo(e.offsetX, e.offsetY); ctx.stroke(); } };
  window.onmouseup = () => drawing = false;

  canvas.ontouchstart = (e) => {
    drawing = true;
    const rect = canvas.getBoundingClientRect();
    ctx.beginPath();
    ctx.moveTo(e.touches[0].clientX - rect.left, e.touches[0].clientY - rect.top);
  };
  canvas.ontouchmove = (e) => {
    if (drawing) {
      const rect = canvas.getBoundingClientRect();
      ctx.lineTo(e.touches[0].clientX - rect.left, e.touches[0].clientY - rect.top);
      ctx.stroke();
    }
  };
  window.ontouchend = () => drawing = false;
</script>
</body>
</html>
