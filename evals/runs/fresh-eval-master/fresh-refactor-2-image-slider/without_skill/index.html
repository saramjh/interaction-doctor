<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Image Slider (Without Skill)</title>
<style>
body { margin:0; padding:20px; font-family:sans-serif; background:#222; color:#fff; display:flex; flex-direction:column; align-items:center; }
.compare-container { position:relative; width:300px; height:200px; overflow:hidden; }
.img-before { position:absolute; top:0; left:0; width:100%; height:100%; background:linear-gradient(45deg, #f06, #4a90e2); display:flex; align-items:center; justify-content:center; font-size:24px; font-weight:bold; }
.img-after { position:absolute; top:0; left:0; width:50%; height:100%; background:linear-gradient(45deg, #11998e, #38ef7d); overflow:hidden; display:flex; align-items:center; justify-content:center; font-size:24px; font-weight:bold; }
.handle { position:absolute; top:0; left:50%; width:4px; height:100%; background:#fff; cursor:ew-resize; }
</style>
</head>
<body>
<h3>비교 슬라이더 (Without Skill)</h3>
<p style="font-size:12px; color:#aaa;">모바일에서 핸들을 드래그할 때 텍스트 선택이 일어나고 드래그가 끊깁니다.</p>
<div class="compare-container" id="container">
  <div class="img-before">BEFORE</div>
  <div class="img-after" id="after">AFTER</div>
  <div class="handle" id="handle"></div>
</div>
<script>
const container = document.getElementById('container');
const after = document.getElementById('after');
const handle = document.getElementById('handle');
let isDown = false;

handle.onmousedown = () => isDown = true;
handle.ontouchstart = () => isDown = true;
window.onmouseup = () => isDown = false;
window.ontouchend = () => isDown = false;

window.addEventListener('touchmove', (e) => {
  if (!isDown) return;
  const rect = container.getBoundingClientRect();
  const x = e.touches[0].clientX - rect.left;
  const pct = Math.max(0, Math.min(100, (x / rect.width) * 100));
  handle.style.left = pct + '%';
  after.style.width = pct + '%';
});
</script>
</body>
</html>
