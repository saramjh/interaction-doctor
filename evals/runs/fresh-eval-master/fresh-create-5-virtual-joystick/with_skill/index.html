<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Virtual Joystick (With Skill - Interaction Doctor)</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #020617;
    color: #f8fafc;
    height: 100vh;
    overflow: hidden;
    touch-action: none;
    overscroll-behavior: none;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  .info-text {
    position: absolute;
    top: 40px;
    font-size: 14px;
    color: #94a3b8;
    text-align: center;
  }
  .joystick-base {
    position: relative;
    width: 180px;
    height: 180px;
    background: rgba(30, 41, 59, 0.7);
    border: 2px solid #334155;
    border-radius: 50%;
    backdrop-filter: blur(8px);
    display: flex;
    align-items: center;
    justify-content: center;
    touch-action: none;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
  }
  .joystick-stick {
    position: absolute;
    width: 70px;
    height: 70px;
    background: linear-gradient(135deg, #38bdf8, #818cf8);
    border: 3px solid #ffffff;
    border-radius: 50%;
    box-shadow: 0 4px 16px rgba(56, 189, 248, 0.5);
    cursor: grab;
    will-change: transform;
    touch-action: none;
    transition: transform 0.15s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.15s;
    pointer-events: none;
  }
  .joystick-base.active .joystick-stick {
    cursor: grabbing;
    transition: none; /* 조작 중 1:1 즉각 밀착 */
    box-shadow: 0 8px 24px rgba(56, 189, 248, 0.8);
    transform: scale(1.1);
  }
  .vector-readout {
    margin-top: 40px;
    font-family: monospace;
    font-size: 15px;
    color: #38bdf8;
  }
</style>
</head>
<body>

<div class="info-text">
  <h3 style="color:#f8fafc; margin-bottom:4px;">🕹️ 모바일 가상 조이스틱</h3>
  <p>멀티터치 간섭 없이 1:1로 손가락을 추종하며, 놓으면 즉시 중앙으로 복귀합니다.</p>
</div>

<div class="joystick-base" id="base">
  <div class="joystick-stick" id="stick"></div>
</div>

<div class="vector-readout" id="readout">X: 0.00 | Y: 0.00</div>

<script>
  const base = document.getElementById('base');
  const stick = document.getElementById('stick');
  const readout = document.getElementById('readout');

  let activePointerId = null;
  const MAX_RADIUS = 55; // 스틱 이동 최대 반경

  function handleVector(clientX, clientY) {
    const rect = base.getBoundingClientRect();
    const centerX = rect.left + rect.width / 2;
    const centerY = rect.top + rect.height / 2;

    const dx = clientX - centerX;
    const dy = clientY - centerY;
    const dist = Math.hypot(dx, dy);

    const clampedDist = Math.min(MAX_RADIUS, dist);
    const angle = Math.atan2(dy, dx);

    const stickX = Math.cos(angle) * clampedDist;
    const stickY = Math.sin(angle) * clampedDist;

    stick.style.transform = `translate3d(${stickX}px, ${stickY}px, 0)`;

    const normX = (stickX / MAX_RADIUS).toFixed(2);
    const normY = (-stickY / MAX_RADIUS).toFixed(2);
    readout.textContent = `X: ${normX} | Y: ${normY}`;
  }

  base.addEventListener('pointerdown', (e) => {
    if (activePointerId !== null) return;
    activePointerId = e.pointerId;
    try { base.setPointerCapture(e.pointerId); } catch(err) {}
    base.classList.add('active');
    handleVector(e.clientX, e.clientY);
  });

  base.addEventListener('pointermove', (e) => {
    if (e.pointerId !== activePointerId) return;
    handleVector(e.clientX, e.clientY);
  });

  const releaseStick = (e) => {
    if (e.pointerId !== activePointerId) return;
    activePointerId = null;
    base.classList.remove('active');
    stick.style.transform = 'translate3d(0, 0, 0)';
    readout.textContent = 'X: 0.00 | Y: 0.00';
    try { base.releasePointerCapture(e.pointerId); } catch(err) {}
  };

  base.addEventListener('pointerup', releaseStick);
  base.addEventListener('pointercancel', releaseStick);
</script>
</body>
</html>
