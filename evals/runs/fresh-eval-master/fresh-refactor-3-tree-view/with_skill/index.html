<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Tree View (With Skill - Interaction Doctor)</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 24px 16px;
    background: #0f172a;
    color: #f8fafc;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
  }
  .card-box {
    background: #1e293b;
    border: 1px solid #334155;
    padding: 20px;
    border-radius: 16px;
    max-width: 440px;
    margin: 0 auto;
  }
  .tree-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-top: 14px;
  }
  .tree-item {
    padding: 14px 16px;
    background: #0f172a;
    border: 1px solid #334155;
    border-radius: 10px;
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 14px;
    cursor: pointer;
    touch-action: pan-y;
    transition: background 0.15s, transform 0.15s;
  }
  .tree-item.pressed {
    background: #1e293b;
    transform: scale(0.98);
  }
  .context-menu {
    position: fixed;
    background: #1e293b;
    border: 1px solid #38bdf8;
    border-radius: 12px;
    padding: 6px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.6);
    display: flex;
    flex-direction: column;
    min-width: 150px;
    z-index: 100;
    opacity: 0;
    visibility: hidden;
    transform: scale(0.9);
    transition: opacity 0.18s, transform 0.18s, visibility 0.18s;
  }
  .context-menu.open {
    opacity: 1;
    visibility: visible;
    transform: scale(1);
  }
  .menu-btn {
    padding: 10px 14px;
    background: transparent;
    border: none;
    color: #e2e8f0;
    text-align: left;
    font-size: 13px;
    border-radius: 6px;
    cursor: pointer;
  }
  .menu-btn:hover {
    background: #334155;
    color: #38bdf8;
  }
</style>
</head>
<body>

<div class="card-box">
  <h3 style="font-size:16px;">📁 클라우드 파일 탐색기</h3>
  <p style="font-size:12px; color:#94a3b8; margin-top:4px;">탭하면 폴더가 열리고, 길게 누르면(450ms) 컨텍스트 메뉴가 뜹니다.</p>

  <div class="tree-list" id="treeList">
    <div class="tree-item" data-name="프로젝트_디자인_리소스">
      <span>📂</span>
      <span style="font-weight:600;">프로젝트_디자인_리소스</span>
    </div>
    <div class="tree-item" data-name="2026_개발_문서">
      <span>📂</span>
      <span style="font-weight:600;">2026_개발_문서</span>
    </div>
    <div class="tree-item" data-name="배포_릴리즈_바이너리">
      <span>📂</span>
      <span style="font-weight:600;">배포_릴리즈_바이너리</span>
    </div>
  </div>
</div>

<div class="context-menu" id="contextMenu">
  <button class="menu-btn" onclick="action('이름 변경')">✏️ 이름 바꾸기</button>
  <button class="menu-btn" onclick="action('다운로드')">📥 다운로드</button>
  <button class="menu-btn" style="color:#f87171;" onclick="action('삭제')">🗑️ 삭제</button>
</div>

<script>
  const menu = document.getElementById('contextMenu');
  let activePointerId = null;
  let longPressTimer = null;
  let startX = 0, startY = 0;
  let suppressClick = false;
  let selectedTarget = null;
  const SLOP_PX = 8;
  const LONG_PRESS_DELAY = 450;

  function closeMenu() {
    menu.classList.remove('open');
  }

  function action(type) {
    alert(`[${selectedTarget}] ${type} 실행`);
    closeMenu();
  }

  document.querySelectorAll('.tree-item').forEach(item => {
    item.addEventListener('pointerdown', (e) => {
      if (activePointerId !== null) return;
      activePointerId = e.pointerId;
      startX = e.clientX;
      startY = e.clientY;
      suppressClick = false;
      item.classList.add('pressed');

      longPressTimer = setTimeout(() => {
        suppressClick = true; // 롱프레스 발동 시 클릭 이벤트 억제
        selectedTarget = item.dataset.name;
        item.classList.remove('pressed');

        // 컨텍스트 메뉴 화면 내 안전 배치
        const menuWidth = 160;
        const posX = Math.min(window.innerWidth - menuWidth - 16, Math.max(16, e.clientX - 20));
        const posY = Math.min(window.innerHeight - 150, e.clientY - 20);

        menu.style.left = `${posX}px`;
        menu.style.top = `${posY}px`;
        menu.classList.add('open');

        if (navigator.vibrate) navigator.vibrate(40);
      }, LONG_PRESS_DELAY);
    });

    item.addEventListener('pointermove', (e) => {
      if (e.pointerId !== activePointerId) return;
      if (Math.hypot(e.clientX - startX, e.clientY - startY) > SLOP_PX) {
        clearTimeout(longPressTimer);
        item.classList.remove('pressed');
      }
    });

    const onRelease = (e) => {
      if (e.pointerId !== activePointerId) return;
      clearTimeout(longPressTimer);
      item.classList.remove('pressed');
      activePointerId = null;
    };

    item.addEventListener('pointerup', onRelease);
    item.addEventListener('pointercancel', onRelease);

    item.addEventListener('click', (e) => {
      if (suppressClick) {
        e.preventDefault();
        e.stopPropagation();
        return;
      }
      alert(`📂 [${item.dataset.name}] 폴더 진입`);
    });
  });

  document.addEventListener('pointerdown', (e) => {
    if (!menu.contains(e.target) && !e.target.closest('.tree-item')) {
      closeMenu();
    }
  });
</script>
</body>
</html>
