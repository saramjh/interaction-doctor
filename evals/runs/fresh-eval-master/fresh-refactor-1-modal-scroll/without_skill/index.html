<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Modal Scroll Chaining (Without Skill)</title>
<style>
body { margin:0; padding:20px; font-family:sans-serif; height:200vh; background:#f0f0f0; }
.modal-overlay { position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); display:none; align-items:center; justify-content:center; }
.modal-overlay.open { display:flex; }
.modal-box { width:80%; max-height:250px; background:#fff; border-radius:8px; padding:20px; overflow-y:scroll; }
</style>
</head>
<body>
<button id="btnOpen" style="padding:10px 16px;">모달 열기</button>
<p style="margin-top:20px;">본문 내용입니다 (아래로 스크롤 가능). 모달 안에서 스크롤이 끝에 도달했을 때 손가락을 더 당기면 뒤의 본문이 스크롤되는 결함이 있습니다.</p>
<div class="modal-overlay" id="overlay">
  <div class="modal-box" id="box">
    <h3>이용약관 모달</h3>
    <p>약관 내용 1</p><p>약관 내용 2</p><p>약관 내용 3</p><p>약관 내용 4</p><p>약관 내용 5</p><p>약관 내용 6</p><p>약관 내용 7</p><p>약관 내용 8</p>
  </div>
</div>
<script>
const btn = document.getElementById('btnOpen');
const overlay = document.getElementById('overlay');
btn.onclick = () => overlay.classList.add('open');
overlay.onclick = (e) => { if(e.target === overlay) overlay.classList.remove('open'); };
</script>
</body>
</html>
