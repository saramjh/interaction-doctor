<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Interaction Doctor — 복합 다기능 프로그램 10대 A/B 실증 러너</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0d1117;
    color: #e6edf3;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  header {
    background: #161b22;
    padding: 10px 16px;
    border-bottom: 1px solid #30363d;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-shrink: 0;
  }
  h1 { font-size: 15px; font-weight: 600; color: #58a6ff; }
  .tabs-container {
    background: #161b22;
    padding: 6px 16px;
    border-bottom: 1px solid #21262d;
    display: flex;
    gap: 6px;
    overflow-x: auto;
    flex-shrink: 0;
  }
  .tab-btn {
    background: #21262d;
    color: #c9d1d9;
    border: 1px solid #30363d;
    padding: 5px 12px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 12px;
    white-space: nowrap;
    transition: all 0.2s;
  }
  .tab-btn.active {
    background: #1f6feb;
    color: #fff;
    border-color: #388bfd;
  }
  .container {
    flex: 1;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    padding: 12px;
    background: #090d13;
    overflow: hidden;
  }
  .panel {
    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 8px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .panel-header {
    padding: 8px 14px;
    font-size: 13px;
    font-weight: 600;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid #30363d;
  }
  .badge-noskill {
    background: #f8514922;
    color: #f85149;
    border: 1px solid #f8514944;
    padding: 2px 8px;
    border-radius: 12px;
    font-size: 11px;
  }
  .badge-withskill {
    background: #2ea04322;
    color: #3fb950;
    border: 1px solid #2ea04344;
    padding: 2px 8px;
    border-radius: 12px;
    font-size: 11px;
  }
  iframe {
    flex: 1;
    width: 100%;
    height: 100%;
    border: none;
    background: #ffffff;
  }
  .prompt-bar {
    padding: 6px 14px;
    background: #13171f;
    font-size: 12px;
    color: #8b949e;
    border-bottom: 1px solid #21262d;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
</style>
</head>
<body>

<header>
  <h1>🧩 복합 다기능 프로그램 10대 A/B 실증 러너</h1>
  <div style="font-size:12px; color:#8b949e;">여러 인터랙션이 겹친 복합 앱에서의 제스처 격리 실증</div>
</header>

<div class="tabs-container">
  <button class="tab-btn active" onclick="loadScenario('multi-01-insta-story-editor', 0)">1. 스토리 스튜디오</button>
  <button class="tab-btn" onclick="loadScenario('multi-02-music-daw-mini', 1)">2. 모바일 음악 DAW</button>
  <button class="tab-btn" onclick="loadScenario('multi-03-ecommerce-product-sheet', 2)">3. 커머스 상세+바텀시트</button>
  <button class="tab-btn" onclick="loadScenario('multi-04-kanban-board-mobile', 3)">4. 애자일 칸반 보드</button>
  <button class="tab-btn" onclick="loadScenario('multi-05-photo-crop-filter', 4)">5. 사진 크롭 & 필터</button>
  <button class="tab-btn" onclick="loadScenario('multi-06-rideshare-map-booking', 5)">6. 택시 호출 지도 앱</button>
  <button class="tab-btn" onclick="loadScenario('multi-07-video-reels-feed', 6)">7. 숏폼 비디오 피드</button>
  <button class="tab-btn" onclick="loadScenario('multi-08-smart-home-dashboard', 7)">8. 스마트홈 IoT 허브</button>
  <button class="tab-btn" onclick="loadScenario('multi-09-spreadsheet-mobile', 8)">9. 모바일 데이터 그리드</button>
  <button class="tab-btn" onclick="loadScenario('multi-10-chat-media-drawer', 9)">10. 메신저 채널 드로어</button>
</div>

<div class="prompt-bar" id="promptBar">
  시나리오 목표 로딩 중...
</div>

<div class="container">
  <div class="panel">
    <div class="panel-header">
      <span>❌ Without Skill (기본 웹 코딩)</span>
      <span class="badge-noskill">Without Skill</span>
    </div>
    <iframe id="frameLeft"></iframe>
  </div>

  <div class="panel">
    <div class="panel-header">
      <span>✅ With Skill (interaction-doctor 적용)</span>
      <span class="badge-withskill">With Skill</span>
    </div>
    <iframe id="frameRight"></iframe>
  </div>
</div>

<script>
  const scenarioTitles = {
    'multi-01-insta-story-editor': '스토리 스튜디오 (배경 2손가락 핀치줌 + 스티커 1손가락 드래그/색상변경 제스처 격리)',
    'multi-02-music-daw-mini': '모바일 음악 DAW (타임라인 가로 스크롤 + 클립 그리드 스냅 DnD + 볼륨 페이더 격리)',
    'multi-03-ecommerce-product-sheet': '커머스 상세 (상품 이미지 캐러셀 + 스와이프 다운 닫기 바텀시트 + 수량/옵션 칩)',
    'multi-04-kanban-board-mobile': '애자일 칸반 보드 (컬럼 가로 스크롤 + 카드 세로 스크롤 + 롱프레스 카드 컬럼간 이동)',
    'multi-05-photo-crop-filter': '사진 크롭 스튜디오 (크롭 박스 이동 vs 우하단 리사이즈 핸들 vs 실시간 필터 슬라이더)',
    'multi-06-rideshare-map-booking': '택시 호출 지도 앱 (배경 지도 2D 패닝 + 3단계 스냅 바텀시트 + 배차 리스트 스크롤)',
    'multi-07-video-reels-feed': '숏폼 비디오 피드 (세로 스냅 스와이프 + 싱글탭 일시정지 vs 더블탭 하트 버스트)',
    'multi-08-smart-home-dashboard': '스마트홈 IoT 허브 (대시보드 세로 스크롤 + 조명 타일 내부 원형 밝기 다이얼 격리)',
    'multi-09-spreadsheet-mobile': '모바일 데이터 그리드 (첫행/첫열 동시 교차 고정 2D 스크롤 + 셀 범위 선택)',
    'multi-10-chat-media-drawer': '메신저 채널 드로어 (좌측 채널 서랍 슬라이드 + 메시지 스크롤 + 미디어 첨부 시트)'
  };

  function loadScenario(scId, tabIdx) {
    document.querySelectorAll('.tab-btn').forEach((btn, idx) => {
      btn.classList.toggle('active', idx === tabIdx);
    });

    document.getElementById('promptBar').textContent = `📋 목표: ${scenarioTitles[scId] || scId}`;

    const frameLeft = document.getElementById('frameLeft');
    const frameRight = document.getElementById('frameRight');

    frameLeft.src = `../evals/runs/complex-10-master/${scId}/without_skill/index.html`;
    frameRight.src = `../evals/runs/complex-10-master/${scId}/with_skill/index.html`;
  }

  window.onload = () => loadScenario('multi-01-insta-story-editor', 0);
</script>
</body>
</html>
