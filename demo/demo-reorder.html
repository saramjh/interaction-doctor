<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>재생목록</title>
<style>
  :root {
    --bg: #0b0d12;
    --card: #171a21;
    --card-lift: #1f2937;
    --line: #262a33;
    --fg: #e8eaed;
    --dim: #7b8290;
    --accent: #5b8cff;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; }
  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--fg);
    font: 15px/1.4 -apple-system, "Pretendard", "Noto Sans KR", sans-serif;
    overscroll-behavior: none;
  }
  body { display: flex; flex-direction: column; }

  /* ---- top toggle ---- */
  header {
    flex: 0 0 auto;
    padding: 18px 20px 10px;
    text-align: center;
  }
  h1 {
    font-size: 17px;
    font-weight: 700;
    letter-spacing: -0.01em;
  }
  .purpose {
    margin-top: 6px;
    font-size: 12px;
    color: var(--dim);
  }
  .toggle {
    margin: 14px auto 0;
    display: inline-flex;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 3px;
  }
  .toggle button {
    border: 0;
    background: transparent;
    color: var(--dim);
    font: inherit;
    font-weight: 600;
    padding: 9px 22px;
    border-radius: 999px;
    transition: background .2s, color .2s;
  }
  .toggle button.on {
    background: var(--accent);
    color: #fff;
  }

  /* ---- list ---- */
  main {
    flex: 1 1 auto;
    overflow-y: auto;
    padding: 4px 16px 40px;
    -webkit-overflow-scrolling: touch;
  }
  ul { list-style: none; padding: 0; }

  li.track {
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 13px 14px;
    margin-bottom: 9px;
    user-select: none;
    -webkit-user-select: none;
    transition: box-shadow .18s, background .18s;
    will-change: transform;
  }
  li.track.lifted {
    background: var(--card-lift);
    box-shadow: 0 14px 30px rgba(0,0,0,.5);
    z-index: 5;
  }

  .art {
    width: 42px; height: 42px; border-radius: 9px; flex: 0 0 auto;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
  }
  .meta { flex: 1 1 auto; min-width: 0; }
  .title { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .artist { color: var(--dim); font-size: 12.5px; margin-top: 2px; }
  .handle {
    flex: 0 0 auto; width: 22px; height: 22px;
    display: flex; align-items: center; justify-content: center;
    color: var(--line);
  }

  footer {
    flex: 0 0 auto;
    padding: 12px 20px 20px;
    text-align: center;
    color: var(--dim);
    font-size: 13px;
    min-height: 44px;
  }
  footer b { color: var(--fg); }
</style>
</head>
<body>

<header>
  <h1>Playlist</h1>
  <p class="purpose">This demo shows a common interaction bug found in real apps — it's not a skill-effect comparison.</p>
  <div class="toggle">
    <button id="btnBefore" class="on">Before</button>
    <button id="btnAfter">After</button>
  </div>
</header>

<main>
  <ul id="list"></ul>
</main>

<footer id="caption"></footer>

<script>
(function () {
  'use strict';

  var TRACKS = [
    ['🎧','Song 01','Artist A'],
    ['🎸','Song 02','Artist B'],
    ['🎹','Song 03','Artist C'],
    ['🎤','Song 04','Artist D'],
    ['🥁','Song 05','Artist E'],
    ['🎻','Song 06','Artist F'],
    ['🎺','Song 07','Artist G']
  ];

  var listEl = document.getElementById('list');
  var captionEl = document.getElementById('caption');
  var mode = 'before';   // 'before' | 'after'

  var COLORS = ['#5b8cff33','#ff6b8533','#ffb64533','#4ade8033','#a78bfa33','#22d3ee33','#f472b633'];

  function render() {
    listEl.innerHTML = '';
    TRACKS.forEach(function (t, i) {
      var li = document.createElement('li');
      li.className = 'track';
      li.innerHTML =
        '<div class="art" style="background:' + COLORS[i % COLORS.length] + '">' + t[0] + '</div>' +
        '<div class="meta"><div class="title">' + t[1] + '</div><div class="artist">' + t[2] + '</div></div>' +
        '<div class="handle">' +
          '<svg width="16" height="16" viewBox="0 0 16 16" fill="none">' +
          '<circle cx="6" cy="4" r="1.4" fill="currentColor"/><circle cx="10" cy="4" r="1.4" fill="currentColor"/>' +
          '<circle cx="6" cy="8" r="1.4" fill="currentColor"/><circle cx="10" cy="8" r="1.4" fill="currentColor"/>' +
          '<circle cx="6" cy="12" r="1.4" fill="currentColor"/><circle cx="10" cy="12" r="1.4" fill="currentColor"/>' +
          '</svg>' +
        '</div>';
      listEl.appendChild(li);
    });
    attach();
  }

  function setMode(m) {
    mode = m;
    document.getElementById('btnBefore').classList.toggle('on', m === 'before');
    document.getElementById('btnAfter').classList.toggle('on', m === 'after');
    captionEl.innerHTML = m === 'before'
      ? "Before: Grabbing the card anywhere doesn't work, even with a visible handle"
      : 'After: Grab the handle precisely, and it moves instantly';
    render();
  }
  document.getElementById('btnBefore').onclick = function () { setMode('before'); };
  document.getElementById('btnAfter').onclick = function () { setMode('after'); };

  /* ============== gesture handling ==============
     3-A(핸들 있음) 케이스: 핸들이 탭/드래그 타겟을 분리한다는 것만
     [표준]으로 확정된 사실이다(recipes: reorderable-list.md 3-A 판정).
     "핸들 = 지연 0ms"는 Android API 문서(startDrag)에서만 [표준]이고
     iOS/Google 1st-party 앱 문서는 반례 표현을 쓰는 [미확정] 지점인데,
     여기서는 사용자가 명시적으로 "지연 없이 즉시 드래그"를 요구했으므로
     그대로 구현한다 — 스킬이 임의로 가정한 게 아니다.
     Before 모드는 이 리스너 자체를 붙이지 않는다 — "핸들은 그려져
     있지만 로직은 무시됨"을 코드 자체로 만든다(early-return이 아니라
     아예 미부착).
  */

  var G = null; // active gesture state

  function attach() {
    var handles = [].slice.call(listEl.querySelectorAll('.handle'));
    handles.forEach(function (h) {
      if (mode === 'after') {
        h.style.touchAction = 'none';
        h.addEventListener('pointerdown', onHandleDown);
      } else {
        h.style.touchAction = '';
      }
    });
  }

  function onHandleDown(e) {
    if (G) return;
    var handle = e.currentTarget;
    var li = handle.closest('.track');
    var rect = li.getBoundingClientRect();

    G = {
      li: li,
      id: e.pointerId,
      pointerOffsetTop: e.clientY - rect.top
    };
    li.classList.add('lifted');

    try {
      handle.setPointerCapture(e.pointerId);
    } catch (err) {
      console.warn('setPointerCapture failed:', err);
    }

    window.addEventListener('pointermove', onMove);
    window.addEventListener('pointerup', onUp);
    window.addEventListener('pointercancel', onCancel);
  }

  function onMove(e) {
    if (!G || e.pointerId !== G.id) return;
    var li = G.li;
    var currentTop = e.clientY - G.pointerOffsetTop;
    var activeCenterY = currentTop + li.offsetHeight / 2;

    var siblings = [].slice.call(listEl.querySelectorAll('.track')).filter(function (el) {
      return el !== li;
    });
    var target = null;
    for (var i = 0; i < siblings.length; i++) {
      var r = siblings[i].getBoundingClientRect();
      var c = r.top + r.height / 2;
      if (activeCenterY < c) { target = siblings[i]; break; }
    }

    // DOM 이동 방식(insertBefore) — render() 재생성 없이 실제 li를 그대로 옮긴다.
    // 재생성 시 드래그 기준점(activeItem 참조)이 끊기는 문제를 원천적으로 피한다.
    li.style.transform = 'none';
    if (target) {
      listEl.insertBefore(li, target);
    } else {
      listEl.appendChild(li);
    }
    var newRect = li.getBoundingClientRect();
    var dy = currentTop - newRect.top;
    li.style.transform = 'translateY(' + dy + 'px)';
  }

  function onUp(e) {
    if (!G || e.pointerId !== G.id) return;
    finish();
  }
  function onCancel(e) {
    if (!G || e.pointerId !== G.id) return;
    finish();
  }

  function finish() {
    var g = G; G = null;
    window.removeEventListener('pointermove', onMove);
    window.removeEventListener('pointerup', onUp);
    window.removeEventListener('pointercancel', onCancel);

    g.li.style.transform = '';
    g.li.classList.remove('lifted');
  }

  setMode('before');
})();
</script>
</body>
</html>
