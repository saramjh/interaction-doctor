<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>BottomSheet</title>
<style>
  body {
    margin: 0;
    font-family: sans-serif;
    background: #121212;
    color: #fff;
    height: 100vh;
    overflow: hidden;
  }
  .header-area { padding: 20px; }
  .sheet {
    position: fixed;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 70%;
    background: #1e1e1e;
    border-radius: 20px 20px 0 0;
    border-top: 1px solid #333;
    transform: translateY(0);
    transition: transform 0.2s ease-out;
    display: flex;
    flex-direction: column;
    z-index: 10;
  }
  .sheet.dragging {
    transition: none;
  }
  .handle-bar {
    width: 40px;
    height: 5px;
    background: #555;
    border-radius: 999px;
    margin: 10px auto;
    flex: 0 0 auto;
    cursor: grab;
  }
  .scroll-content {
    flex: 1 1 auto;
    overflow-y: auto;
    padding: 10px 20px 40px;
    -webkit-overflow-scrolling: touch;
    touch-action: pan-y; /* 스크롤 영역 내부에서의 기본 Y축 스크롤 보장 */
  }
  .item {
    padding: 15px;
    border-bottom: 1px solid #2a2a2a;
    color: #ddd;
  }
</style>
</head>
<body>

<div class="header-area">
  <h1>상세 정보</h1>
</div>

<div class="sheet" id="sheet">
  <div class="handle-bar"></div>
  <div class="scroll-content" id="scrollContent">
    <div class="item">📜 List Item 1</div>
    <div class="item">📜 List Item 2</div>
    <div class="item">📜 List Item 3</div>
    <div class="item">📜 List Item 4</div>
    <div class="item">📜 List Item 5</div>
    <div class="item">📜 List Item 6</div>
    <div class="item">📜 List Item 7</div>
    <div class="item">📜 List Item 8</div>
    <div class="item">📜 List Item 9</div>
    <div class="item">📜 List Item 10</div>
    <div class="item">📜 List Item 11</div>
    <div class="item">📜 List Item 12</div>
    <div class="item">📜 List Item 13</div>
    <div class="item">📜 List Item 14</div>
    <div class="item">📜 List Item 15</div>
  </div>
</div>

<script>
  const sheet = document.getElementById('sheet');
  const scrollContent = document.getElementById('scrollContent');
  let startY = 0;
  let currentY = 0;
  let isDraggingSheet = false;      // 바텀시트 자체가 드래그되어 닫히는 모드인지 여부
  let dragStartOnScrollable = false; // 스크롤 가능 영역에서 터치가 시작되었는지 여부
  let activePointerId = null;

  sheet.addEventListener('pointerdown', (e) => {
    const isOnScroll = e.target.closest('#scrollContent');
    startY = e.clientY;
    currentY = 0;
    activePointerId = e.pointerId;

    if (isOnScroll) {
      // 리스트 스크롤 영역 내부를 터치한 경우
      dragStartOnScrollable = true;
      isDraggingSheet = false; // 일단 바텀시트 드래그는 시작하지 않고 브라우저 스크롤을 우선 대기
    } else {
      // 핸들바나 상단 빈 공간 등 비스크롤 영역을 터치한 경우 즉시 드래그 개시
      dragStartOnScrollable = false;
      isDraggingSheet = true;
      sheet.classList.add('dragging');
      sheet.setPointerCapture(e.pointerId);
    }
  });

  window.addEventListener('pointermove', (e) => {
    if (activePointerId !== e.pointerId) return;

    const dy = e.clientY - startY;

    if (dragStartOnScrollable && !isDraggingSheet) {
      // 스크롤 가능 영역 내부 터치 후 대기 중인 상태에서:
      // 리스트가 최상단(scrollTop <= 0)에 있고 사용자가 아래 방향으로 드래그할 때(dy > 0)
      // 이때는 바텀시트 닫기를 의도한 제스처로 판단하여 소유권을 시트로 전환
      if (scrollContent.scrollTop <= 0 && dy > 0) {
        isDraggingSheet = true;
        dragStartOnScrollable = false;
        sheet.classList.add('dragging');
        sheet.setPointerCapture(e.pointerId); // 스크롤을 포기시키고 시트 드래그 캡처 획득
        scrollContent.scrollTop = 0; // 스크롤 오프셋 리셋
      }
    }

    if (isDraggingSheet) {
      // 바텀시트 닫기 드래그 상태
      if (dy >= 0) {
        e.preventDefault(); // 기본 오버스크롤 효과 차단
        sheet.style.transform = `translateY(${dy}px)`;
        currentY = dy;
      } else {
        // 위 방향 드래그 시 한계점(0px) 이상 올라가지 않도록 제어
        sheet.style.transform = 'translateY(0)';
        currentY = 0;
      }
    }
  });

  const handlePointerUp = (e) => {
    if (activePointerId !== e.pointerId) return;

    if (isDraggingSheet) {
      sheet.releasePointerCapture(e.pointerId);
      sheet.classList.remove('dragging');
      
      // 드래그 거리가 바텀시트 높이의 25%를 초과하면 완전히 닫고, 그렇지 않으면 복귀
      if (currentY > window.innerHeight * 0.25) {
        sheet.style.transform = 'translateY(100%)';
      } else {
        sheet.style.transform = 'translateY(0)';
      }
    }

    // 상태 리셋
    isDraggingSheet = false;
    dragStartOnScrollable = false;
    currentY = 0;
    activePointerId = null;
  };

  window.addEventListener('pointerup', handlePointerUp);
  window.addEventListener('pointercancel', handlePointerUp);
</script>
</body>
</html>
