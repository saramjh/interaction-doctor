<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>재생목록</title>
<style>
  :root {
    --bg: #0b0d12;
    --card: #171a21;
    --card-lift: #1f2937;
    --line: #262a33;
    --fg: #e8eaed;
    --dim: #7b8290;
    --accent: #5b8cff;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; }
  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--fg);
    font: 15px/1.4 -apple-system, "Pretendard", "Noto Sans KR", sans-serif;
    overscroll-behavior: none;
  }
  body { display: flex; flex-direction: column; }

  /* ---- top toggle ---- */
  header {
    flex: 0 0 auto;
    padding: 18px 20px 14px;
    text-align: center;
  }
  h1 {
    font-size: 17px;
    font-weight: 700;
    letter-spacing: -0.01em;
  }
  .toggle {
    margin: 14px auto 0;
    display: inline-flex;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 3px;
  }
  .toggle button {
    border: 0;
    background: transparent;
    color: var(--dim);
    font: inherit;
    font-weight: 600;
    padding: 9px 22px;
    border-radius: 999px;
    transition: background .2s, color .2s;
  }
  .toggle button.on {
    background: var(--accent);
    color: #fff;
  }

  /* ---- list ---- */
  main {
    flex: 1 1 auto;
    overflow-y: auto;
    padding: 4px 16px 40px;
    -webkit-overflow-scrolling: touch;
  }
  ul { list-style: none; }

  li.track {
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 13px 14px;
    margin-bottom: 9px;
    touch-action: auto;         /* JS overrides per mode */
    user-select: none;
    -webkit-user-select: none;
    transition: box-shadow .18s, background .18s;
    will-change: transform;
  }
  li.track.lifted {
    background: var(--card-lift);
    box-shadow: 0 14px 30px rgba(0,0,0,.5);
    z-index: 5;
  }
  li.track.dead-tap {
    animation: shake .32s;
  }
  @keyframes shake {
    0%,100% { transform: translateX(0); }
    25% { transform: translateX(-4px); }
    75% { transform: translateX(4px); }
  }

  .art {
    width: 42px; height: 42px; border-radius: 9px; flex: 0 0 auto;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
  }
  .meta { flex: 1 1 auto; min-width: 0; }
  .title { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .artist { color: var(--dim); font-size: 12.5px; margin-top: 2px; }
  .handle {
    flex: 0 0 auto; width: 22px; height: 22px;
    display: flex; align-items: center; justify-content: center;
    color: var(--line);
  }

  footer {
    flex: 0 0 auto;
    padding: 12px 20px 20px;
    text-align: center;
    color: var(--dim);
    font-size: 13px;
    min-height: 44px;
  }
  footer b { color: var(--fg); }
</style>
</head>
<body>

<header>
  <h1>재생목록</h1>
  <div class="toggle">
    <button id="btnBefore" class="on">Before</button>
    <button id="btnAfter">After</button>
  </div>
</header>

<main>
  <ul id="list"></ul>
</main>

<footer id="caption"></footer>

<script>
(function () {
  'use strict';

  var TRACKS = [
    ['🎧','밤편지','아이유'],
    ['🎸','Dynamite','방탄소년단'],
    ['🎹','Spring Day','방탄소년단'],
    ['🎤','Hype Boy','뉴진스'],
    ['🥁','After LIKE','아이브'],
    ['🎻','ETA','뉴진스'],
    ['🎺','Super Shy','뉴진스']
  ];

  var listEl = document.getElementById('list');
  var captionEl = document.getElementById('caption');
  var mode = 'before';   // 'before' | 'after'

  var COLORS = ['#5b8cff33','#ff6b8533','#ffb64533','#4ade8033','#a78bfa33','#22d3ee33','#f472b633'];

  function render() {
    listEl.innerHTML = '';
    TRACKS.forEach(function (t, i) {
      var li = document.createElement('li');
      li.className = 'track';
      li.innerHTML =
        '<div class="art" style="background:' + COLORS[i % COLORS.length] + '">' + t[0] + '</div>' +
        '<div class="meta"><div class="title">' + t[1] + '</div><div class="artist">' + t[2] + '</div></div>' +
        '<div class="handle">' +
          '<svg width="16" height="16" viewBox="0 0 16 16" fill="none">' +
          '<circle cx="6" cy="4" r="1.4" fill="currentColor"/><circle cx="10" cy="4" r="1.4" fill="currentColor"/>' +
          '<circle cx="6" cy="8" r="1.4" fill="currentColor"/><circle cx="10" cy="8" r="1.4" fill="currentColor"/>' +
          '<circle cx="6" cy="12" r="1.4" fill="currentColor"/><circle cx="10" cy="12" r="1.4" fill="currentColor"/>' +
          '</svg>' +
        '</div>';
      listEl.appendChild(li);
    });
    attach();
  }

  function setMode(m) {
    mode = m;
    document.getElementById('btnBefore').classList.toggle('on', m === 'before');
    document.getElementById('btnAfter').classList.toggle('on', m === 'after');
    captionEl.innerHTML = m === 'before'
      ? '항목을 눌러서 위아래로 밀어보세요'
      : '항목을 <b>꾹 눌러</b> 들어올린 다음 옮겨보세요';
    render();
  }
  document.getElementById('btnBefore').onclick = function () { setMode('before'); };
  document.getElementById('btnAfter').onclick = function () { setMode('after'); };

  /* ============== gesture handling ============== */

  function attach() {
    var items = [].slice.call(listEl.querySelectorAll('.track'));
    items.forEach(function (el) {
      el.style.touchAction = mode === 'before' ? 'auto' : 'pan-y';
      el.addEventListener('pointerdown', onDown);
    });
  }

  var G = null;          // active gesture state
  var LONG_MS = 500;
  var SLOP = 8;

  function onDown(e) {
    if (G) return;
    var el = e.currentTarget;
    var items = [].slice.call(listEl.querySelectorAll('.track'));

    G = {
      el: el, id: e.pointerId, x0: e.clientX, y0: e.clientY,
      lifted: false, longTimer: null, order: items.indexOf(el)
    };

    if (mode === 'after') {
      G.longTimer = setTimeout(function () {
        if (!G) return;
        G.lifted = true;
        G.el.classList.add('lifted');
        if (navigator.vibrate) navigator.vibrate(12);
      }, LONG_MS);
    }

    window.addEventListener('pointermove', onMove);
    window.addEventListener('pointerup', onUp);
    window.addEventListener('pointercancel', onCancel);
  }

  function onMove(e) {
    if (!G || e.pointerId !== G.id) return;
    var dx = e.clientX - G.x0, dy = e.clientY - G.y0;
    var dist = Math.hypot(dx, dy);

    if (mode === 'before') {
      // no drag ever happens — browser scroll wins natively, nothing to do
      return;
    }

    // after: only move once lifted (post long-press)
    if (G.lifted) {
      G.el.style.transform = 'translateY(' + dy + 'px)';
      reorderPreview(G, dy);
    } else if (dist > SLOP) {
      // moved before lift completed → cancel the long-press, let it scroll
      clearTimeout(G.longTimer);
    }
  }

  function reorderPreview(g, dy) {
    var items = [].slice.call(listEl.querySelectorAll('.track'));
    var idx = items.indexOf(g.el);
    var h = g.el.offsetHeight + 9;
    var target = idx;
    if (dy > h * 0.6 && idx < items.length - 1) target = idx + 1;
    else if (dy < -h * 0.6 && idx > 0) target = idx - 1;
    if (target !== idx) {
      var moved = TRACKS.splice(idx, 1)[0];
      TRACKS.splice(target, 0, moved);
      g.el.style.transform = '';
      render();
      var newItems = [].slice.call(listEl.querySelectorAll('.track'));
      var newEl = newItems[target];
      newEl.classList.add('lifted');
      g.el = newEl;
      g.x0 = g.x0; // keep origin; dy resets since transform cleared
    }
  }

  function onUp(e) {
    if (!G || e.pointerId !== G.id) return;
    finish(false);
  }
  function onCancel(e) {
    if (!G || e.pointerId !== G.id) return;
    finish(true);
  }

  function finish(cancelled) {
    var g = G; G = null;
    window.removeEventListener('pointermove', onMove);
    window.removeEventListener('pointerup', onUp);
    window.removeEventListener('pointercancel', onCancel);
    clearTimeout(g.longTimer);

    if (mode === 'before' && !g.lifted) {
      // subtle shake to show "nothing happened here, only the list scrolled"
      g.el.classList.add('dead-tap');
      setTimeout(function () { g.el.classList.remove('dead-tap'); }, 340);
    }
    if (g.lifted) {
      g.el.style.transform = '';
      setTimeout(function () { g.el.classList.remove('lifted'); }, 120);
    }
  }

  setMode('before');
})();
</script>
</body>
</html>
