<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>C8 / C9 / C11 / C13 — scroll · swipe · pinch</title>
<style>
  :root{--bg:#0d1117;--panel:#161b22;--line:#30363d;--fg:#e6edf3;--dim:#8b949e;
        --ok:#3fb950;--warn:#d29922;--bad:#f85149;--accent:#58a6ff;--gap:#21262d;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--fg);
    font:12px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace;height:100dvh;overflow:hidden}
  body{display:flex;flex-direction:column}

  #guide{flex:0 0 auto;background:var(--panel);border-bottom:1px solid var(--line);padding:8px 10px}
  #gTop{display:flex;justify-content:space-between;gap:8px;margin-bottom:5px}
  #gStep{font-size:11px;color:var(--dim)}
  #gCfg{font-size:11px;color:var(--accent);text-align:right}
  #gAction{font-size:15px;font-weight:700;line-height:1.3}
  #gWhy{font-size:11px;color:var(--dim);margin-top:3px}
  #gProg{display:flex;gap:4px;align-items:center;margin-top:7px;flex-wrap:wrap}
  .dot{width:14px;height:14px;border-radius:50%;border:1px solid var(--line);flex:0 0 auto}
  .dot.done{background:var(--ok);border-color:var(--ok)}
  .btn{background:transparent;color:var(--fg);border:1px solid var(--line);
       border-radius:5px;padding:6px 10px;font:inherit}
  .btn.primary{background:var(--accent);color:#04121f;border-color:var(--accent);font-weight:700}
  .btn:disabled{color:var(--dim);opacity:.45}
  #gNav{display:flex;gap:6px;margin-top:7px}
  #devLabel{flex:1;min-width:0;background:#0a0e14;border:1px solid var(--line);
            color:var(--fg);border-radius:5px;padding:6px 8px;font:inherit}

  #stage{flex:0 0 34dvh;overflow:hidden;border-bottom:1px solid var(--line);background:#0a0e14}
  #scroller{height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:8px}
  .item{background:var(--panel);border:1px solid var(--line);border-radius:6px;
        padding:14px 12px;margin-bottom:8px;will-change:transform}
  .item.active{border-color:var(--accent);background:#1c2b3a}
  .item.swipe{border-color:var(--warn)}
  .gapzone{background:var(--gap);border:1px dashed var(--line);border-radius:6px;
           padding:10px;margin-bottom:8px;color:var(--dim);text-align:center}

  #panel{flex:1 1 auto;overflow-y:auto;padding:8px 10px 40px}
  #verdict{border:1px solid var(--line);border-radius:6px;padding:8px;
           margin-bottom:8px;background:var(--panel)}
  #chips{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:4px}
  .chip{border:1px solid var(--line);border-radius:4px;padding:2px 6px;font-size:11px;color:var(--dim)}
  .chip.hit{border-color:var(--ok);color:var(--ok);font-weight:700}
  .chip.bad{border-color:var(--bad);color:var(--bad);font-weight:700}
  .chip.warn{border-color:var(--warn);color:var(--warn);font-weight:700}
  #vNote{font-size:11px;color:var(--dim)}
  .row{display:flex;justify-content:space-between;gap:8px;padding:2px 0}
  .row .k{color:var(--dim)}.row .v{text-align:right}
  hr{border:0;border-top:1px solid var(--line);margin:8px 0}
  h3{font-size:11px;color:var(--dim);margin:0 0 4px;text-transform:uppercase;letter-spacing:.06em}
  #log{max-height:120px;overflow-y:auto}
  #log div{white-space:pre;color:var(--dim)}
  #log div.cancel{color:var(--bad);font-weight:700}
  #log div.down{color:var(--accent)}
  #log div.native{color:var(--warn)}
  #hist div{padding:3px 0;border-bottom:1px solid var(--line);white-space:pre-wrap}
  #busy{color:var(--warn)}
  #zoomWarn{color:var(--bad);font-weight:700}
</style>
</head>
<body>

<div id="guide">
  <div id="gTop"><span id="gStep">—</span><span id="gCfg">—</span></div>
  <div id="gAction">—</div>
  <div id="gWhy">—</div>
  <div id="gProg"></div>
  <div id="gNav">
    <button class="btn" id="prevBtn">◀ prev</button>
    <button class="btn primary" id="nextBtn">next ▶</button>
    <input id="devLabel" placeholder="device">
  </div>
</div>

<div id="stage"><div id="scroller"></div></div>

<div id="panel">
  <div id="verdict">
    <div id="chips"></div>
    <div id="vNote">Follow the instruction. Verdict appears 800 ms after release.</div>
  </div>

  <h3>live <span id="busy"></span> <span id="zoomWarn"></span></h3>
  <div class="row"><span class="k">pointers down</span><span class="v" id="mPts">0</span></div>
  <div class="row"><span class="k">duration</span><span class="v" id="mDur">—</span></div>
  <div class="row"><span class="k">dx / dy</span><span class="v" id="mDelta">—</span></div>
  <div class="row"><span class="k">distance</span><span class="v" id="mDist">—</span></div>
  <div class="row"><span class="k">pinch scale</span><span class="v" id="mScale">—</span></div>
  <div class="row"><span class="k">page zoom</span><span class="v" id="mZoom">—</span></div>
  <div class="row"><span class="k">computed touch-action</span><span class="v" id="mTA">—</span></div>
  <div class="row"><span class="k">scroll during</span><span class="v" id="mSD">—</span></div>
  <div class="row"><span class="k">scroll after</span><span class="v" id="mST">—</span></div>
  <div class="row"><span class="k">axis verdict</span><span class="v" id="mAxis">—</span></div>
  <div class="row"><span class="k">contextmenu at</span><span class="v" id="mCtx">—</span></div>
  <div class="row"><span class="k">selected chars</span><span class="v" id="mSel">—</span></div>

  <hr><h3>event log</h3><div id="log"></div>
  <hr><h3>results <span id="hCount"></span></h3>
  <div style="display:flex;gap:6px;margin-bottom:6px">
    <button class="btn" id="copyBtn">copy all results</button>
    <button class="btn" id="undoBtn">undo last</button>
    <button class="btn" id="resetZoom">reset zoom</button>
    <button class="btn" id="clearBtn">clear</button>
  </div>
  <div id="hist"></div>
</div>

<script>
(function(){
'use strict';

/* ================= protocol ================= */
var STEPS = [
  /* ---- C8: LongPress vs Scroll ---- */
  {id:'C8', ta:'pan-y', sel:'auto', mode:'hold', reps:5,
   act:'항목을 움직이지 말고 1.5초 이상 꾹 누르세요',
   why:'C8 — 스크롤 컨테이너 안에서 롱프레스가 발동하는가'},
  {id:'C8', ta:'pan-y', sel:'auto', mode:'hold', reps:5,
   act:'리스트를 세게 튕긴 뒤, 굴러가는 중에 눌러서 1.5초 유지',
   why:'C8 — 관성 스크롤 중 롱프레스가 살아있는가'},
  {id:'C8', ta:'none', sel:'auto', mode:'hold', reps:5,
   act:'항목을 움직이지 말고 1.5초 이상 꾹 누르세요',
   why:'C8 — touch-action: none 에서는 다른가'},

  /* ---- C9: Drag vs Swipe ---- */
  {id:'C9', ta:'pan-y', sel:'none', mode:'axis', reps:5,
   act:'항목을 가로로 빠르게 튕기듯 미세요',
   why:'C9 — 빠른 가로 동작이 스와이프로 분류되는가'},
  {id:'C9', ta:'pan-y', sel:'none', mode:'axis', reps:5,
   act:'항목을 가로로 아주 천천히 미세요 (1초 이상)',
   why:'C9 — 느린 가로 동작이 드래그로 분류되는가'},
  {id:'C9', ta:'pan-y', sel:'none', mode:'axis', reps:5,
   act:'항목을 천천히 대각선으로 미세요',
   why:'C9 — 대각선에서 축 분류가 안정적인가'},

  /* ---- C11: Drag vs Pinch ---- */
  {id:'C11', ta:'none', sel:'none', mode:'pinch', reps:5,
   act:'한 손가락으로 드래그 시작 → 유지한 채 두 번째 손가락 추가',
   why:'C11 — 드래그 중 손가락이 늘면 어떻게 되는가'},
  {id:'C11', ta:'pan-y', sel:'none', mode:'pinch', reps:5,
   act:'같은 동작을 pan-y 에서 반복',
   why:'C11 — touch-action 값에 따라 다른가'},

  /* ---- C13: Scroll vs Pinch ---- */
  {id:'C13', ta:'pan-y', sel:'none', mode:'pinch', reps:5,
   act:'두 손가락으로 항목 위에서 벌리세요 (핀치 확대)',
   why:'C13 — pan-y 에서 핀치가 스크롤/확대와 경합하는가'},
  {id:'C13', ta:'none', sel:'none', mode:'pinch', reps:5,
   act:'같은 핀치를 none 에서 반복',
   why:'C13 — none 이 페이지 확대를 막는가'},
  {id:'C13', ta:'auto', sel:'none', mode:'pinch', reps:5,
   act:'같은 핀치를 auto 에서 반복',
   why:'C13 — 기본값에서 무엇이 일어나는가'}
];

var si=0, results=[], counts={}, TAIL=800;

var scroller=document.getElementById('scroller');
var logEl=document.getElementById('log');
var histEl=document.getElementById('hist');
var vv=window.visualViewport||null;

/* ---------- build list ---------- */
for(var i=1;i<=18;i++){
  if(i===5||i===11){
    var g=document.createElement('div');
    g.className='gapzone'; g.textContent='— scroll zone —';
    scroller.appendChild(g);
  }
  var d=document.createElement('div');
  d.className='item'; d.textContent='Item '+String(i).padStart(2,'0');
  scroller.appendChild(d);
}
var items=[].slice.call(scroller.querySelectorAll('.item'));

/* ---------- device ---------- */
var autoDev='detecting…';
(function detect(){
  var ua=navigator.userAgent, mtp=navigator.maxTouchPoints||0;
  var scr=screen.width+'×'+screen.height+'@'+(window.devicePixelRatio||1);
  var isIPad=/Macintosh/.test(ua)&&mtp>1, os, ver='', m;
  if(/iPhone|iPod/.test(ua)){os='iOS'; if((m=ua.match(/OS (\d+[_\d]*)/)))ver=m[1].replace(/_/g,'.');}
  else if(/iPad/.test(ua)||isIPad){os='iPadOS'; if((m=ua.match(/OS (\d+[_\d]*)/)))ver=m[1].replace(/_/g,'.');}
  else if(/Android/.test(ua)){os='Android'; if((m=ua.match(/Android (\d+(?:\.\d+)?)/)))ver=m[1];}
  else if(/Macintosh/.test(ua)){os='macOS';} else if(/Windows/.test(ua)){os='Windows';} else {os='other';}
  var br='?',bv='',b;
  if((b=ua.match(/CriOS\/(\d+)/))){br='Chrome-iOS';bv=b[1];}
  else if((b=ua.match(/Edg\/(\d+)/))){br='Edge';bv=b[1];}
  else if((b=ua.match(/Chrome\/(\d+)/))){br='Chrome';bv=b[1];}
  else if((b=ua.match(/Version\/(\d+\.\d+)[^ ]* Safari/))){br='Safari';bv=b[1];}
  else if(/Safari/.test(ua)){br='Safari';}
  function build(model){
    return [os+(ver?' '+ver:''),br+(bv?' '+bv:''),model||null,scr,'touch='+mtp]
           .filter(Boolean).join(' / ');
  }
  function done(s){autoDev=s;var el=document.getElementById('devLabel');
    if(!el.value)el.value=s; log('device: '+s);}
  if(navigator.userAgentData&&navigator.userAgentData.getHighEntropyValues){
    navigator.userAgentData.getHighEntropyValues(['platform','platformVersion','model'])
      .then(function(h){if(h.platform)os=h.platform;
        if(h.platformVersion)ver=String(h.platformVersion).replace(/(\.0)+$/,'');
        done(build(h.model||''));}).catch(function(){done(build(''));});
  } else { done(build(isIPad?'iPad (Mac-UA)':'')); }
})();

/* ---------- step control ---------- */
function applyStep(){
  var s=STEPS[si];
  items.forEach(function(el){
    el.style.touchAction=s.ta;
    el.style.userSelect=s.sel; el.style.webkitUserSelect=s.sel;
    el.style.webkitTouchCallout=s.sel==='none'?'none':'';
  });
  document.getElementById('gCfg').textContent=
    s.id+' · touch-action: '+s.ta+' · select: '+s.sel;
}
function renderStep(){
  var s=STEPS[si]; applyStep();
  document.getElementById('gStep').textContent='STEP '+(si+1)+' / '+STEPS.length;
  document.getElementById('gAction').textContent=s.act;
  document.getElementById('gWhy').textContent=s.why;
  var done=counts[si]||0,p=document.getElementById('gProg'); p.innerHTML='';
  for(var k=0;k<s.reps;k++){var d=document.createElement('div');
    d.className='dot'+(k<done?' done':''); p.appendChild(d);}
  var lbl=document.createElement('span'); lbl.style.color='var(--dim)'; lbl.style.marginLeft='4px';
  lbl.textContent=done+' / '+s.reps+(done>=s.reps?'  ✓ 완료 — next':'');
  p.appendChild(lbl);
  document.getElementById('prevBtn').disabled=si===0;
  document.getElementById('nextBtn').disabled=si===STEPS.length-1;
  log('--- STEP '+(si+1)+'  '+s.id+'  ta='+s.ta+' sel='+s.sel+' ---');
}
document.getElementById('nextBtn').onclick=function(){if(si<STEPS.length-1){si++;renderStep();}};
document.getElementById('prevBtn').onclick=function(){if(si>0){si--;renderStep();}};

/* ---------- logging ---------- */
var t0=0;
function log(m,c){var d=document.createElement('div');d.textContent=m;if(c)d.className=c;
  logEl.appendChild(d);logEl.scrollTop=logEl.scrollHeight;
  while(logEl.childNodes.length>140)logEl.removeChild(logEl.firstChild);}
function rel(){return String(Math.round(performance.now()-t0)).padStart(5,' ');}
function set(id,v){document.getElementById(id).textContent=v;}

/* ---------- page zoom ---------- */
function zoomNow(){ return vv? +(vv.scale).toFixed(3) : 1; }
if(vv){
  vv.addEventListener('resize',function(){
    set('mZoom', zoomNow().toFixed(3));
    if(G&&Math.abs(zoomNow()-G.zoom0)>0.02){
      G.zoomed=true; log(rel()+' PAGE ZOOM  scale='+zoomNow(),'native');
    }
    document.getElementById('zoomWarn').textContent =
      Math.abs(zoomNow()-1)>0.02 ? 'page zoomed — reset before next trial' : '';
  });
}
document.getElementById('resetZoom').onclick=function(){
  window.scrollTo(0,0);
  alert('페이지를 두 손가락으로 축소하거나 새로고침해 배율을 1.0으로 되돌리세요.\n현재 scale = '+zoomNow());
};

/* ---------- scroll observation ---------- */
var scrollStart=0, scrollDuring=0, scrollTotal=0, watching=false, phase='idle';
scroller.addEventListener('scroll',function(){
  if(!watching)return;
  var d=scroller.scrollTop-scrollStart;
  if(Math.abs(d)>Math.abs(scrollTotal))scrollTotal=d;
  if(phase==='gesture'){scrollDuring=scrollTotal;set('mSD',scrollDuring.toFixed(0)+'px');}
  else set('mST',(scrollTotal-scrollDuring).toFixed(0)+'px');
},{passive:true});

/* inertial scroll detector: scroll with no pointer down */
var inertial=false;
scroller.addEventListener('scroll',function(){
  if(pts.size===0 && watching && phase==='gesture') inertial=true;
},{passive:true});

/* ---------- gesture ---------- */
var G=null, pts=new Map(), pending=null, tailTimer=null;

items.forEach(function(el){ el.addEventListener('pointerdown', onDown); });

function dist2(){
  if(pts.size<2) return 0;
  var a=[]; pts.forEach(function(p){a.push(p);});
  return Math.hypot(a[0].x-a[1].x, a[0].y-a[1].y);
}

function onDown(e){
  pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  set('mPts',String(pts.size));

  if(G){                                   // second finger on an active gesture
    if(pts.size===2){
      G.base=dist2(); G.multi=true;
      log(rel()+' SECOND POINTER  base='+G.base.toFixed(0)+'px','native');
    }
    return;
  }
  if(pending){ settle(pending); }
  if(tailTimer){ clearTimeout(tailTimer); tailTimer=null; }

  t0=performance.now(); logEl.innerHTML='';
  scrollStart=scroller.scrollTop; scrollDuring=0; scrollTotal=0;
  watching=true; phase='gesture'; inertial=false;
  try{ window.getSelection().removeAllRanges(); }catch(err){}

  G={el:e.currentTarget,id:e.pointerId,x0:e.clientX,y0:e.clientY,
     dx:0,dy:0,max:0,moves:0,drag:false,multi:false,base:0,scale:1,
     minScale:1,maxScale:1,cancelled:false,ctxAt:null,selChars:0,
     zoom0:zoomNow(),zoomed:false,start:performance.now(),step:si,
     axis:null,ta:STEPS[si].ta,sel:STEPS[si].sel};

  set('mTA',getComputedStyle(G.el).touchAction);
  set('mDur','—');set('mDelta','—');set('mDist','—');set('mScale','1.000');
  set('mZoom',G.zoom0.toFixed(3));set('mSD','0px');set('mST','—');
  set('mAxis','—');set('mCtx','—');set('mSel','—');
  document.getElementById('busy').textContent='';
  renderChips(null);
  document.getElementById('vNote').textContent='… in progress';
  log(rel()+' pointerdown   ta='+getComputedStyle(G.el).touchAction,'down');

  window.addEventListener('pointermove',onMove);
  window.addEventListener('pointerup',onUp);
  window.addEventListener('pointercancel',onCancel);
}

function onMove(e){
  if(!G) return;
  if(pts.has(e.pointerId)) pts.set(e.pointerId,{x:e.clientX,y:e.clientY});

  if(G.multi && pts.size>=2 && G.base>0){
    G.scale=dist2()/G.base;
    if(G.scale<G.minScale)G.minScale=G.scale;
    if(G.scale>G.maxScale)G.maxScale=G.scale;
    set('mScale',G.scale.toFixed(3));
  }
  if(e.pointerId!==G.id) return;

  G.moves++; G.dx=e.clientX-G.x0; G.dy=e.clientY-G.y0;
  var d=Math.hypot(G.dx,G.dy); if(d>G.max)G.max=d;
  set('mDur',Math.round(performance.now()-G.start)+'ms');
  set('mDelta',G.dx.toFixed(0)+' / '+G.dy.toFixed(0));
  set('mDist',d.toFixed(1)+'px');

  if(!G.drag && d>=8){
    G.drag=true; G.el.classList.add('active');
    G.axis = Math.abs(G.dx)>Math.abs(G.dy) ? 'horizontal' : 'vertical';
    set('mAxis',G.axis+' @ '+d.toFixed(1)+'px');
    log(rel()+' DRAG ACTIVE   axis='+G.axis+' d='+d.toFixed(1)+'px');
  }
  if(G.drag && !G.multi){
    G.el.style.transform='translate('+G.dx+'px,'+G.dy+'px)';
    /* axis reclassification check */
    var nowAxis = Math.abs(G.dx)>Math.abs(G.dy)?'horizontal':'vertical';
    if(G.axis && nowAxis!==G.axis){
      log(rel()+' AXIS FLIP     '+G.axis+' → '+nowAxis,'native');
      G.axisFlip=true; G.axis=nowAxis; set('mAxis',nowAxis+' (flipped)');
      G.el.classList.add('swipe');
    }
  }
  if(G.moves<=5||G.moves%15===0)
    log(rel()+' pointermove   d='+d.toFixed(1)+'px'+(G.multi?' scale='+G.scale.toFixed(2):''));
}

function onUp(e){
  pts.delete(e.pointerId); set('mPts',String(pts.size));
  if(!G) return;
  if(e.pointerId!==G.id && pts.size>0) return;
  log(rel()+' pointerup');
  if(pts.size===0) finish();
}
function onCancel(e){
  pts.delete(e.pointerId); set('mPts',String(pts.size));
  if(!G) return;
  G.cancelled=true;
  log(rel()+' POINTERCANCEL','cancel');
  if(pts.size===0) finish();
}

items.forEach(function(el){
  el.addEventListener('contextmenu',function(){
    var g=G||pending; if(!g)return;
    g.ctxAt=Math.round(performance.now()-g.start);
    set('mCtx',g.ctxAt+'ms'); log(rel()+' contextmenu','native');
  });
});
document.addEventListener('selectstart',function(){
  var g=G||pending; if(!g)return; g.selStarted=true; log(rel()+' selectstart','native');
});

function finish(){
  pending=G; G=null; phase='tail';
  pending.endAt=performance.now();
  window.removeEventListener('pointermove',onMove);
  window.removeEventListener('pointerup',onUp);
  window.removeEventListener('pointercancel',onCancel);
  document.getElementById('busy').textContent='measuring '+TAIL+'ms…';
  var el=pending.el;
  setTimeout(function(){el.style.transform='';el.classList.remove('active','swipe');},420);
  tailTimer=setTimeout(function(){settle(pending);},TAIL);
}

function renderChips(g){
  var box=document.getElementById('chips'); box.innerHTML='';
  var defs=[['drag','drag'],['multi','2 pointers'],['pinched','pinch'],
            ['scrolled','scroll'],['ctx','contextmenu'],['selStarted','selection'],
            ['zoomed','page zoom'],['cancelled','pointercancel'],['axisFlip','axis flip']];
  defs.forEach(function(d){
    var c=document.createElement('span'); c.className='chip'; c.textContent=d[1];
    if(g&&g[d[0]]) c.className='chip '+
      (d[0]==='cancelled'||d[0]==='zoomed'?'bad':d[0]==='axisFlip'?'warn':'hit');
    box.appendChild(c);
  });
}

function settle(g){
  if(!g) return;
  if(tailTimer){clearTimeout(tailTimer);tailTimer=null;}
  if(pending===g) pending=null;
  watching=false; phase='idle';
  document.getElementById('busy').textContent='';

  try{ g.selChars=(window.getSelection().toString()||'').length; }catch(e){ g.selChars=0; }
  set('mSel',g.selChars+' chars');
  if(Math.abs(zoomNow()-g.zoom0)>0.02) g.zoomed=true;
  var tail=scrollTotal-scrollDuring;
  g.scrolled = Math.abs(scrollDuring)>=2 || Math.abs(tail)>=2;
  g.pinched  = g.multi && (g.maxScale>1.05 || g.minScale<0.95);
  g.ctx      = g.ctxAt!==null;
  renderChips(g);

  var dur=Math.round(g.endAt-g.start);
  var dist=Math.hypot(g.dx,g.dy);
  var fired=[];
  if(g.drag)fired.push('drag'); if(g.multi)fired.push('2ptr');
  if(g.pinched)fired.push('pinch'); if(g.scrolled)fired.push('scroll');
  if(g.ctx)fired.push('contextmenu'); if(g.selStarted)fired.push('selection');
  if(g.zoomed)fired.push('PAGEZOOM'); if(g.cancelled)fired.push('pointercancel');
  if(g.axisFlip)fired.push('axisflip');
  var fs=fired.length?fired.join(' + '):'(none)';

  document.getElementById('vNote').textContent=
    fs+'  ·  dist='+dist.toFixed(1)+'px dur='+dur+'ms scale='+
    g.minScale.toFixed(2)+'–'+g.maxScale.toFixed(2);

  var r={step:g.step+1,id:STEPS[g.step].id,ta:g.ta,sel:g.sel,fired:fs,
         dist:dist.toFixed(1),max:g.max.toFixed(1),dur:dur,axis:g.axis||'-',
         sd:scrollDuring.toFixed(0),st:tail.toFixed(0),
         smin:g.minScale.toFixed(3),smax:g.maxScale.toFixed(3),
         zoom0:g.zoom0.toFixed(3),zoom1:zoomNow().toFixed(3),
         ctxAt:g.ctxAt,selChars:g.selChars,moves:g.moves};
  results.push(r); counts[g.step]=(counts[g.step]||0)+1;

  var line=document.createElement('div');
  line.textContent='S'+r.step+' ['+r.id+'] ta='+r.ta+'\n  → '+fs+
    '\n  dist='+r.dist+'px dur='+r.dur+'ms axis='+r.axis+
    ' scale='+r.smin+'–'+r.smax+'\n  scroll '+r.sd+'/'+r.st+'px zoom '+
    r.zoom0+'→'+r.zoom1+(r.ctxAt!==null?' ctxAt='+r.ctxAt+'ms':'');
  histEl.insertBefore(line,histEl.firstChild);
  document.getElementById('hCount').textContent='('+results.length+')';
  if(g.step===si) renderStep();
}

/* ---------- io ---------- */
document.getElementById('undoBtn').onclick=function(){
  var r=results.pop(); if(!r)return;
  counts[r.step-1]=Math.max(0,(counts[r.step-1]||1)-1);
  if(histEl.firstChild)histEl.removeChild(histEl.firstChild);
  document.getElementById('hCount').textContent='('+results.length+')'; renderStep();
};
document.getElementById('clearBtn').onclick=function(){
  results=[];counts={};histEl.innerHTML='';logEl.innerHTML='';
  document.getElementById('hCount').textContent='';renderStep();
};
document.getElementById('copyBtn').onclick=function(){
  var dev=document.getElementById('devLabel').value.trim()||autoDev;
  var t='# C8 / C9 / C11 / C13 verification\ndevice: '+dev+'\nua-detect: '+autoDev+
        '\n'+new Date().toISOString()+'\n';
  STEPS.forEach(function(s,idx){
    var rs=results.filter(function(r){return r.step===idx+1;});
    t+='\n## STEP '+(idx+1)+'  ['+s.id+']  ta='+s.ta+' sel='+s.sel+
       '  ('+rs.length+'/'+s.reps+')\n   action: '+s.act+'\n';
    rs.forEach(function(r,j){
      t+='   '+(j+1)+'. '+r.fired+'\n'+
         '      dist='+r.dist+'px max='+r.max+'px dur='+r.dur+'ms axis='+r.axis+'\n'+
         '      scale='+r.smin+'–'+r.smax+' zoom='+r.zoom0+'→'+r.zoom1+
         ' scroll during='+r.sd+'px after='+r.st+'px'+
         (r.ctxAt!==null?' ctxAt='+r.ctxAt+'ms':'')+
         ' selChars='+r.selChars+' moves='+r.moves+'\n';
    });
    if(!rs.length)t+='   (no trials)\n';
  });
  var ta=document.createElement('textarea');ta.value=t;
  document.body.appendChild(ta);ta.select();
  try{document.execCommand('copy');}catch(e){}
  document.body.removeChild(ta);
  var b=this,o=b.textContent;b.textContent='copied';
  setTimeout(function(){b.textContent=o;},1200);
};

renderChips(null);
renderStep();
log('ready');
if(vv) set('mZoom',zoomNow().toFixed(3));
})();
</script>
</body>
