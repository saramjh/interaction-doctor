<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>내 재생목록</title>
<style>
	* { box-sizing: border-box; }
	html, body {
		margin: 0;
		height: 100%;
		font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
		background: #0f0f13;
		color: #eee;
	}
	header {
		padding: 16px;
		font-size: 18px;
		font-weight: 700;
		border-bottom: 1px solid #26262e;
	}
	#playlist {
		overflow-y: auto;
		height: calc(100% - 56px);
		padding: 8px;
	}
	.track {
		display: flex;
		align-items: center;
		gap: 12px;
		padding: 12px;
		margin-bottom: 6px;
		background: #1b1b22;
		border-radius: 10px;
		user-select: none;
		position: relative;
	}
	.track.dragging {
		background: #2a2a36;
		z-index: 10;
	}
	.cover {
		width: 44px;
		height: 44px;
		border-radius: 6px;
		background: linear-gradient(135deg, #6a5acd, #ff6b9a);
		flex-shrink: 0;
	}
	.meta { flex: 1; min-width: 0; }
	.title { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
	.artist { font-size: 12px; color: #9a9aa5; }
	.duration { font-size: 12px; color: #9a9aa5; }
</style>
</head>
<body>
<header>내 재생목록 · 24곡</header>
<div id="playlist"></div>

<script>
// 재생목록 순서를 손가락으로 눌러서 드래그하면 바꿀 수 있어야 한다.
// (핸들 아이콘 없음 — 항목 전체가 드래그 타겟)

const TRACKS = [
	["Midnight City", "M83", "4:03"],
	["Take On Me", "a-ha", "3:46"],
	["Circles", "Post Malone", "3:35"],
	["Blinding Lights", "The Weeknd", "3:20"],
	["Levitating", "Dua Lipa", "3:23"],
	["As It Was", "Harry Styles", "2:47"],
	["Heat Waves", "Glass Animals", "3:58"],
	["Stay", "The Kid LAROI", "2:21"],
	["good 4 u", "Olivia Rodrigo", "2:58"],
	["Watermelon Sugar", "Harry Styles", "2:54"],
];

const listEl = document.getElementById("playlist");

function render() {
	listEl.innerHTML = "";
	TRACKS.forEach((t, i) => {
		const row = document.createElement("div");
		row.className = "track";
		row.dataset.index = String(i);
		row.innerHTML =
			'<div class="cover"></div>' +
			'<div class="meta"><div class="title">' + t[0] + '</div><div class="artist">' + t[1] + '</div></div>' +
			'<div class="duration">' + t[2] + '</div>';
		listEl.appendChild(row);
		attachDrag(row);
	});
}

// 드래그 구현: 항목을 누른 채로 옮기면 그 위치로 순서가 바뀐다.
function attachDrag(row) {
	let startY = 0;
	let startX = 0;
	let dragTimer = null;
	let isDragging = false;
	let isLongPressed = false;
	let pointerId = null;

	row.addEventListener("pointerdown", (e) => {
		startY = e.clientY;
		startX = e.clientX;
		pointerId = e.pointerId;
		isDragging = false;
		isLongPressed = false;

		const isTouch = e.pointerType === "touch";
		const delay = isTouch ? 400 : 0; // 터치 시 400ms 롱프레스 대기, 마우스 시 즉시

		if (isTouch) {
			dragTimer = setTimeout(() => {
				isLongPressed = true;
				isDragging = true;
				row.classList.add("dragging");
				row.style.touchAction = "none";
				
				if (navigator.vibrate) {
					navigator.vibrate(50);
				}
				
				try {
					row.setPointerCapture(pointerId);
				} catch (err) {
					console.error("Pointer capture failed:", err);
				}
			}, delay);
		} else {
			isDragging = true;
			row.classList.add("dragging");
			row.style.touchAction = "none";
			try {
				row.setPointerCapture(pointerId);
			} catch (err) {
				console.error("Pointer capture failed:", err);
			}
		}
	});

	row.addEventListener("pointermove", (e) => {
		if (e.pointerId !== pointerId) return;

		const dx = e.clientX - startX;
		const dy = e.clientY - startY;

		// 터치 시 롱프레스 발동 전 8px 이상 움직이면 롱프레스 및 드래그 취소 (스크롤 허용)
		if (e.pointerType === "touch" && !isLongPressed) {
			if (Math.hypot(dx, dy) > 8) {
				clearTimeout(dragTimer);
			}
			return;
		}

		if (!isDragging) return;

		row.style.transform = "translateY(" + dy + "px)";
	});

	const handleDragEnd = (e) => {
		if (e.pointerId !== pointerId) return;
		
		clearTimeout(dragTimer);

		if (isDragging) {
			row.classList.remove("dragging");
			row.style.transform = "";
			row.style.touchAction = "";

			const dy = e.clientY - startY;
			const idx = Number(row.dataset.index);
			const rowHeight = row.getBoundingClientRect().height + 6;
			const shift = Math.round(dy / rowHeight);
			const newIdx = Math.min(TRACKS.length - 1, Math.max(0, idx + shift));
			if (newIdx !== idx) {
				const [moved] = TRACKS.splice(idx, 1);
				TRACKS.splice(newIdx, 0, moved);
				render();
			}
			
			try {
				row.releasePointerCapture(pointerId);
			} catch (err) {}
		}

		isDragging = false;
		isLongPressed = false;
		pointerId = null;
	};

	row.addEventListener("pointerup", handleDragEnd);
	row.addEventListener("pointercancel", handleDragEnd);
}

render();
</script>
</body>
</html>
