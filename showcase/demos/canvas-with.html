<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Canvas 2D Editor (With Skill - Optimized Centroid)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, sans-serif; background: #090d16; color: #fff; height: 100vh; overflow: hidden; display: flex; flex-direction: column; touch-action: none; }
    .header { padding: 12px 16px; background: #131b2e; border-bottom: 1px solid #1e293b; display: flex; justify-content: space-between; font-size: 13px; font-weight: 700; }
    .canvas-stage { flex: 1; position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; background: radial-gradient(#1e293b 1px, transparent 1px); background-size: 20px 20px; }
    
    .artboard {
      width: 220px; height: 220px; background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      border-radius: 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.5);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      color: #fff; font-weight: 800; font-size: 15px; text-align: center; gap: 8px;
      user-select: none;
      transform: translate(var(--tx, 0px), var(--ty, 0px)) scale(var(--scale, 1)) rotate(var(--rotate, 0deg));
      transform-origin: center center;
    }
    .hint-pill { position: absolute; bottom: 20px; background: rgba(16, 185, 129, 0.2); border: 1px solid #10b981; color: #34d399; font-size: 12px; font-weight: 700; padding: 6px 14px; border-radius: 20px; }
  </style>
</head>
<body>
  <div class="header">
    <span>🎨 Figma/Canva Style Canvas</span>
    <span style="color: #10b981;">✅ 0ms Centroid Invariant</span>
  </div>
  <div class="canvas-stage" id="stage">
    <div class="artboard" id="artboard">
      <div>🖼️ Graphic Layer</div>
      <div style="font-size: 11px; opacity: 0.8;">Pinch & 2-Finger Rotate</div>
    </div>
    <div class="hint-pill">Pinch with 2 fingers or drag to manipulate</div>
  </div>

  <script>
    const stage = document.getElementById('stage');
    const artboard = document.getElementById('artboard');
    const pointers = new Map();

    let tx = 0, ty = 0, scale = 1, rotate = 0;
    let initialDist = 0, initialAngle = 0, initialScale = 1, initialRotate = 0;
    let startX = 0, startY = 0;

    stage.addEventListener('pointerdown', (e) => {
      stage.setPointerCapture(e.pointerId);
      pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
      if (pointers.size === 1) {
        startX = e.clientX - tx;
        startY = e.clientY - ty;
      } else if (pointers.size === 2) {
        const [p1, p2] = Array.from(pointers.values());
        initialDist = Math.hypot(p2.x - p1.x, p2.y - p1.y);
        initialAngle = Math.atan2(p2.y - p1.y, p2.x - p1.x) * (180 / Math.PI);
        initialScale = scale;
        initialRotate = rotate;
      }
    });

    stage.addEventListener('pointermove', (e) => {
      if (!pointers.has(e.pointerId)) return;
      pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

      if (pointers.size === 1) {
        tx = e.clientX - startX;
        ty = e.clientY - startY;
        artboard.style.setProperty('--tx', `${tx}px`);
        artboard.style.setProperty('--ty', `${ty}px`);
      } else if (pointers.size === 2) {
        const [p1, p2] = Array.from(pointers.values());
        const currentDist = Math.hypot(p2.x - p1.x, p2.y - p1.y);
        const currentAngle = Math.atan2(p2.y - p1.y, p2.x - p1.x) * (180 / Math.PI);
        
        scale = initialScale * (currentDist / (initialDist || 1));
        rotate = initialRotate + (currentAngle - initialAngle);

        artboard.style.setProperty('--scale', scale);
        artboard.style.setProperty('--rotate', `${rotate}deg`);
      }
    });

    const removePointer = (e) => {
      pointers.delete(e.pointerId);
    };
    stage.addEventListener('pointerup', removePointer);
    stage.addEventListener('pointercancel', removePointer);
  </script>
</body>
</html>
