<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <!-- 모바일 키보드 대응: interactive-widget=resizes-content -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content">
  <title>당근 1:1 채팅</title>
  <style>
    :root {
      --primary-color: #ff6f0f;
      --primary-hover: #e85f00;
      --bg-color: #f7f8fa;
      --bubble-other: #ffffff;
      --bubble-me: #ff6f0f;
      --bubble-me-text: #ffffff;
      --text-main: #212529;
      --text-sub: #868e96;
      --border-color: #eceef0;
      --app-height: 100dvh;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", Roboto, sans-serif;
      background-color: #1e1f21;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
    }

    /* 모바일 뷰 컨테이너 */
    .chat-app {
      width: 100%;
      max-width: 440px;
      height: 100%;
      height: var(--app-height, 100dvh);
      background-color: var(--bg-color);
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      box-shadow: 0 0 24px rgba(0, 0, 0, 0.25);
    }

    /* 1. 상단 네비게이션 헤더 */
    .chat-header {
      flex-shrink: 0;
      height: 56px;
      background: #ffffff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      border-bottom: 1px solid var(--border-color);
      z-index: 10;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .icon-btn {
      background: none;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 6px;
      color: #333;
      border-radius: 50%;
    }

    .icon-btn:active {
      background-color: rgba(0, 0, 0, 0.05);
    }

    .user-info {
      display: flex;
      flex-direction: column;
    }

    .user-name {
      font-size: 16px;
      font-weight: 700;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .user-temp {
      font-size: 11px;
      font-weight: 600;
      color: var(--primary-color);
      background: #fff0e6;
      padding: 1px 6px;
      border-radius: 10px;
    }

    .user-status {
      font-size: 11px;
      color: var(--text-sub);
    }

    /* 상품 요약 바 */
    .product-bar {
      flex-shrink: 0;
      background: #ffffff;
      padding: 8px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border-color);
      font-size: 13px;
    }

    .product-info {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .product-thumb {
      width: 36px;
      height: 36px;
      border-radius: 6px;
      background-color: #f1f3f5;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }

    .product-details .product-title {
      font-weight: 600;
      color: var(--text-main);
    }

    .product-details .product-price {
      font-weight: 700;
      color: var(--text-main);
    }

    /* 2. 대화 메시지 영역 */
    .chat-messages {
      flex: 1;
      overflow-y: auto;
      overscroll-behavior: contain;
      -webkit-overflow-scrolling: touch;
      padding: 16px 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .date-divider {
      align-self: center;
      background-color: rgba(0, 0, 0, 0.05);
      color: var(--text-sub);
      font-size: 11px;
      padding: 4px 12px;
      border-radius: 12px;
      margin: 4px 0;
    }

    .message-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
      max-width: 78%;
    }

    .message-group.other {
      align-self: flex-start;
    }

    .message-group.me {
      align-self: flex-end;
    }

    .message-row {
      display: flex;
      align-items: flex-end;
      gap: 6px;
    }

    .message-group.me .message-row {
      flex-direction: row-reverse;
    }

    .avatar {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background-color: #e9ecef;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      align-self: flex-start;
      margin-right: 2px;
      flex-shrink: 0;
    }

    .bubble-wrapper {
      position: relative;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
    }

    .bubble {
      padding: 10px 14px;
      border-radius: 18px;
      font-size: 14px;
      line-height: 1.45;
      word-break: break-word;
      white-space: pre-wrap;
      position: relative;
      transition: transform 0.1s ease, filter 0.15s ease;
    }

    .message-group.other .bubble {
      background-color: var(--bubble-other);
      color: var(--text-main);
      border-top-left-radius: 4px;
      border: 1px solid var(--border-color);
    }

    .message-group.me .bubble {
      background-color: var(--bubble-me);
      color: var(--bubble-me-text);
      border-top-right-radius: 4px;
    }

    .bubble.image-bubble {
      padding: 4px;
      overflow: hidden;
      max-width: 220px;
    }

    .bubble.image-bubble img {
      width: 100%;
      height: auto;
      border-radius: 14px;
      display: block;
    }

    .bubble:active {
      transform: scale(0.98);
      filter: brightness(0.95);
    }

    .meta-info {
      display: flex;
      flex-direction: column;
      font-size: 10px;
      color: var(--text-sub);
      gap: 2px;
      flex-shrink: 0;
    }

    .message-group.me .meta-info {
      text-align: right;
    }

    .unread-count {
      color: var(--primary-color);
      font-weight: 700;
    }

    /* 3. 하단 입력바 */
    .chat-input-bar {
      flex-shrink: 0;
      background: #ffffff;
      border-top: 1px solid var(--border-color);
      padding: 8px 10px;
      display: flex;
      align-items: flex-end;
      gap: 6px;
      z-index: 10;
    }

    .input-actions {
      display: flex;
      align-items: center;
      gap: 2px;
    }

    .input-wrapper {
      flex: 1;
      background: #f1f3f5;
      border-radius: 20px;
      display: flex;
      align-items: center;
      padding: 6px 12px;
      min-height: 38px;
    }

    .input-field {
      width: 100%;
      max-height: 90px;
      border: none;
      background: transparent;
      outline: none;
      font-size: 14px;
      font-family: inherit;
      resize: none;
      line-height: 1.4;
      color: var(--text-main);
    }

    .input-field::placeholder {
      color: #adb5bd;
    }

    .send-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: none;
      background-color: #dee2e6;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: not-allowed;
      transition: background-color 0.2s, transform 0.1s;
      flex-shrink: 0;
    }

    .send-btn.active {
      background-color: var(--primary-color);
      cursor: pointer;
    }

    .send-btn.active:active {
      transform: scale(0.92);
      background-color: var(--primary-hover);
    }

    /* 이모티콘 서랍장 */
    .emoji-drawer {
      display: none;
      background: #ffffff;
      border-top: 1px solid var(--border-color);
      padding: 12px 14px;
      grid-template-columns: repeat(6, 1fr);
      gap: 10px;
      max-height: 160px;
      overflow-y: auto;
    }

    .emoji-drawer.open {
      display: grid;
    }

    .emoji-item {
      font-size: 24px;
      text-align: center;
      cursor: pointer;
      user-select: none;
      padding: 4px;
      border-radius: 8px;
    }

    .emoji-item:active {
      background: #f1f3f5;
    }

    /* 4. 롱프레스 컨텍스트 메뉴 & 오버레이 */
    .context-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.35);
      z-index: 100;
      display: none;
      opacity: 0;
      transition: opacity 0.2s ease;
    }

    .context-overlay.active {
      display: block;
      opacity: 1;
    }

    .context-menu {
      position: absolute;
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
      display: flex;
      overflow: hidden;
      z-index: 101;
      transform: scale(0.9);
      opacity: 0;
      transition: transform 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.15s;
    }

    .context-menu.show {
      transform: scale(1);
      opacity: 1;
    }

    .context-btn {
      border: none;
      background: none;
      padding: 10px 16px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }

    .context-btn:active {
      background: #f8f9fa;
    }

    .context-btn.delete {
      color: #e03131;
    }

    .context-divider {
      width: 1px;
      background: var(--border-color);
    }

    /* 5. 복사 완료 토스트 알림 */
    .toast {
      position: absolute;
      top: 70px;
      left: 50%;
      transform: translateX(-50%) translateY(-10px);
      background: rgba(33, 37, 41, 0.88);
      color: #fff;
      font-size: 13px;
      padding: 8px 16px;
      border-radius: 20px;
      pointer-events: none;
      opacity: 0;
      transition: all 0.25s ease;
      z-index: 200;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }
  </style>
</head>
<body>

  <div class="chat-app" id="chatApp">
    <!-- 헤더 -->
    <header class="chat-header">
      <div class="header-left">
        <button class="icon-btn" aria-label="뒤로가기">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="15 18 9 12 15 6"></polyline>
          </svg>
        </button>
        <div class="user-info">
          <div class="user-name">
            도토리이웃 <span class="user-temp">37.2°C</span>
          </div>
          <span class="user-status">보통 10분 이내 응답</span>
        </div>
      </div>
      <div class="header-right">
        <button class="icon-btn" aria-label="메뉴">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="1"></circle>
            <circle cx="12" cy="5" r="1"></circle>
            <circle cx="12" cy="19" r="1"></circle>
          </svg>
        </button>
      </div>
    </header>

    <!-- 판매 물품 정보 바 -->
    <div class="product-bar">
      <div class="product-info">
        <div class="product-thumb">🍎</div>
        <div class="product-details">
          <div class="product-title">아이패드 에어 5세대 64GB 스페이스 그레이</div>
          <div class="product-price">580,000원</div>
        </div>
      </div>
    </div>

    <!-- 대화 메시지 영역 -->
    <div class="chat-messages" id="chatMessages">
      <div class="date-divider">2026년 9월 1일</div>

      <!-- 상대방 메시지 -->
      <div class="message-group other" data-id="msg-1">
        <div class="message-row">
          <div class="avatar">🥕</div>
          <div class="bubble-wrapper">
            <div class="bubble">안녕하세요! 아이패드 혹시 네고 가능한가요? 직접 가지러 갈 수 있습니다 :)</div>
          </div>
          <div class="meta-info">
            <span class="timestamp">오후 12:20</span>
          </div>
        </div>
      </div>

      <!-- 내 메시지 -->
      <div class="message-group me" data-id="msg-2">
        <div class="message-row">
          <div class="bubble-wrapper">
            <div class="bubble">안녕하세요! 상태가 거의 새 제품이라 57만원까지는 맞춰드릴 수 있어요!</div>
          </div>
          <div class="meta-info">
            <span class="unread-count">1</span>
            <span class="timestamp">오후 12:22</span>
          </div>
        </div>
      </div>
    </div>

    <!-- 이모티콘 피커 -->
    <div class="emoji-drawer" id="emojiDrawer">
      <div class="emoji-item">😀</div>
      <div class="emoji-item">😂</div>
      <div class="emoji-item">🥰</div>
      <div class="emoji-item">🥕</div>
      <div class="emoji-item">👍</div>
      <div class="emoji-item">🔥</div>
      <div class="emoji-item">🙏</div>
      <div class="emoji-item">🥺</div>
      <div class="emoji-item">🎉</div>
      <div class="emoji-item">❤️</div>
      <div class="emoji-item">🙌</div>
      <div class="emoji-item">🤝</div>
    </div>

    <!-- 하단 입력바 -->
    <div class="chat-input-bar">
      <div class="input-actions">
        <!-- 사진 첨부 버튼 -->
        <input type="file" id="fileInput" accept="image/*" style="display:none;">
        <button class="icon-btn" id="photoBtn" aria-label="사진 전송">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
            <circle cx="8.5" cy="8.5" r="1.5"></circle>
            <polyline points="21 15 16 10 5 21"></polyline>
          </svg>
        </button>
        <!-- 이모티콘 토글 버튼 -->
        <button class="icon-btn" id="emojiBtn" aria-label="이모티콘">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <path d="M8 14s1.5 2 4 2 4-2 4-2"></path>
            <line x1="9" y1="9" x2="9.01" y2="9"></line>
            <line x1="15" y1="9" x2="15.01" y2="9"></line>
          </svg>
        </button>
      </div>

      <div class="input-wrapper">
        <textarea 
          class="input-field" 
          id="messageInput" 
          placeholder="메시지를 입력하세요..." 
          rows="1"
        ></textarea>
      </div>

      <button class="send-btn" id="sendBtn" aria-label="전송">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"></line>
          <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
        </svg>
      </button>
    </div>

    <!-- 롱프레스 컨텍스트 메뉴 및 백드롭 -->
    <div class="context-overlay" id="contextOverlay"></div>
    <div class="context-menu" id="contextMenu">
      <button class="context-btn" id="copyBtn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
          <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
        </svg>
        복사
      </button>
      <div class="context-divider"></div>
      <button class="context-btn delete" id="deleteBtn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="3 6 5 6 21 6"></polyline>
          <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
        </svg>
        삭제
      </button>
    </div>

    <!-- 토스트 메시지 -->
    <div class="toast" id="toast">메시지가 복사되었습니다.</div>
  </div>

  <script>
    // --- 1. 모바일 가상 키보드 높이 동기화 (VisualViewport 대응) ---
    const chatApp = document.getElementById('chatApp');
    const chatMessages = document.getElementById('chatMessages');
    const messageInput = document.getElementById('messageInput');
    const sendBtn = document.getElementById('sendBtn');
    const emojiBtn = document.getElementById('emojiBtn');
    const emojiDrawer = document.getElementById('emojiDrawer');
    const photoBtn = document.getElementById('photoBtn');
    const fileInput = document.getElementById('fileInput');
    const contextOverlay = document.getElementById('contextOverlay');
    const contextMenu = document.getElementById('contextMenu');
    const copyBtn = document.getElementById('copyBtn');
    const deleteBtn = document.getElementById('deleteBtn');
    const toast = document.getElementById('toast');

    function syncViewportHeight() {
      if (window.visualViewport) {
        const currentHeight = window.visualViewport.height;
        document.documentElement.style.setProperty('--app-height', `${currentHeight}px`);
      } else {
        document.documentElement.style.setProperty('--app-height', `${window.innerHeight}px`);
      }
      scrollToBottom(false);
    }

    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', syncViewportHeight);
      window.visualViewport.addEventListener('scroll', syncViewportHeight);
    } else {
      window.addEventListener('resize', syncViewportHeight);
    }

    function scrollToBottom(smooth = true) {
      chatMessages.scrollTo({
        top: chatMessages.scrollHeight,
        behavior: smooth ? 'smooth' : 'auto'
      });
    }

    // 입력창 포커스 시 부드럽게 스크롤
    messageInput.addEventListener('focus', () => {
      emojiDrawer.classList.remove('open');
      setTimeout(() => scrollToBottom(true), 300);
    });

    // --- 2. 텍스트 입력창 자동 높이 조절 & 전송 활성화 ---
    messageInput.addEventListener('input', () => {
      messageInput.style.height = 'auto';
      messageInput.style.height = Math.min(messageInput.scrollHeight, 90) + 'px';
      
      const hasText = messageInput.value.trim().length > 0;
      sendBtn.classList.toggle('active', hasText);
    });

    // 엔터키 전송 처리 (Shift+Enter는 줄바꿈)
    messageInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    sendBtn.addEventListener('click', sendMessage);

    function getCurrentTimeStr() {
      const now = new Date();
      let hours = now.getHours();
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const period = hours >= 12 ? '오후' : '오전';
      hours = hours % 12 || 12;
      return `${period} ${hours}:${minutes}`;
    }

    function appendMessage(text, isMe = true, isImage = false) {
      const msgId = 'msg-' + Date.now();
      const group = document.createElement('div');
      group.className = `message-group ${isMe ? 'me' : 'other'}`;
      group.dataset.id = msgId;

      const timeStr = getCurrentTimeStr();

      let contentHtml = isImage 
        ? `<img src="${text}" alt="전송된 이미지" />`
        : escapeHtml(text);

      group.innerHTML = `
        <div class="message-row">
          ${!isMe ? '<div class="avatar">🥕</div>' : ''}
          <div class="bubble-wrapper">
            <div class="bubble ${isImage ? 'image-bubble' : ''}">${contentHtml}</div>
          </div>
          <div class="meta-info">
            ${isMe ? '<span class="unread-count">1</span>' : ''}
            <span class="timestamp">${timeStr}</span>
          </div>
        </div>
      `;

      chatMessages.appendChild(group);
      attachLongPressEvents(group.querySelector('.bubble-wrapper'));
      scrollToBottom(true);
    }

    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }

    function sendMessage() {
      const text = messageInput.value.trim();
      if (!text) return;

      appendMessage(text, true, false);
      messageInput.value = '';
      messageInput.style.height = 'auto';
      sendBtn.classList.remove('active');

      // 상대방 자동 응답 시뮬레이션
      setTimeout(() => {
        const replies = [
          "네, 확인했습니다! 오늘 저녁 7시 직거래 괜찮으신가요?",
          "좋습니다. 대전 유성구 쪽에서 뵐 수 있을까요?",
          "감사합니다! 출발할 때 다시 챗 드릴게요 ㅎㅎ",
          "혹시 충전기랑 케이스도 같이 포함인가요?"
        ];
        const randomReply = replies[Math.floor(Math.random() * replies.length)];
        appendMessage(randomReply, false, false);
      }, 1100);
    }

    // --- 3. 사진 첨부 기능 ---
    photoBtn.addEventListener('click', () => fileInput.click());

    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (event) => {
        appendMessage(event.target.result, true, true);
      };
      reader.readAsDataURL(file);
      fileInput.value = '';
    });

    // --- 4. 이모티콘 피커 ---
    emojiBtn.addEventListener('click', () => {
      emojiDrawer.classList.toggle('open');
      scrollToBottom(true);
    });

    document.querySelectorAll('.emoji-item').forEach(item => {
      item.addEventListener('click', () => {
        messageInput.value += item.textContent;
        messageInput.dispatchEvent(new Event('input'));
        messageInput.focus();
      });
    });

    // --- 5. 롱프레스(길게 누르기) 복사/삭제 메뉴 ---
    let longPressTimer = null;
    let touchStartX = 0;
    let touchStartY = 0;
    let activeTargetGroup = null;
    let activeBubbleText = '';

    function showToast(msg) {
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2000);
    }

    function openContextMenu(x, y, groupEl, text) {
      activeTargetGroup = groupEl;
      activeBubbleText = text;

      contextOverlay.classList.add('active');
      contextMenu.classList.add('show');

      // 메뉴 위치 계산 (화면 밖으로 나가지 않도록 조정)
      const menuWidth = 140;
      const menuHeight = 44;
      const appRect = chatApp.getBoundingClientRect();

      let targetX = x - appRect.left - (menuWidth / 2);
      let targetY = y - appRect.top - menuHeight - 12;

      targetX = Math.max(12, Math.min(targetX, appRect.width - menuWidth - 12));
      if (targetY < 60) {
        targetY = y - appRect.top + 24; // 상단 여유 부족 시 아래쪽에 표시
      }

      contextMenu.style.left = `${targetX}px`;
      contextMenu.style.top = `${targetY}px`;
    }

    function closeContextMenu() {
      contextOverlay.classList.remove('active');
      contextMenu.classList.remove('show');
      activeTargetGroup = null;
      activeBubbleText = '';
    }

    contextOverlay.addEventListener('click', closeContextMenu);

    copyBtn.addEventListener('click', async () => {
      if (activeBubbleText) {
        try {
          await navigator.clipboard.writeText(activeBubbleText);
          showToast('메시지가 복사되었습니다.');
        } catch (err) {
          // Fallback
          const textarea = document.createElement('textarea');
          textarea.value = activeBubbleText;
          document.body.appendChild(textarea);
          textarea.select();
          document.execCommand('copy');
          document.body.removeChild(textarea);
          showToast('메시지가 복사되었습니다.');
        }
      }
      closeContextMenu();
    });

    deleteBtn.addEventListener('click', () => {
      if (activeTargetGroup) {
        activeTargetGroup.style.transition = 'all 0.2s ease';
        activeTargetGroup.style.opacity = '0';
        activeTargetGroup.style.transform = 'scale(0.85)';
        setTimeout(() => {
          activeTargetGroup.remove();
          showToast('메시지가 삭제되었습니다.');
        }, 200);
      }
      closeContextMenu();
    });

    function attachLongPressEvents(wrapper) {
      const bubble = wrapper.querySelector('.bubble');

      const start = (e) => {
        if (e.touches && e.touches.length > 1) return;
        const touch = e.touches ? e.touches[0] : e;
        touchStartX = touch.clientX;
        touchStartY = touch.clientY;

        longPressTimer = setTimeout(() => {
          if (navigator.vibrate) navigator.vibrate(40); // 햅틱 피드백
          const group = wrapper.closest('.message-group');
          const isImg = bubble.classList.contains('image-bubble');
          const text = isImg ? '[사진]' : bubble.innerText;
          openContextMenu(touchStartX, touchStartY, group, text);
        }, 480);
      };

      const move = (e) => {
        if (!longPressTimer) return;
        const touch = e.touches ? e.touches[0] : e;
        const moveDist = Math.hypot(touch.clientX - touchStartX, touch.clientY - touchStartY);
        if (moveDist > 10) { // 스크롤 시 롱프레스 취소
          clearTimeout(longPressTimer);
          longPressTimer = null;
        }
      };

      const end = () => {
        if (longPressTimer) {
          clearTimeout(longPressTimer);
          longPressTimer = null;
        }
      };

      // 터치 이벤트 (모바일)
      wrapper.addEventListener('touchstart', start, { passive: true });
      wrapper.addEventListener('touchmove', move, { passive: true });
      wrapper.addEventListener('touchend', end);
      wrapper.addEventListener('touchcancel', end);

      // 마우스 이벤트 (PC 테스트용)
      wrapper.addEventListener('mousedown', start);
      wrapper.addEventListener('mousemove', move);
      wrapper.addEventListener('mouseup', end);
      wrapper.addEventListener('mouseleave', end);
      wrapper.addEventListener('contextmenu', (e) => e.preventDefault());
    }

    // 기존 렌더링된 말풍선들에 이벤트 등록
    document.querySelectorAll('.bubble-wrapper').forEach(attachLongPressEvents);
    scrollToBottom(false);
  </script>
</body>
</html>
