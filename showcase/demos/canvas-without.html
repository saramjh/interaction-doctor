<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Canvas 2D Editor (Without Skill - Baseline Defects)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, sans-serif; background: #090d16; color: #fff; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
    .header { padding: 12px 16px; background: #131b2e; border-bottom: 1px solid #1e293b; display: flex; justify-content: space-between; font-size: 13px; font-weight: 700; }
    .canvas-stage { flex: 1; position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; background: radial-gradient(#1e293b 1px, transparent 1px); background-size: 20px 20px; }
    
    .artboard {
      width: 220px; height: 220px; background: linear-gradient(135deg, #ef4444, #f97316);
      border-radius: 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.5);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      color: #fff; font-weight: 800; font-size: 15px; text-align: center; gap: 8px;
      user-select: none;
      transition: transform 0.15s ease;
    }
    .hint-pill { position: absolute; bottom: 20px; background: rgba(239, 68, 68, 0.2); border: 1px solid #ef4444; color: #f87171; font-size: 12px; font-weight: 700; padding: 6px 14px; border-radius: 20px; }
  </style>
</head>
<body>
  <div class="header">
    <span>🎨 Baseline AI Canvas</span>
    <span style="color: #ef4444;">❌ e.touches[0] Hardcoded Bug</span>
  </div>
  <div class="canvas-stage" id="stage">
    <div class="artboard" id="artboard">
      <div>💥 Graphic Layer</div>
      <div style="font-size: 11px; opacity: 0.8;">Try 2-finger rotating!</div>
    </div>
    <div class="hint-pill">2-finger rotation jumps wildly off screen!</div>
  </div>

  <script>
    const stage = document.getElementById('stage');
    const artboard = document.getElementById('artboard');
    let scale = 1, rotate = 0;

    // Common AI Bug: naive touch handler indexing only e.touches[0] causing wild jumps
    stage.addEventListener('touchmove', (e) => {
      if (e.touches.length === 2) {
        // Bug: calculates angle from top-left origin instead of centroid
        const dx = e.touches[1].clientX - e.touches[0].clientX;
        const dy = e.touches[1].clientY - e.touches[0].clientY;
        rotate = Math.atan2(dy, dx) * (180 / Math.PI);
        artboard.style.transform = `scale(${scale}) rotate(${rotate}deg)`;
      }
    });
  </script>
</body>
</html>
