<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Kanban Board (Without Skill - Baseline Defects)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, sans-serif; background: #0f172a; color: #fff; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
    .header { padding: 12px 16px; background: #1e293b; border-bottom: 1px solid #334155; font-size: 14px; font-weight: 700; display: flex; justify-content: space-between; }
    .board-container { flex: 1; overflow-x: auto; display: flex; gap: 14px; padding: 16px; }
    .column { width: 260px; background: #1e293b; border-radius: 12px; padding: 12px; flex-shrink: 0; display: flex; flex-direction: column; gap: 10px; }
    .col-title { font-size: 13px; font-weight: 800; color: #ef4444; }
    .card-list { display: flex; flex-direction: column; gap: 8px; flex: 1; }
    .card { background: #0f172a; border: 1px solid #334155; border-radius: 8px; padding: 12px; font-size: 13px; font-weight: 600; cursor: move; }
  </style>
</head>
<body>
  <div class="header">
    <span>📋 Baseline AI Kanban</span>
    <span style="color: #ef4444;">❌ HTML5 Drag API Broken on Mobile</span>
  </div>
  <div class="board-container">
    <div class="column">
      <div class="col-title">💥 Try scrolling board horizontally</div>
      <div class="card-list">
        <div class="card" draggable="true">❌ Immediate Drag blocks scrolling</div>
        <div class="card" draggable="true">❌ HTML5 drag drops on mobile</div>
      </div>
    </div>
  </div>
  <script>
    // Common AI Bug: using HTML5 drag API directly, which completely fails on mobile touchscreens
    document.querySelectorAll('.card').forEach(card => {
      card.addEventListener('dragstart', () => card.style.opacity = '0.5');
      card.addEventListener('dragend', () => card.style.opacity = '1');
    });
  </script>
</body>
</html>
